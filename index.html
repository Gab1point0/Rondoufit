                  >
                    <Plus className="w-4 h-4" />
                    <span>+ Objectif / Exercice</span>
                  </button>

                  <button
                    onClick={() =>
                      setGameState(prev => ({ ...prev, soundEnabled: !prev.soundEnabled }))
                    }
                    title="Activer / couper la Berceuse de Rondoudou"
                    className="p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:border-slate-700 transition"
                  >
                    {gameState.soundEnabled ? (
                      <Volume2 className="w-4 h-4 text-pink-400" />
                    ) : (
                      <VolumeX className="w-4 h-4 text-slate-500" />
                    )}
                  </button>

                  <button
                    onClick={() => setConfirmResetOpen(true)}
                    title="Réinitialiser l'aventure à zéro"
                    className="px-3 py-2.5 rounded-xl bg-slate-900 hover:bg-rose-950/60 border border-slate-800 hover:border-rose-700/60 text-slate-300 hover:text-rose-300 text-xs font-bold flex items-center gap-1.5 transition"
                  >
                    <RefreshCw className="w-3.5 h-3.5" />
                    <span className="hidden sm:inline">Réinitialiser</span>
                  </button>
                </div>
              </div>

              {/* BANDEAU DES 6 ARÈNES & NIVEAUX PAR GROUPE MUSCULAIRE */}
              <div className="bg-slate-950/80 border border-slate-800/90 rounded-2xl p-3.5">
                <div className="flex items-center justify-between mb-2.5">
                  <span className="text-[11px] font-black uppercase tracking-wider text-pink-300 flex items-center gap-1.5">
                    <Award className="w-3.5 h-3.5 text-amber-400" /> Arènes & Niveaux par Groupe Musculaire (Validez vos objectifs pour monter de niveau)
                  </span>
                  {questFilter !== 'all' && (
                    <button
                      onClick={() => setQuestFilter('all')}
                      className="text-[11px] font-bold text-pink-400 hover:underline"
                    >
                      Afficher toutes les Arènes
                    </button>
                  )}
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5">
                  {arenaLevels.map(arena => {
                    const isSelected = questFilter === arena.id;
                    return (
                      <button
                        key={arena.id}
                        type="button"
                        onClick={() => {
                          setActiveTab('quests');
                          setQuestFilter(isSelected ? 'all' : arena.id);
                        }}
                        className={`p-2.5 rounded-xl border text-left transition flex flex-col justify-between ${
                          isSelected
                            ? 'bg-pink-950/40 border-pink-400 shadow-md shadow-pink-500/10'
                            : 'bg-slate-900/90 border-slate-800 hover:border-slate-700'
                        }`}
                      >
                        <div className="flex items-center justify-between gap-1">
                          <span className="text-lg">{arena.icon}</span>
                          <span
                            className={`px-2 py-0.5 rounded-full text-[10px] font-black uppercase bg-gradient-to-r ${arena.color} text-white`}
                          >
                            Niv. {arena.groupLevel}
                          </span>
                        </div>
                        <div className="mt-1.5">
                          <p className="text-xs font-extrabold text-white truncate">
                            {arena.label}
                          </p>
                          <p className="text-[10px] text-slate-400">
                            {arena.questsCount} quête(s) active(s)
                          </p>
                        </div>
                      </button>
                    );

                            <label className="block text-xs font-bold text-violet-300 mb-1">
                              🪢 Aide Élastique Cible en kg (0 = Strict)
                            </label>
                            <input
                              type="number"
                              step="0.5"
                              min="0"
                              value={nextGoalAssistanceKg}
                              onChange={e => setNextGoalAssistanceKg(e.target.value)}
                              className="w-full bg-slate-900 border border-violet-500/40 rounded-xl py-2 text-center font-black text-violet-200"
                            />
                          </div>
                        )}
                      </div>
                    </>
                  ) : (
                    <div className="bg-slate-950 border border-slate-800 rounded-xl p-4">
                      <label className="block text-xs font-bold text-emerald-300 mb-1">
                        Nouvel Objectif Cardio ({levelUpModalQuest.unit})
                      </label>
                      <input
                        type="number"
                        step="0.5"
                        value={nextGoalValue}
                        onChange={e => setNextGoalValue(e.target.value)}
                        className="w-full bg-slate-900 border border-emerald-500/40 rounded-xl py-2 text-center font-black text-emerald-300 text-base"
                      />
                    </div>
                  )}

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setLevelUpModalQuest(null)}
                      className="px-4 py-2.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300"
                    >
                      Plus tard
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2.5 rounded-xl text-xs font-black bg-gradient-to-r from-amber-400 via-orange-500 to-pink-500 text-slate-950 shadow-lg"
                    >
                      Valider Niveau {(Number(levelUpModalQuest.level) || 1) + 1} (+300 EXP)
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODALE 3 : CRÉER OU AJUSTER UN OBJECTIF */}
          {questModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-xl w-full p-5 sm:p-6 shadow-2xl space-y-5 my-8">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-black text-white flex items-center gap-2">
                    <Target className="w-5 h-5 text-pink-400" />
                    <span>
                      {editingQuestId
                        ? 'Ajuster votre Objectif'
                        : 'Nouvel Exercice & Objectif'}
                    </span>
                  </h3>
                  <button
                    onClick={() => setQuestModalOpen(false)}
                    className="p-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleSaveQuestForm} className="space-y-4">
                  {!editingQuestId && (
                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1.5">
                        Choisir un exercice dans le Pokédex
                      </label>
                      <select
                        value={formCatalogId}
                        onChange={e => handleSelectCatalogExercise(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm font-bold text-white"
                      >
                        <optgroup label="🦅 Dos & Poids du Corps">
                          {EXERCISE_CATALOG.filter(c => c.category === 'Dos').map(c => (
                            <option key={c.id} value={c.id}>
                              {c.icon} {c.name}
                            </option>
                          ))}
                          <option value="custom_bodyweight">
                            ✨ Autre exercice au poids du corps personnalisé...
                          </option>
                        </optgroup>
                        <optgroup label="🛡️ Pectoraux">
                          {EXERCISE_CATALOG.filter(c => c.category === 'Pectoraux').map(c => (
                            <option key={c.id} value={c.id}>
                              {c.icon} {c.name}
                            </option>
                          ))}
                        </optgroup>
                        <optgroup label="🦵 Jambes">
                          {EXERCISE_CATALOG.filter(c => c.category === 'Jambes').map(c => (
                            <option key={c.id} value={c.id}>
                              {c.icon} {c.name}
                            </option>
                          ))}
                        </optgroup>
                        <optgroup label="💪 Épaules & Bras">
                          {EXERCISE_CATALOG.filter(c => c.category === 'Épaules & Bras').map(c => (
                            <option key={c.id} value={c.id}>
                              {c.icon} {c.name}
                            </option>
                          ))}
                          <option value="custom_strength">
                            ✨ Autre exercice avec charge (kg) personnalisé...
                          </option>
                        </optgroup>
                        <optgroup label="🍫 Abdominaux & Gainage">
                          {EXERCISE_CATALOG.filter(c => c.category === 'Abdominaux').map(c => (
                            <option key={c.id} value={c.id}>
                              {c.icon} {c.name}
                            </option>
                          ))}
                        </optgroup>
                        <optgroup label="🏃 Course à pied, Marche & Cardio">
                          {EXERCISE_CATALOG.filter(c => c.type === 'cardio').map(c => (
                            <option key={c.id} value={c.id}>
                              {c.icon} {c.name} ({c.unit})
                            </option>
                          ))}
                        </optgroup>
                      </select>
                    </div>
                  )}

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-400 mb-1">
                        Nom de l’exercice
                      </label>
                      <input
                        type="text"
                        required
                        value={formCustomName}
                        onChange={e => setFormCustomName(e.target.value)}
                        placeholder="Ex: Tractions Pronation"
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm font-bold text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-400 mb-1">
                        Arène / Groupe Musculaire
                      </label>
                      <select
                        value={formCategory}
                        onChange={e => setFormCategory(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm font-bold text-white"
                      >
                        {ARENA_GROUPS.map(g => (
                          <option key={g.id} value={g.id}>
                            {g.icon} {g.label}
                          </option>
                        ))}
                      </select>
                    </div>
                  </div>

                  {formType === 'strength' && (
                    <div className="bg-pink-950/20 border border-pink-500/30 rounded-2xl p-4 space-y-3">
                      <label className="block text-xs font-black uppercase tracking-wider text-pink-300">
                        🎯 Choisir le Type d’Objectif
                      </label>
                      <div className="grid grid-cols-3 gap-2">
                        {[
                          {
                            id: 'weight_only',
                            title: '🏋️ Poids (kg)',
                            desc: 'Atteindre un poids en kg'
                          },
                          {
                            id: 'reps_only',
                            title: '🔁 Répétitions',
                            desc: 'Nombre de reps cible'
                          },
                          {
                            id: 'sets_reps',
                            title: '🛡️ Séries × Reps',
                            desc: 'Ex: 3 séries de 6 reps'
                          },
			{
                            id: 'free_mode',
                            title: '🕊️ Mode Libre',
                            desc: 'Noter sans objectif fixe'
                          }
                        ].map(mode => (
                          <button
                            key={mode.id}
                            type="button"
                            onClick={() => {
                              setFormGoalMode(mode.id);
                              if (mode.id === 'weight_only') setFormUnit('kg');
                            }}
                            className={`p-2.5 rounded-xl border text-left transition ${
                              formGoalMode === mode.id
                                ? 'bg-pink-600 border-pink-400 text-white shadow'
                                : 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-700'
                            }`}
                          >
                            <div className="text-xs font-black">{mode.title}</div>
                            <div className="text-[10px] opacity-80 mt-0.5">{mode.desc}</div>
                          </button>
                        ))}
                      </div>

                      {formGoalMode === 'sets_reps' && (
                        <div className="space-y-2.5 pt-2">
                          <div className="flex flex-wrap gap-1.5">
                            {SETS_REPS_PRESETS.map(preset => {
                              const active =
                                Number(formGoalSets) === preset.sets &&
                                Number(formGoalReps) === preset.reps;
                              return (
                                <button
                                  key={preset.label}
                                  type="button"
                                  onClick={() => {
                                    setFormGoalSets(preset.sets);
                                    setFormGoalReps(preset.reps);
                                    if (formUnit === 'reps') setFormGoalValue(preset.reps);
                                  }}
                                  className={`px-3 py-1 rounded-xl text-xs font-extrabold border transition ${
                                    active
                                      ? 'bg-indigo-600 border-indigo-400 text-white'
                                      : 'bg-slate-900 border-slate-800 text-slate-300'
                                  }`}
                                >
                                  {preset.label}
                                </button>
                              );
                            })}
                          </div>

                          <div className="grid grid-cols-2 gap-3">
                            <div>
                              <label className="block text-[11px] font-bold text-slate-300 mb-1">
                                Nombre de séries cibles
                              </label>
                              <input
                                type="number"
                                min="1"
                                max="15"
                                value={formGoalSets}
                                onChange={e => setFormGoalSets(e.target.value)}
                                className="w-full bg-slate-950 border border-slate-700 rounded-xl py-2 text-center font-black text-white"
                              />
                            </div>
                            <div>
                              <label className="block text-[11px] font-bold text-slate-300 mb-1">
                                Répétitions par série
                              </label>
                              <input
                                type="number"
                                min="1"
                                max="100"
                                value={formGoalReps}
                                onChange={e => {
                                  setFormGoalReps(e.target.value);
                                  if (formUnit === 'reps') setFormGoalValue(e.target.value);
                                }}
                                className="w-full bg-slate-950 border border-slate-700 rounded-xl py-2 text-center font-black text-white"
                              />
                            </div>
                          </div>
                        </div>
                      )}

                      {formGoalMode === 'reps_only' && (
                        <div className="pt-2">
                          <label className="block text-[11px] font-bold text-pink-200 mb-1">
                            Objectif de répétitions à atteindre
                          </label>
                          <input
                            type="number"
                            min="1"
                            max="200"
                            value={formGoalReps}
                            onChange={e => {
                              setFormGoalReps(e.target.value);
                              if (formUnit === 'reps') setFormGoalValue(e.target.value);
                            }}
                            className="w-full bg-slate-950 border border-pink-500/40 rounded-xl py-2 text-center font-black text-white"
                          />
                        </div>
                      )}
                    </div>
                  )}

                  {formType === 'strength' && formUnit === 'reps' && formGoalMode !== 'weight_only' && (
                    <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-[11px] font-bold text-violet-300 mb-1">
                            🪢 Aide Élastique Départ (kg)
                          </label>
                          <input
                            type="number"
                            step="0.5"
                            min="0"
                            value={formStartAssistanceKg}
                            onChange={e => setFormStartAssistanceKg(e.target.value)}
                            className="w-full bg-slate-900 border border-violet-500/30 rounded-xl py-2 text-center font-bold text-violet-200"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-bold text-emerald-300 mb-1">
                            🦅 Aide Cible Objectif (0 = Strict)
                          </label>
                          <input
                            type="number"
                            step="0.5"
                            min="0"
                            value={formGoalAssistanceKg}
                            onChange={e => setFormGoalAssistanceKg(e.target.value)}
                            className="w-full bg-slate-900 border border-emerald-500/30 rounded-xl py-2 text-center font-bold text-emerald-300"
                          />
                        </div>
                      </div>
                    </div>
                  )}

                  {formType === 'strength' && (formUnit === 'kg' || formGoalMode === 'weight_only') && (
                    <div className="grid grid-cols-2 gap-3 bg-slate-950 border border-slate-800 rounded-xl p-4">
                      <div>
                        <label className="block text-[11px] font-bold text-slate-400 mb-1">
                          Charge de départ (kg)
                        </label>
                        <input
                          type="number"
                          step="0.5"
                          value={formStartValue}
                          onChange={e => {
                            setFormStartValue(e.target.value);
                            if (!editingQuestId) setFormCurrentValue(e.target.value);
                          }}
                          className="w-full bg-slate-900 border border-slate-700 rounded-xl py-2 text-center font-bold text-white"
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] font-bold text-amber-300 mb-1">
                          Charge Objectif (kg)
                        </label>
                        <input
                          type="number"
                          step="0.5"
                          value={formGoalValue}
                          onChange={e => setFormGoalValue(e.target.value)}
                          className="w-full bg-slate-900 border border-amber-500/40 rounded-xl py-2 text-center font-black text-amber-300"
                        />
                      </div>
                    </div>
                  )}

                  {formType === 'cardio' && (
                    <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
                      <div className="flex gap-2">
                        <button type="button" onClick={() => setFormGoalMode('distance_duration')} className={`flex-1 py-2 rounded-xl text-xs font-bold transition ${formGoalMode !== 'free_mode' ? 'bg-emerald-600 text-white' : 'bg-slate-900 border border-slate-700 text-slate-400'}`}>🎯 Mode Objectif</button>
                        <button type="button" onClick={() => setFormGoalMode('free_mode')} className={`flex-1 py-2 rounded-xl text-xs font-bold transition ${formGoalMode === 'free_mode' ? 'bg-emerald-600 text-white' : 'bg-slate-900 border border-slate-700 text-slate-400'}`}>🕊️ Mode Libre</button>
                      </div>
                      {formGoalMode !== 'free_mode' && (
                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="block text-[11px] font-bold text-slate-400 mb-1">Départ ({formUnit})</label>
                            <input type="number" step="0.5" value={formStartValue} onChange={e => { setFormStartValue(e.target.value); setFormCurrentValue(e.target.value); }} className="w-full bg-slate-900 border border-slate-700 rounded-xl py-2 text-center font-bold text-white" />
                          </div>
                          <div>
                            <label className="block text-[11px] font-bold text-emerald-300 mb-1">Objectif ({formUnit})</label>
                            <input type="number" step="0.5" value={formGoalValue} onChange={e => setFormGoalValue(e.target.value)} className="w-full bg-slate-900 border border-emerald-500/40 rounded-xl py-2 text-center font-black text-emerald-300" />
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setQuestModalOpen(false)}
                      className="px-4 py-2.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300"
                    >
                      Annuler
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2.5 rounded-xl text-xs font-black bg-gradient-to-r from-pink-600 to-purple-600 text-white shadow-lg"
                    >
                      {editingQuestId ? 'Enregistrer l’Objectif' : 'Créer la Quête'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODALE 4 : AJOUT RAPIDE "+ COURSE / MARCHE DU JOUR" */}
          {quickCardioModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-emerald-500/40 rounded-2xl max-w-md w-full p-5 sm:p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2.5">
                    <Footprints className="w-6 h-6 text-emerald-400" />
                    <div>
                      <h3 className="text-base font-black text-white">
                        Ajouter une Course ou Marche du jour
                      </h3>
                      <p className="text-xs text-slate-400">
                        S’ajoute au bilan calorique et au Journal des Séances
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => setQuickCardioModalOpen(false)}
                    className="p-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white"
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>

                <form onSubmit={handleSaveQuickCardio} className="space-y-3.5">
                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1">
                      Type de sortie cardio
                    </label>
                    <select
                      value={quickCardioCatalogId}
                      onChange={e => setQuickCardioCatalogId(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs font-bold text-white"
                    >
                      {EXERCISE_CATALOG.filter(c => c.type === 'cardio').map(c => (
                        <option key={c.id} value={c.id}>
                          {c.icon} {c.name}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div className="grid grid-cols-3 gap-2.5">
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400 mb-1">
                        Distance (km)
                      </label>
                      <input
                        type="number"
                        step="0.1"
                        min="0.1"
                        value={quickCardioDistanceKm}
                        onChange={e => setQuickCardioDistanceKm(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl py-2 text-center font-black text-white text-sm"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400 mb-1">
                        Durée (min)
                      </label>
                      <input
                        type="number"
                        min="1"
                        value={quickCardioDurationMin}
                        onChange={e => setQuickCardioDurationMin(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl py-2 text-center font-black text-white text-sm"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400 mb-1">
                        Dénivelé D+ (m)
                      </label>
                      <input
                        type="number"
                        min="0"
                        value={quickCardioElevationM}
                        onChange={e => setQuickCardioElevationM(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl py-2 text-center font-black text-white text-sm"
                      />
                    </div>
                  </div>

                  <div className="bg-emerald-950/30 border border-emerald-500/30 rounded-xl p-3 flex items-center justify-between text-xs">
                    <div>
                      <span className="text-slate-400 block">Allure & Vitesse</span>
                      <span className="font-extrabold text-emerald-300">
                        {formatPaceAndSpeed(quickCardioDistanceKm, quickCardioDurationMin).pace} •{' '}
                        {formatPaceAndSpeed(quickCardioDistanceKm, quickCardioDurationMin).speed}
                      </span>
                    </div>
                    <div className="text-right">
                      <span className="text-orange-300 block font-bold">Dépense estimée</span>
                      <span className="text-base font-black text-orange-300">
                        🔥 {liveQuickCardioCalories} kcal
                      </span>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2.5">
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400 mb-1">
                        Date
                      </label>
                      <input
                        type="date"
                        value={quickCardioDate}
                        onChange={e => setQuickCardioDate(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs font-bold text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400 mb-1">
                        Intensité RPE ({quickCardioRpe}/10)
                      </label>
                      <input
                        type="range"
                        min="5"
                        max="10"
                        value={quickCardioRpe}
                        onChange={e => setQuickCardioRpe(Number(e.target.value))}
                        className="w-full accent-emerald-500 mt-2"
                      />
                    </div>
                  </div>

                  <input
                    type="text"
                    placeholder="Note (ex: Footing matinal, marche rapide...)"
                    value={quickCardioNote}
                    onChange={e => setQuickCardioNote(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                  />

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setQuickCardioModalOpen(false)}
                      className="px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300"
                    >
                      Annuler
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-xl text-xs font-black bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-lg"
                    >
                      Ajouter au Bilan du Jour
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODALE 5 : AVERTISSEMENT DE RÉINITIALISATION SÉCURISÉ */}
          {confirmResetOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border-2 border-rose-500/70 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center gap-3">
                  <div className="w-12 h-12 rounded-2xl bg-rose-500/20 border border-rose-500/40 flex items-center justify-center text-rose-400 shrink-0">
                    <AlertTriangle className="w-6 h-6" />
                  </div>
                  <div>
                    <h3 className="text-base font-black text-white">
                      Alerte du Professeur Chen : Réinitialiser ?
                    </h3>
                    <p className="text-xs text-slate-400">
                      Attention, cette action effacera votre progression actuelle.
                    </p>
                  </div>
                </div>

                <div className="space-y-2 pt-2">
                  <button
                    type="button"
                    onClick={() => handleResetAll(false)}
                    className="w-full py-2.5 px-4 rounded-xl text-xs font-black bg-rose-600 hover:bg-rose-500 text-white transition"
                  >
                    🔄 Réinitialiser au Jour 1 (avec les exercices de base)
                  </button>
                  <button
                    type="button"
                    onClick={() => handleResetAll(true)}
                    className="w-full py-2.5 px-4 rounded-xl text-xs font-bold bg-slate-800 hover:bg-rose-950 text-rose-300 border border-rose-500/30 transition"
                  >
                    🧹 Réinitialiser avec une page vierge (0 exercice)
                  </button>
                  <button
                    type="button"
                    onClick={() => setConfirmResetOpen(false)}
                    className="w-full py-2.5 px-4 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:text-white transition"
                  >
                    Annuler et garder ma progression
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
