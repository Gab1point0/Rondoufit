    // ==========================================
    // LES 6 ARÈNES / GROUPES MUSCULAIRES
    // ==========================================
    const ARENA_GROUPS = [
      { id: 'Dos', label: 'Dos', icon: '🦅', badgeName: 'Badge Aile', color: 'from-violet-500 to-indigo-600' },
      { id: 'Pectoraux', label: 'Pectoraux', icon: '🛡️', badgeName: 'Badge Armure', color: 'from-pink-500 to-rose-600' },
      { id: 'Jambes', label: 'Jambes', icon: '🦵', badgeName: 'Badge Séisme', color: 'from-amber-500 to-orange-600' },

{ id: 'Volley-ball', label: 'Volley-ball', icon: '🏐', badgeName: 'Badge Smash', color: 'from-sky-400 to-blue-600' }
    ];

    function normalizeArenaGroup(category = '', type = 'strength') {
if (category.toLowerCase().includes('volley')) return 'Volley-ball';
      if (type === 'cardio' || category.toLowerCase().includes('course') || category.toLowerCase().includes('cardio')) {
        return 'Course & Cardio';
      }
      const c = category.toLowerCase();
      if (c.includes('abdo') || c.includes('gainage')) return 'Abdominaux';
      if (c.includes('dos')) return 'Dos';
      if (c.includes('pec')) return 'Pectoraux';
      if (c.includes('jambe') || c.includes('cuisse') || c.includes('mollet')) return 'Jambes';
      if (c.includes('épaule') || c.includes('epaule') || c.includes('bras') || c.includes('biceps') || c.includes('triceps')) {
        return 'Épaules & Bras';
      }
      return 'Pectoraux';
    }

    // ==========================================
    // AVATAR RONDOUDOU ÉVOLUTIF (10 STADES CACHÉS SELON L'ÉCART DE POIDS)
    // ==========================================
    function computeRondoudouStage(currentWeightKg, targetWeightKg) {
      const curr = Number(currentWeightKg) || 85;
      const targ = Number(targetWeightKg) || 75;
      const diff = Math.max(0, Math.abs(curr - targ));
      if (diff <= 0.4) return 10;
      return Math.max(1, Math.min(9, 11 - Math.min(10, Math.ceil(diff))));
    }

    function JigglypuffAvatar({ currentWeightKg, targetWeightKg, size = 68 }) {
      const stage = computeRondoudouStage(currentWeightKg, targetWeightKg);
      const t = (stage - 1) / 9;
      const bodyRx = Math.round(45 - t * 12);
      const bodyRy = Math.round(42 - t * 10);

      const isVeryChubby = stage <= 3;
      const hasHeadband = stage >= 4;
      const hasMic = stage >= 5;
      const hasDumbbell = stage >= 3;
      const hasTone = stage >= 7;
      const hasSixPack = stage >= 8;
      const isChampion = stage >= 9;

      return (
        <svg viewBox="0 0 120 120" width={size} height={size} className="overflow-visible select-none drop-shadow-md">
          <defs>
            <radialGradient id="jpBodyGrad" cx="38%" cy="32%" r="68%">
              <stop offset="0%" stopColor="#ffd6e8" />
              <stop offset="55%" stopColor="#ff9ebb" />
              <stop offset="100%" stopColor="#e66b96" />
            </radialGradient>
            <radialGradient id="jpEyeGrad" cx="40%" cy="35%" r="65%">
              <stop offset="0%" stopColor="#67e8f9" />
              <stop offset="60%" stopColor="#0d9488" />
              <stop offset="100%" stopColor="#115e59" />
            </radialGradient>
            <radialGradient id="jpAuraGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stopColor="#fbbf24" stopOpacity="0.45" />
              <stop offset="100%" stopColor="#f43f5e" stopOpacity="0" />
            </radialGradient>
          </defs>

          {isChampion && <circle cx="60" cy="62" r="54" fill="url(#jpAuraGrad)" />}

          <ellipse cx="60" cy="108" rx={bodyRx * 0.85} ry="6" fill="rgba(0,0,0,0.35)" />

          <ellipse cx={60 - bodyRx * 0.45} cy="102" rx={isVeryChubby ? 14 : 11} ry="6.5" transform="rotate(-12 42 102)" fill="#e66b96" stroke="#831843" strokeWidth="2" />
          <ellipse cx={60 + bodyRx * 0.45} cy="102" rx={isVeryChubby ? 14 : 11} ry="6.5" transform="rotate(12 78 102)" fill="#e66b96" stroke="#831843" strokeWidth="2" />

          <polygon points={`${60 - bodyRx * 0.75},42 ${60 - bodyRx * 0.92},15 ${60 - bodyRx * 0.32},26`} fill="url(#jpBodyGrad)" stroke="#831843" strokeWidth="2.5" strokeLinejoin="round" />
          <polygon points={`${60 - bodyRx * 0.7},36 ${60 - bodyRx * 0.84},20 ${60 - bodyRx * 0.42},28`} fill="#4c1d95" />

          <polygon points={`${60 + bodyRx * 0.75},42 ${60 + bodyRx * 0.92},15 ${60 + bodyRx * 0.32},26`} fill="url(#jpBodyGrad)" stroke="#831843" strokeWidth="2.5" strokeLinejoin="round" />
          <polygon points={`${60 + bodyRx * 0.7},36 ${60 + bodyRx * 0.84},20 ${60 + bodyRx * 0.42},28`} fill="#4c1d95" />

          <ellipse cx="60" cy="63" rx={bodyRx} ry={bodyRy} fill="url(#jpBodyGrad)" stroke="#831843" strokeWidth="2.6" />

          {stage === 1 && (
            <>
              <path d="M 24 72 Q 16 84 29 90" fill="#ff9ebb" stroke="#9d174d" strokeWidth="2" />
              <path d="M 96 72 Q 104 84 91 90" fill="#ff9ebb" stroke="#9d174d" strokeWidth="2" />
              <path d="M 42 84 Q 60 92 78 84" fill="none" stroke="#be185d" strokeWidth="2" strokeLinecap="round" />
              <path d="M 36 91 Q 60 100 84 91" fill="none" stroke="#be185d" strokeWidth="2" strokeLinecap="round" />
            </>
          )}
          {stage === 2 && (
            <>
              <path d="M 44 85 Q 60 92 76 85" fill="none" stroke="#be185d" strokeWidth="1.8" strokeLinecap="round" />
              <path d="M 40 91 Q 60 98 80 91" fill="none" stroke="#be185d" strokeWidth="1.6" strokeLinecap="round" />
            </>
          )}
          {(stage === 3 || stage === 4) && (
            <path d="M 46 87 Q 60 93 74 87" fill="none" stroke="#be185d" strokeWidth="1.5" strokeLinecap="round" opacity="0.7" />
          )}

          {hasTone && (
            <g stroke="#be185d" strokeLinecap="round" fill="none" opacity={stage >= 9 ? 0.85 : 0.55}>
              <path d="M 45 71 Q 52 75 59 71" strokeWidth="1.8" />
              <path d="M 61 71 Q 68 75 75 71" strokeWidth="1.8" />
              {hasSixPack && (
                <>
                  <line x1="60" y1="73" x2="60" y2="91" strokeWidth="1.8" />

                  <rect x="61.5" y="83" width="8.5" height="6" rx="2" strokeWidth="1.5" />

          {stage === 10 && (
            <g>
              <path d="M 31 90 Q 60 96 89 90" fill="none" stroke="#fbbf24" strokeWidth="4" />

          {hasHeadband && (
            <path d={`M ${60 - bodyRx * 0.88} 38 Q 60 45 ${60 + bodyRx * 0.88} 38`} fill="none" stroke={stage >= 9 ? '#f59e0b' : '#ef4444'} strokeWidth="5" strokeLinecap="round" />

          <path d="M 55 24 C 44 12, 74 10, 69 27 C 66 36, 53 35, 56 27 C 58 23, 64 25, 62 29" fill="url(#jpBodyGrad)" stroke="#831843" strokeWidth="2.4" strokeLinecap="round" />

          {stage === 10 && (
            <polygon points="48,18 53,8 60,14 67,8 72,18" fill="#fbbf24" stroke="#92400e" strokeWidth="1.5" strokeLinejoin="round" />

          <g>
            <circle cx="45" cy="54" r={isVeryChubby ? 9.5 : 11} fill="#ffffff" stroke="#831843" strokeWidth="2" />
            <circle cx="46" cy="54" r={isVeryChubby ? 6.8 : 8} fill="url(#jpEyeGrad)" />
            <circle cx="43.5" cy="51" r="2.8" fill="#ffffff" />
            <circle cx="48" cy="56.5" r="1.3" fill="#ffffff" />

            <circle cx="75" cy="54" r={isVeryChubby ? 9.5 : 11} fill="#ffffff" stroke="#831843" strokeWidth="2" />

            <circle cx="71.5" cy="51" r="2.8" fill="#ffffff" />
            <circle cx="76" cy="56.5" r="1.3" fill="#ffffff" />

            {stage <= 2 && (
              <>

                <path d="M 65 49 Q 75 53 85 49" fill="#ff9ebb" stroke="#831843" strokeWidth="1.8" />

            {stage >= 6 && (

              </>
            )}
          </g>

          <ellipse cx={isVeryChubby ? 30 : 33} cy="64" rx={isVeryChubby ? 7.5 : 5} ry={isVeryChubby ? 4.5 : 3} fill="#f43f5e" opacity="0.55" />

          {stage <= 2 && (
            <path d="M 95 36 C 95 36, 99 43, 95 46 C 91 43, 95 36, 95 36 Z" fill="#38bdf8" stroke="#0284c7" strokeWidth="1.2" />
          )}

          {stage <= 2 ? (
            <ellipse cx="60" cy="66" rx="4.5" ry="3.5" fill="#9d174d" />
          ) : stage >= 7 ? (
            <path d="M 52 63 Q 60 72 68 63 Z" fill="#be185d" stroke="#831843" strokeWidth="1.8" />
          ) : (
            <path d="M 54 64 Q 60 70 66 64" fill="none" stroke="#831843" strokeWidth="2.2" strokeLinecap="round" />
          )}

          {hasTone ? (
            <path d={`M ${60 - bodyRx + 3} 62 Q 12 48 22 36 Q 28 32 31 44`} fill="url(#jpBodyGrad)" stroke="#831843" strokeWidth="2.4" />
          ) : (
            <ellipse cx={60 - bodyRx + 2} cy="67" rx="9" ry="5.5" transform="rotate(20 22 67)" fill="url(#jpBodyGrad)" stroke="#831843" strokeWidth="2" />
          )}

          {hasMic && (
            <g transform={hasTone ? 'translate(12, 24) rotate(-20)' : 'translate(8, 52) rotate(-25)'}>
              <rect x="4" y="8" width="4.5" height="13" rx="2" fill="#334155" stroke="#0f172a" strokeWidth="1.2" />
              <circle cx="6.2" cy="6" r="5.5" fill="#10b981" stroke="#064e3b" strokeWidth="1.5" />
            </g>
          )}

          {hasTone ? (
            <path d={`M ${60 + bodyRx - 3} 62 Q 108 48 98 36 Q 92 32 89 44`} fill="url(#jpBodyGrad)" stroke="#831843" strokeWidth="2.4" />
          ) : (
            <ellipse cx={60 + bodyRx - 2} cy="67" rx="9" ry="5.5" transform="rotate(-20 98 67)" fill="url(#jpBodyGrad)" stroke="#831843" strokeWidth="2" />
          )}

          {hasDumbbell && (
            <g transform={hasTone ? 'translate(88, 22) rotate(18)' : 'translate(88, 56) rotate(15)'}>
              <line x1="0" y1="8" x2="20" y2="8" stroke="#94a3b8" strokeWidth="3" />

    // Sélecteur d'exercice avec barre de recherche
    function ExercisePicker({ value, onSelect }) {
      const [query, setQuery] = useState('');
      const [filter, setFilter] = useState('all');
      const FILTERS = [['all', 'Tous'], ['Dos', '🦅 Dos'], ['Pectoraux', '🛡️ Pecs'], ['Jambes', '🦵 Jambes'], ['Épaules & Bras', '💪 Épaules/Bras'], ['Abdominaux', '🍫 Abdos'], ['cardio', '🏃 Cardio']];
      const ORDER = ['Dos', 'Pectoraux', 'Jambes', 'Épaules & Bras', 'Abdominaux', 'Course & Cardio', 'Volley-ball'];
      const tokens = normSearch(query).split(/\s+/).filter(Boolean);
      const results = EXERCISE_CATALOG
        .filter(c => {
          const inFilter = filter === 'all' || (filter === 'cardio' ? c.type === 'cardio' : c.category === filter && c.type !== 'cardio');
          if (!inFilter) return false;
          const hay = normSearch(`${c.name} ${c.category} ${c.equip || ''}`);
          return tokens.every(t => hay.includes(t));
        })
        .sort((a, b) => ORDER.indexOf(a.category) - ORDER.indexOf(b.category));
      const selected = EXERCISE_CATALOG.find(c => c.id === value);
      return (
        <div className="space-y-2">
          <div className="text-xs text-pink-300 font-bold">
            Sélection : {selected ? `${selected.icon} ${selected.name}` : String(value).startsWith('custom') ? '✨ Exercice personnalisé' : '—'}
          </div>
          <input
            type="search"
            value={query}
            onChange={e => setQuery(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') e.preventDefault(); }}
            placeholder="🔍 Rechercher : pec deck, hammer, haltères, mollets, poulie…"
            className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white"
          />
          <div className="flex flex-wrap gap-1.5">
            {FILTERS.map(([id, label]) => (
              <button
                key={id}
                type="button"
                onClick={() => setFilter(id)}
                className={`px-2.5 py-1 rounded-full text-[11px] font-bold border ${
                  filter === id ? 'bg-pink-600 border-pink-400 text-white' : 'bg-slate-900 border-slate-700 text-slate-300'
                }`}
              >
                {label}
              </button>
            ))}
          </div>
          <div className="text-[11px] text-slate-500">{results.length} exercice(s)</div>
          <div className="max-h-56 overflow-y-auto space-y-1 pr-1 border border-slate-800 rounded-xl p-1.5 bg-slate-950">
            {results.map(c => (
              <button
                key={c.id}
                type="button"
                onClick={() => onSelect(c.id)}
                className={`w-full text-left px-2.5 py-2 rounded-lg text-sm flex items-center justify-between gap-2 border ${
                  c.id === value ? 'bg-pink-600/20 border-pink-500 text-white' : 'border-transparent hover:bg-slate-800 text-slate-200'
                }`}
              >
                <span className="font-semibold truncate">{c.icon} {c.name}</span>
                <span className="shrink-0 text-[10px] font-bold text-slate-400 bg-slate-800 rounded-full px-2 py-0.5">{c.equip || (c.type === 'cardio' ? 'Cardio' : c.unit === 'kg' ? 'Charge' : 'Poids du corps')}</span>
              </button>
            ))}
            {results.length === 0 && <p className="text-xs text-slate-400 p-2">Aucun résultat. Créez un exercice personnalisé ci-dessous.</p>}

              ✨ Autre exercice au poids du corps personnalisé…

            <button type="button" onClick={() => onSelect('custom_strength')} className="w-full text-left px-2.5 py-2 rounded-lg text-sm text-pink-300 hover:bg-slate-800 font-bold">
              ✨ Autre exercice avec charge (kg) personnalisé…
            </button>

      );
    }

    const SETS_REPS_PRESETS = [

    // Série en cours : jours consécutifs avec séance (jusqu'à aujourd'hui, ou hier si rien aujourd'hui)
    function computeCurrentStreak(quests) {
      const days = new Set();
      (quests || []).forEach(q =>
        (q.history || []).forEach(h => {
          if (h.date && !String(h.note || '').startsWith('Point de départ')) days.add(h.date);
        })
      );
      const d = new Date();
      if (!days.has(toLocalISODate(d))) d.setDate(d.getDate() - 1);
      let streak = 0;
      while (days.has(toLocalISODate(d))) { streak++; d.setDate(d.getDate() - 1); }
      return streak;
    }

    // ---------- Données dérivées (stats, semaine, défis, records) ----------
    const isStartEntry = h => String(h.note || '').startsWith('Point de départ');
    const isVolleyQuest = q => /volley/i.test(`${q.category || ''} ${q.catalogId || ''} ${q.name || ''}`);
    const getAllEntries = state =>
      (state.quests || []).flatMap(q => (q.history || []).filter(h => !isStartEntry(h)).map(h => ({ ...h, quest: q })));
    const entryReps = e =>
      Array.isArray(e.setDetails)
        ? e.setDetails.reduce((a, r) => a + (Number(r) || 0), 0)
        : e.quest.type === 'strength' ? (Number(e.sets) || 0) * (Number(e.reps) || 0) : 0;
    const entryVolume = e => (e.quest.type === 'strength' && e.quest.unit === 'kg' ? entryReps(e) * (Number(e.value) || 0) : 0);
    const entryKm = e =>
      e.quest.type !== 'cardio' ? 0 : Number(e.distanceKm) || (e.quest.unit === 'km' ? Number(e.value) || 0 : 0);
    const isRunQuest = q => ['run', 'interval'].includes(q.cardioMode) || /course|running/i.test(`${q.catalogId || ''} ${q.name || ''}`);

    function addDaysISO(dateStr, n) {
      const d = new Date(dateStr + 'T00:00:00');
      d.setDate(d.getDate() + n);
      return toLocalISODate(d);
    }
    function getWeekStart(dateStr) {
      const d = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
      d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      return toLocalISODate(d);
    }
    function computeWeekStats(entries, weekStart) {
      const end = addDaysISO(weekStart, 6);
      const wk = entries.filter(e => e.date >= weekStart && e.date <= end);
      return {
        sessions: wk.length,
        days: new Set(wk.map(e => e.date)).size,
        kcal: wk.reduce((s, e) => s + (Number(e.calories) || 0), 0),
        km: Math.round(wk.reduce((s, e) => s + entryKm(e), 0) * 10) / 10,
        volume: Math.round(wk.reduce((s, e) => s + entryVolume(e), 0)),
        reps: wk.reduce((s, e) => s + entryReps(e), 0),
        arenas: new Set(wk.map(e => normalizeArenaGroup(e.quest.category || '', e.quest.type))).size,
        volley: wk.filter(e => isVolleyQuest(e.quest)).length
      };
    }
    const CHALLENGE_POOL = [
      { id: 'sessions', icon: '💪', title: 'Assidu', desc: 'Enregistrer 4 séances', key: 'sessions', target: 4, xp: 150 },
      { id: 'days', icon: '📆', title: 'Régulier', desc: 'S’entraîner 3 jours différents', key: 'days', target: 3, xp: 150 },
      { id: 'kcal', icon: '🔥', title: 'Fournaise', desc: 'Brûler 800 kcal', key: 'kcal', target: 800, xp: 200 },
      { id: 'km', icon: '🏃', title: 'Globe-trotteur', desc: 'Parcourir 10 km', key: 'km', target: 10, xp: 200 },
      { id: 'arenas', icon: '🧭', title: 'Touche-à-tout', desc: 'Travailler 3 groupes différents', key: 'arenas', target: 3, xp: 150 },
      { id: 'reps', icon: '🔁', title: 'Marathon de reps', desc: 'Cumuler 150 répétitions', key: 'reps', target: 150, xp: 150 },
      { id: 'volley', icon: '🏐', title: 'Match de la semaine', desc: 'Jouer 1 séance de volley', key: 'volley', target: 1, xp: 120 }
    ];
    function getWeekChallenges(weekStart) {
      const n = Math.floor(Date.parse(weekStart + 'T00:00:00Z') / 604800000);
      return [0, 1, 2].map(k => {
        const c = CHALLENGE_POOL[(n + k * 2) % CHALLENGE_POOL.length];
        return { ...c, uid: `${weekStart}:${c.id}` };
      });
    }

    function computePersonalRecords(state) {
      const out = [];
      (state.quests || []).forEach(q => {
        const es = (q.history || []).filter(h => !isStartEntry(h));
        if (!es.length) return;
        const pick = get => es.reduce((b, h) => { const v = get(h); return b === null || v > b.v ? { v, date: h.date } : b; }, null);
        const recs = [];
        if (q.type === 'cardio') {
          const m = pick(h => Number(h.value) || 0);
          recs.push({ key: `${q.id}:main`, label: q.unit === 'km' ? 'Plus longue distance' : 'Plus longue durée', text: `${m.v} ${q.unit}`, score: m.v, date: m.date });
        } else {
          const setMax = h => (Array.isArray(h.setDetails) ? Math.max(0, ...h.setDetails.map(Number)) : Number(h.reps) || 0);
          if (q.unit === 'kg') {
            const k = pick(h => Number(h.value) || 0);
            recs.push({ key: `${q.id}:kg`, label: 'Charge max', text: `${k.v} kg`, score: k.v, date: k.date });
          }
          const r = pick(setMax);
          recs.push({ key: `${q.id}:reps`, label: 'Meilleure série', text: `${r.v} reps`, score: r.v, date: r.date });
          if (q.unit === 'reps') {
            const wa = es.filter(h => h.assistanceKg !== undefined && h.assistanceKg !== null);
            if (wa.length) {
              const m = wa.reduce((b, h) => (Number(h.assistanceKg) < Number(b.assistanceKg) ? h : b));
              recs.push({ key: `${q.id}:assist`, label: 'Aide minimale', text: Number(m.assistanceKg) === 0 ? 'Strict (0 kg)' : `${m.assistanceKg} kg d’aide`, score: -Number(m.assistanceKg), date: m.date });
            }
          }
        }
        out.push({ id: q.id, name: q.name, icon: q.icon, recs });
      });
      return out;
    }

    function computeAchievementStats(state) {
      const entries = getAllEntries(state);
      const perDay = {};
      entries.forEach(e => { if (e.date) (perDay[e.date] = perDay[e.date] || new Set()).add(e.quest.id); });
      let run = 0, bestRun = 0, prev = null;
      Object.keys(perDay).sort().forEach(d => {
        const t = Date.parse(d + 'T00:00:00Z');
        run = prev !== null && Math.round((t - prev) / 86400000) === 1 ? run + 1 : 1;
        prev = t;
        if (run > bestRun) bestRun = run;
      });
      const arenaIds = ARENA_GROUPS.map(g => g.id);
      return {
        sessions: entries.length,
        kcal: entries.reduce((s, e) => s + (Number(e.calories) || 0), 0),
        maxPerDay: Math.max(0, ...Object.values(perDay).map(x => x.size)),
        bestRun,
        arenaCount: new Set(entries.map(e => normalizeArenaGroup(e.quest.category || '', e.quest.type)).filter(a => arenaIds.includes(a))).size,
        lost: Math.max(0, (Number(state.startWeightKg) || 0) - (Number(state.userWeightKg) || 0)),
        runKm: Math.round(entries.filter(e => e.quest.type === 'cardio' && isRunQuest(e.quest)).reduce((s, e) => s + entryKm(e), 0) * 10) / 10,
        sunday: entries.some(e => e.date && new Date(e.date + 'T00:00:00').getDay() === 0),
        volley: entries.some(e => isVolleyQuest(e.quest))
      };
    }
    const ACH_PROGRESS = {
      veteran_20: { key: 'sessions', max: 20 }, calorie_furnace: { key: 'kcal', max: 1000 }, calorie_inferno: { key: 'kcal', max: 5000 },
      polyvalent: { key: 'arenaCount', max: 4 }, all_arenas: { key: 'arenaCount', max: 7 }, triple_combo: { key: 'maxPerDay', max: 3 },
      streak_3: { key: 'bestRun', max: 3 }, weight_loss_5: { key: 'lost', max: 5 }, marathon_km: { key: 'runKm', max: 42.2 }
    };

    // Trophées calculés automatiquement à partir de l’historique (rétroactifs)
    function computeDerivedAchievements(state) {
      const st = computeAchievementStats(state);
      const met = [];
      if (st.volley) met.push('volley_rookie');
      if (st.maxPerDay >= 3) met.push('triple_combo');
      if (st.bestRun >= 3) met.push('streak_3');
      if (st.arenaCount >= 4) met.push('polyvalent');
      if (st.sessions >= 20) met.push('veteran_20');
      if (st.kcal >= 5000) met.push('calorie_inferno');
      if (st.lost >= 5) met.push('weight_loss_5');
      if (st.sunday) met.push('sunday_warrior');
      if (st.runKm >= 42.2) met.push('marathon_km');
      if (st.arenaCount >= ARENA_GROUPS.length) met.push('all_arenas');
      return met;
    }

    // Minuteur de repos flottant
    // ==========================================================================
    // COACH : progression, planning de la semaine, équilibre, suivi du poids
    // Repères scientifiques utilisés (voir la section « Sources » de l'onglet Coach) :
    //  - ACSM 2009 (Ratamess et al.) : +2 à 10 % de charge quand les répétitions cibles sont dépassées,
    //    repos 2-3 min sur les exercices principaux, 1-2 min sur les exercices d'appoint.
    //  - Schoenfeld 2016/2017 : fréquence ≥ 2 séances/semaine par groupe, ≥ 10 séries/semaine pour la masse musculaire.
    //  - Spiering 2021 : dose minimale pour conserver la force/le muscle (déficit calorique).
    //  - Garthe 2011 : perte de poids ≈ 0,5-1 % du poids de corps par semaine pour préserver la masse maigre.
    // ==========================================================================
    const COACH_DEFAULTS = { sessionsPerWeek: 2, sessionMinutes: 60, volleyDays: [4, 5], matchDates: [], deloadWeeks: [] };
    const getCoachSettings = state => ({ ...COACH_DEFAULTS, ...((state && state.coach) || {}) });
    const COACH_ARENAS = ['Jambes', 'Dos', 'Pectoraux', 'Épaules & Bras', 'Abdominaux'];
    const COACH_DAY_NAMES = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
    const coachDow = iso => new Date(iso + 'T00:00:00').getDay();
    const coachDayLabel = iso => `${COACH_DAY_NAMES[coachDow(iso)]} ${iso.slice(8, 10)}/${iso.slice(5, 7)}`;
    const coachDaysBetween = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000);
    const coachRound = (x, step) => Math.round(Math.round(x / step) * step * 100) / 100;
    const coachIsCompound = name =>
      /squat|presse|souleve|terre|developpe|rowing|tirage|traction|dips|fente|hip thrust|pompes|good morning|hack/i.test(stripAccents(name || ''));

    function coachRealEntries(q) {
      return (q.history || []).filter(h => !isStartEntry(h) && h.date).sort((a, b) => String(a.date).localeCompare(String(b.date)));
    }
    function coachKind(q) {
      if (q.unit === 'kg') return 'load';
      return (Number(q.startAssistanceKg) || 0) > 0 || (Number(q.currentAssistanceKg) || 0) > 0 ? 'assisted' : 'reps';
    }
    function coachEquip(q) {
      const c =
        EXERCISE_CATALOG.find(x => x.id === q.catalogId) ||
        EXERCISE_CATALOG.find(x => stripAccents(x.name) === stripAccents(q.name || ''));
      return (c && c.equip) || '';
    }
    function coachStep(q, load) {
      const eq = coachEquip(q);
      if (eq === 'Haltères') return load < 10 ? 1 : 2;
      if (eq === 'Kettlebell') return 4;
      return load < 10 ? 1 : 2.5;
    }
    function coachSetsOf(entry, fallbackSets, fallbackReps) {
      if (Array.isArray(entry.setDetails) && entry.setDetails.length) return entry.setDetails.map(Number);
      return Array(Math.max(1, Number(entry.sets) || fallbackSets)).fill(Number(entry.reps) || fallbackReps);
    }

    // Objectif de la prochaine séance pour UN exercice
    function computeExerciseTarget(q, opts = {}) {
      const today = opts.today || getTodayISODate();
      const kind = coachKind(q);
      let sets = Math.max(1, Math.min(6, Number(q.goalSets) || 3));
      const R = Math.max(1, Number(q.goalReps) || 6);
      const goalAssist = Number(q.goalAssistanceKg) || 0;
      const entries = coachRealEntries(q);
      const last = entries[entries.length - 1] || null;
      const arena = normalizeArenaGroup(q.category, q.type);
      const compound = coachIsCompound(q.name);
      const boss = evaluateQuestProgress(q).isBossDefeated;

      let load = kind === 'load' ? Number(q.currentValue) || 0 : 0;
      let assist = kind === 'assisted' ? Number(q.currentAssistanceKg) || 0 : 0;
      let reps = Array(sets).fill(R);
      let change = 'new';
      let reason = '';
      const step = coachStep(q, load);

      if (!last) {
        change = 'new';
        reason =
          kind === 'load'
            ? `Charge de départ : ${load} kg. Ajuste-la pendant la séance si c'est trop lourd ou trop léger.`
            : kind === 'assisted'
              ? `Départ avec ${assist} kg d'aide.`
              : `Objectif : ${R} répétitions par série.`;
      } else {
        const prevSets = coachSetsOf(last, sets, R);
        const padded = Array.from({ length: sets }, (_, i) => Number(prevSets[i]) || 0);
        const minReps = Math.min(...padded);
        const excess = minReps - R;
        const rpe = Number(last.rpe) || 7;
        const gap = coachDaysBetween(last.date, today);
        const lastLoad = kind === 'load' ? Number(last.value) || load : 0;
        const lastAssist = kind === 'assisted' ? Number(last.assistanceKg) || 0 : 0;
        load = lastLoad;
        assist = lastAssist;
        const stepL = coachStep(q, load);
        const holdWord = kind === 'load' ? 'charge' : kind === 'assisted' ? 'aide' : 'difficulté';

        if (gap >= 14) {
          change = 'resume';
          const f = gap >= 21 ? 0.9 : 0.95;
          if (kind === 'load') load = Math.max(stepL, coachRound(load * f, stepL));
          if (kind === 'assisted') assist = assist + (gap >= 21 ? 5 : 2.5);
          reps = Array(sets).fill(R);
          reason = `Reprise après ${gap} jours sans cet exercice : on repart un peu plus léger pour retrouver les sensations.`;
        } else if (minReps >= R) {
          if (boss) {
            change = 'goal';
            reason = 'Objectif atteint ! Valide le niveau suivant dans l’onglet Quêtes pour définir un nouveau but.';
          } else if (rpe >= 9 && excess < 2) {
            change = 'hold';
            reason = `Séance précédente ressentie très dure (RPE ${rpe}) : on consolide la même ${holdWord} une séance de plus.`;
          } else if (kind === 'load') {
            const pct = excess >= 2 ? 0.05 : excess === 1 ? 0.035 : 0.025;
            let nl = coachRound(load * (1 + pct), stepL);
            if (nl <= load) nl = coachRound(load + stepL, stepL);
            const goalV = Number(q.goalValue) || 0;
            if (goalV > load && nl > goalV) nl = goalV;
            change = 'up';
            reason = `${R} reps réussies sur toutes les séries (RPE ${rpe}) → +${coachRound(nl - load, 0.5)} kg (+${Math.round(((nl - load) / Math.max(1, load)) * 100)} %). Repère ACSM : +2 à 10 %.`;
            load = nl;
          } else if (kind === 'assisted') {
            if (assist <= goalAssist) {
              change = 'goal';
              reason = 'Objectif atteint sans aide ! Valide le niveau suivant dans l’onglet Quêtes.';
            } else {
              const dec = assist >= 20 ? 5 : 2.5;
              const na = Math.max(goalAssist, assist - dec);
              change = 'assist_down';
              reason = `${R} reps réussies partout (RPE ${rpe}) → l’aide passe de ${assist} à ${na} kg.`;
              assist = na;
            }
          } else {
            change = 'goal';
            reason = 'Objectif de répétitions atteint ! Valide le niveau suivant dans l’onglet Quêtes.';
          }
          reps = Array(sets).fill(R);
        } else {
          change = 'hold';
          reps = padded.map(r => Math.min(R, Math.max(1, r + 1)));
          reason = `Dernière fois : ${padded.join(' - ')}. On garde la même ${holdWord} et on vise +1 rép par série (objectif ${R}).`;
          const prev = entries[entries.length - 2];
          if (prev) {
            const pSets = Array.from({ length: sets }, (_, i) => Number(coachSetsOf(prev, sets, R)[i]) || 0);
            const sameLoad = kind === 'load' ? Number(prev.value) === Number(last.value) : Number(prev.assistanceKg || 0) === Number(last.assistanceKg || 0);
            if (sameLoad && Math.min(...pSets) < R) {
              if (kind === 'load') {
                const nl = coachRound(load * 0.93, stepL);
                if (nl < load) {
                  load = nl;
                  change = 'down';
                  reps = Array(sets).fill(R);
                  reason = `${R} reps non atteintes 2 séances de suite : on recule d’environ 7 % pour repartir proprement.`;
                }
              } else if (kind === 'assisted') {
                assist = assist + 2.5;
                change = 'down';
                reps = Array(sets).fill(R);
                reason = `${R} reps non atteintes 2 séances de suite : l’aide remonte à ${assist} kg pour consolider.`;
              }
            }
          }
        }
      }

      if (opts.deload) {
        if (kind === 'load') load = Math.max(coachStep(q, load), coachRound(load * 0.9, coachStep(q, load)));
        sets = Math.max(2, sets - 1);
        reason += ' • Semaine allégée : −10 % de charge, une série de moins.';
      } else if (opts.reduceSets && sets > 2) {
        sets = sets - 1;
        reason += ' • Semaine de match : une série de moins.';
      }
      reps = Array.from({ length: sets }, (_, i) => reps[i] !== undefined ? reps[i] : reps[reps.length - 1] || R);

      return {
        questId: q.id, name: q.name, icon: q.icon, arena, kind, compound,
        restSec: compound ? 150 : 90, sets, targetReps: reps, goalReps: R,
        load, assist, change, reason, unit: q.unit, equip: coachEquip(q)
      };
    }

    // Répartition des exercices de l'utilisateur dans N séances « corps entier »
    function composeTemplates(quests, N) {
      const strength = (quests || []).filter(q => q.type === 'strength' && q.goalMode !== 'free_mode');
      const byArena = {};
      strength.forEach(q => {
        const a = normalizeArenaGroup(q.category, q.type);
        (byArena[a] = byArena[a] || []).push(q);
      });
      const templates = Array.from({ length: N }, (_, i) => ({ idx: i, id: 'ABC'[i], quests: [] }));
      COACH_ARENAS.forEach(a => {
        const list = (byArena[a] || []).slice().sort((x, y) => String(x.id).localeCompare(String(y.id)));
        const cap = a === 'Abdominaux' ? 1 : 2;
        if (!list.length) return;
        // chaque groupe est travaillé dans chaque séance (fréquence ≥ 2/semaine) :
        // les exercices sont répartis, et s'il y en a moins que de séances, ils sont répétés
        templates.forEach((t, i) => {
          let mine = list.filter((q, j) => j % N === i).slice(0, cap);
          if (!mine.length) mine = [list[i % list.length]];
          mine.forEach(q => t.quests.push(q));
        });
      });
      templates.forEach(t =>
        t.quests.sort((x, y) => {
          const ax = COACH_ARENAS.indexOf(normalizeArenaGroup(x.category, x.type));
          const ay = COACH_ARENAS.indexOf(normalizeArenaGroup(y.category, y.type));
          if (ax !== ay) return ax - ay;
          return (coachIsCompound(y.name) ? 1 : 0) - (coachIsCompound(x.name) ? 1 : 0);
        })
      );
      return templates;
    }

    // Contraintes d'un jour : volley (jeudi/vendredi par défaut), match, récupération
    function coachDayInfo(iso, coach) {
      const volleyDays = coach.volleyDays || [];
      const matches = new Set(coach.matchDates || []);
      const dow = coachDow(iso);
      const isVolley = volleyDays.includes(dow);
      const isMatch = matches.has(iso);
      const next1 = addDaysISO(iso, 1);
      const next2 = addDaysISO(iso, 2);
      const prev1 = addDaysISO(iso, -1);
      const volleyNext = volleyDays.includes(coachDow(next1)) || matches.has(next1);
      const matchSoon = matches.has(next1) || matches.has(next2);
      const afterMatch = matches.has(prev1);
      const legsOk = !isVolley && !isMatch && !volleyNext && !matchSoon && !afterMatch;
      let legsWhy = '';
      if (isVolley || isMatch) legsWhy = isMatch ? 'jour de match' : 'jour de volley';
      else if (matches.has(next1)) legsWhy = 'match demain';
      else if (matchSoon) legsWhy = 'match dans 2 jours';
      else if (afterMatch) legsWhy = 'lendemain de match';
      else if (volleyNext) legsWhy = 'volley demain';
      return { iso, dow, isVolley, isMatch, blocked: isVolley || isMatch, legsOk, legsWhy };
    }

    // Planifie les séances de muscu d'une semaine (lundi → dimanche)
    function coachPlanWeek(state, weekStart, today) {
      const coach = getCoachSettings(state);
      const days = Array.from({ length: 7 }, (_, i) => addDaysISO(weekStart, i));
      const strengthDays = new Set(
        getAllEntries(state).filter(e => e.quest.type === 'strength').map(e => e.date)
      );
      const info = days.map(d => coachDayInfo(d, coach));
      const doneDays = days.filter(d => strengthDays.has(d));
      const lastBefore = [...strengthDays].filter(d => d < weekStart).sort().pop() || null;
      const remaining = Math.max(0, coach.sessionsPerWeek - doneDays.length);
      const cand = info.filter(i => i.iso >= today && !i.blocked && !strengthDays.has(i.iso));
      const fixed = [...doneDays, ...(lastBefore ? [lastBefore] : [])];

      // On cherche le plus grand nombre de séances (≤ objectif) espacées d'au moins 2 jours (≈ 48 h de repos)
      let best = null;
      let target = remaining;
      for (; target >= 0; target--) {
        best = null;
        const rec = (start, chosen) => {
          if (chosen.length === target) {
            const score = [chosen.filter(d => cand.find(c => c.iso === d).legsOk).length, -chosen.reduce((s, d) => s + coachDaysBetween(weekStart, d), 0)];
            if (!best || score[0] > best.score[0] || (score[0] === best.score[0] && score[1] > best.score[1])) best = { chosen, score };
            return;
          }
          for (let k = start; k < cand.length; k++) {
            const d = cand[k].iso;
            if ([...fixed, ...chosen].every(x => Math.abs(coachDaysBetween(x, d)) >= 2)) rec(k + 1, [...chosen, d]);
          }
        };
        rec(0, []);
        if (best) break;
      }
      const planned = best ? best.chosen : [];
      const shortfall = Math.max(0, remaining - planned.length);
      const matchInWeek = days.some(d => (coach.matchDates || []).includes(d));
      return {
        weekStart, coach, matchInWeek, remaining, shortfall,
        deload: (coach.deloadWeeks || []).includes(weekStart),
        days: info.map(i => ({
          ...i,
          status: strengthDays.has(i.iso) ? 'done' : planned.includes(i.iso) ? 'planned' : i.isMatch ? 'match' : i.isVolley ? 'volley' : 'rest'
        })),
        planned
      };
    }

    function coachNextTemplateIdx(state, templates) {
      const entries = getAllEntries(state).filter(e => e.quest.type === 'strength');
      let bestIdx = 0, bestDate = null;
      templates.forEach((t, i) => {
        const ids = new Set(t.quests.map(q => q.id));
        const last = entries.filter(e => ids.has(e.quest.id)).map(e => e.date).sort().pop() || '';
        if (bestDate === null || last < bestDate) { bestDate = last; bestIdx = i; }
      });
      return bestIdx;
    }

    // Durée estimée d'une séance (échauffement 5 min + séries et repos)
    function coachEstimateMin(exercises) {
      return Math.round(5 + exercises.reduce((s, e) => s + e.sets * (0.75 + e.restSec / 60), 0));
    }

    // Complète (ou allège) la séance proposée pour tenir la durée voulue par l'utilisateur.
    // On ajoute d'abord des séries (jusqu'à 4 par exercice), puis des exercices de ses propres objectifs.
    function coachFitDuration(state, exercises, di, opts, targetMin, notes) {
      if (!targetMin || opts.deload || !exercises.length) return exercises;
      let ex = exercises.map(e => ({ ...e, targetReps: e.targetReps.slice() }));
      const startMin = coachEstimateMin(ex);
      const startSets = ex.reduce((s, e) => s + e.sets, 0);
      const startNames = ex.map(e => e.questId);
      const legsAllowed = di.legsOk && !opts.matchWeek;
      const arenaCount = a => ex.filter(e => e.arena === a).length;
      const arenaSets = a => ex.filter(e => e.arena === a).reduce((s, e) => s + e.sets, 0);
      const pool = () =>
        (state.quests || []).filter(q => {
          if (q.type !== 'strength' || q.goalMode === 'free_mode') return false;
          if (ex.some(e => e.questId === q.id)) return false;
          const a = normalizeArenaGroup(q.category, q.type);
          if (a === 'Jambes' && !legsAllowed) return false;
          return arenaCount(a) < 2;
        });
      const addSet = e => { e.sets += 1; e.targetReps.push(e.targetReps[e.targetReps.length - 1]); };
      let guard = 0;
      while (coachEstimateMin(ex) < targetMin - 3 && guard++ < 40) {
        const cands = pool().sort((x, y) => {
          const ax = normalizeArenaGroup(x.category, x.type), ay = normalizeArenaGroup(y.category, y.type);
          const d = arenaSets(ax) - arenaSets(ay);
          if (d) return d;
          return (coachIsCompound(y.name) ? 1 : 0) - (coachIsCompound(x.name) ? 1 : 0);
        });
        const allThree = ex.every(e => e.sets >= 3);
        const canSet = ex
          .filter(e => e.sets < 4 && !(opts.matchWeek && e.arena === 'Jambes'))
          .sort((a, b) => a.sets - b.sets || (b.compound ? 1 : 0) - (a.compound ? 1 : 0));
        if (allThree && cands.length && ex.length < 8) {
          const q = cands[0];
          ex.push(computeExerciseTarget(q, { today: di.iso, deload: false, reduceSets: false }));
        } else if (canSet.length) {
          addSet(canSet[0]);
        } else if (cands.length && ex.length < 8) {
          ex.push(computeExerciseTarget(cands[0], { today: di.iso, deload: false, reduceSets: false }));
        } else break;
      }
      // Allègement si la séance dépasse nettement la durée voulue
      guard = 0;
      while (coachEstimateMin(ex) > targetMin + 8 && guard++ < 30) {
        const big = ex.filter(e => e.sets > 3).sort((a, b) => b.sets - a.sets)[0];
        if (big) { big.sets -= 1; big.targetReps.pop(); continue; }
        if (ex.length > 3) { ex.pop(); continue; }
        break;
      }
      ex.sort((a, b) => {
        const ia = COACH_ARENAS.indexOf(a.arena), ib = COACH_ARENAS.indexOf(b.arena);
        if (ia !== ib) return ia - ib;
        return (b.compound ? 1 : 0) - (a.compound ? 1 : 0);
      });
      const endMin = coachEstimateMin(ex);
      const endSets = ex.reduce((s, e) => s + e.sets, 0);
      const added = ex.filter(e => !startNames.includes(e.questId));
      if (endSets > startSets || added.length) {
        notes.push(`Séance complétée pour tenir environ ${targetMin} min : ${added.length ? `${added.length} exercice(s) ajouté(s) (${added.map(e => e.name).join(', ')})` : ''}${added.length && endSets - startSets - added.reduce((s, e) => s + e.sets, 0) > 0 ? ' et ' : ''}${endSets - startSets - added.reduce((s, e) => s + e.sets, 0) > 0 ? `${endSets - startSets - added.reduce((s, e) => s + e.sets, 0)} série(s) en plus` : ''}.`);
      } else if (endMin < startMin) {
        notes.push(`Séance allégée pour tenir environ ${targetMin} min.`);
      }
      if (endMin < targetMin - 8) {
        notes.push(`Avec tes exercices actuels, la séance dure environ ${endMin} min (objectif ${targetMin}). Ajoute un ou deux exercices (surtout pour les groupes les moins travaillés) pour la compléter.`);
      }
      return ex;
    }

    // Construit une séance complète (liste d'exercices avec objectifs chiffrés)
    function coachBuildSession(state, templateIdx, di, opts = {}) {
      const coach = getCoachSettings(state);
      const templates = composeTemplates(state.quests, coach.sessionsPerWeek);
      const t = templates[templateIdx % templates.length];
      const notes = [];
      let quests = t.quests;
      if (!di.legsOk) {
        const without = quests.filter(q => normalizeArenaGroup(q.category, q.type) !== 'Jambes');
        if (without.length !== quests.length) notes.push(`Pas d'exercices de jambes (${di.legsWhy}) pour garder les jambes fraîches.`);
        quests = without;
      }
      let exercises = quests.map(q =>
        computeExerciseTarget(q, {
          today: di.iso,
          deload: !!opts.deload,
          reduceSets: !!opts.matchWeek && normalizeArenaGroup(q.category, q.type) === 'Jambes'
        })
      );
      exercises = coachFitDuration(state, exercises, di, opts, Number(coach.sessionMinutes) || 0, notes);
      const w = Number(state.userWeightKg) || 82;
      const estMin = coachEstimateMin(exercises);
      const estKcal = exercises.reduce(
        (s, e) => s + calculateStrengthCalories({ unit: e.unit, weightKg: e.kind === 'load' ? e.load : 0, assistanceKg: e.kind === 'assisted' ? e.assist : 0, setDetails: e.targetReps, rpe: 7, userWeightKg: w }),
        0
      );
      const first = exercises.find(e => e.kind === 'load' && e.load >= 20);
      const warmup = first
        ? `Échauffement conseillé sur « ${first.name} » : 1 × 8 à ${coachRound(first.load * 0.5, coachStep({ catalogId: '', name: first.name }, first.load))} kg, puis 1 × 4-5 à ${coachRound(first.load * 0.75, coachStep({ catalogId: '', name: first.name }, first.load))} kg, avant la première série de travail.`
        : '';
      return { templateIdx, templateId: t.id, date: di.iso, exercises, notes, estMin, estKcal, warmup };
    }

    // Séance construite à la main par l'utilisateur (liste d'exercices + date choisie)
    function coachBuildCustomSession(state, questIds, dateIso, opts = {}) {
      const byId = {};
      (state.quests || []).forEach(q => { byId[q.id] = q; });
      const quests = (questIds || []).map(id => byId[id]).filter(q => q && q.type === 'strength' && q.goalMode !== 'free_mode');
      const exercises = quests.map(q =>
        computeExerciseTarget(q, {
          today: dateIso,
          deload: !!opts.deload,
          reduceSets: !!opts.matchWeek && normalizeArenaGroup(q.category, q.type) === 'Jambes'
        })
      );
      const w = Number(state.userWeightKg) || 82;
      const estMin = Math.round(5 + exercises.reduce((s, e) => s + e.sets * (0.75 + e.restSec / 60), 0));
      const estKcal = exercises.reduce(
        (s, e) => s + calculateStrengthCalories({ unit: e.unit, weightKg: e.kind === 'load' ? e.load : 0, assistanceKg: e.kind === 'assisted' ? e.assist : 0, setDetails: e.targetReps, rpe: 7, userWeightKg: w }),
        0
      );
      const first = exercises.find(e => e.kind === 'load' && e.load >= 20);
      const warmup = first
        ? `Échauffement conseillé sur « ${first.name} » : 1 × 8 à ${coachRound(first.load * 0.5, coachStep({ catalogId: '', name: first.name }, first.load))} kg, puis 1 × 4-5 à ${coachRound(first.load * 0.75, coachStep({ catalogId: '', name: first.name }, first.load))} kg, avant la première série de travail.`
        : '';
      return { templateIdx: -1, templateId: 'Perso', date: dateIso, exercises, notes: [], estMin, estKcal, warmup, custom: true };
    }

    // Note de 1 à 10 pour une séance (proposée par le coach ou composée par l'utilisateur),
    // avec des remarques écrites. Ce sont des règles de bon sens appuyées sur les repères ACSM 2009 /
    // Schoenfeld 2016-2017 (fréquence, volume, récupération) : une aide à la décision, pas une mesure scientifique exacte.
    function coachRateSession(state, session) {
      const coach = getCoachSettings(state);
      const iso = session.date;
      const ex = session.exercises || [];
      if (!ex.length) {
        return { score: 1, label: 'Séance vide', items: [{ level: 'bad', text: 'La séance ne contient aucun exercice.', fix: 'Ajoute au moins un exercice pour chaque grand groupe (jambes, dos, pectoraux, épaules/bras).' }] };
      }
      const items = [];
      let score = 10;
      const add = (pen, level, text, fix) => { score -= pen; items.push({ level, text, fix: fix || '' }); };
      const ok = text => items.push({ level: 'ok', text, fix: '' });
      const di = coachDayInfo(iso, coach);
      const wkStart = getWeekStart(iso);
      const wk = coachPlanWeek(state, wkStart, getTodayISODate());
      const setsBy = {};
      let total = 0;
      ex.forEach(e => { setsBy[e.arena] = (setsBy[e.arena] || 0) + e.sets; total += e.sets; });
      const legSets = setsBy['Jambes'] || 0;
      const entries = getAllEntries(state).filter(e => e.quest.type === 'strength' && !isStartEntry(e));
      const wkEnd = addDaysISO(wkStart, 6);

      // 1. Jour choisi
      if (di.isMatch) add(3, 'bad', 'Tu as placé la séance un jour de match.', 'Choisis un autre jour : la veille et le lendemain d’un match sont aussi à éviter pour les jambes.');
      else if (di.isVolley) add(1, 'warn', 'Ce jour-là tu as volley : séance de muscu + volley = fatigue cumulée.', 'Fais-la plutôt un jour sans volley, ou réduis le volume (4 à 5 exercices).');
      else ok('Le jour choisi est libre de volley et de match.');
      if (legSets > 0 && !di.legsOk) add(3, 'bad', `Il y a des jambes (${legSets} séries) alors que ce n’est pas le bon moment (${di.legsWhy}).`, 'Retire les exercices de jambes ou déplace la séance : des jambes fatiguées gênent le volley et augmentent le risque de blessure.');
      else if (legSets > 0) ok('Les jambes sont compatibles avec ton calendrier de volley et de match.');
      if (wk.matchInWeek && legSets > 6) add(1, 'warn', 'Semaine de match : beaucoup de séries de jambes.', 'Limite-toi à environ 6 séries de jambes cette semaine-là.');

      // 2. Récupération
      const before = entries.map(e => e.date).filter(d => d < iso).sort();
      const lastBefore = before.length ? before[before.length - 1] : null;
      const daysSince = lastBefore ? coachDaysBetween(lastBefore, iso) : null;
      if (entries.some(e => e.date === iso)) add(1, 'warn', 'Tu as déjà une séance de muscu enregistrée ce jour-là.', 'Évite d’empiler deux séances le même jour.');
      else if (daysSince !== null && daysSince <= 1) add(1.5, 'warn', 'Ta dernière séance de muscu date de moins de 48 h.', 'Laisse au moins 2 jours entre deux séances (ACSM 2009 : 48 h de récupération pour les mêmes muscles).');
      else if (daysSince !== null) ok(`Bonne récupération : ${daysSince} jours depuis ta dernière séance.`);
      const recentArenas = new Set(entries.filter(e => e.date < iso && coachDaysBetween(e.date, iso) <= 1).map(e => normalizeArenaGroup(e.quest.category, e.quest.type)));
      let overlapPen = 0;
      Object.keys(setsBy).forEach(a => {
        if (recentArenas.has(a) && overlapPen < 1.5) {
          overlapPen += 0.75;
          add(0.75, 'warn', `${a} déjà travaillé il y a moins de 48 h.`, `Remplace ces exercices par un autre groupe, ou décale la séance.`);
        }
      });

      // 3. Nombre de séances dans la semaine
      const weekDays = new Set(entries.filter(e => e.date >= wkStart && e.date <= wkEnd && e.date !== iso).map(e => e.date));
      const cnt = weekDays.size + 1;
      if (cnt > 3) add(2, 'bad', `Ce serait ta ${cnt}e séance de muscu cette semaine, et tu veux 3 maximum.`, 'Reporte-la à la semaine suivante ou remplace-la par du cardio léger.');
      else if (cnt > coach.sessionsPerWeek) add(0.5, 'warn', `Ce serait ta ${cnt}e séance de la semaine (objectif : ${coach.sessionsPerWeek}).`, 'Pas grave si tu récupères bien, mais l’objectif de 2 séances est déjà une dose efficace (Spiering 2021).');
      else ok(`Séance n°${cnt} de la semaine : dans ton objectif.`);

      // 4. Couverture des groupes
      const weekArenas = new Set(entries.filter(e => e.date >= wkStart && e.date <= wkEnd && e.date !== iso).map(e => normalizeArenaGroup(e.quest.category, e.quest.type)));
      const core = ['Jambes', 'Dos', 'Pectoraux', 'Épaules & Bras'];
      let covPen = 0;
      const missing = [];
      core.forEach(a => {
        if (setsBy[a]) return;
        if (a === 'Jambes' && !di.legsOk) return;
        if (weekArenas.has(a)) return;
        missing.push(a);
      });
      missing.forEach(a => {
        if (covPen < 2.25) { covPen += 0.75; add(0.75, 'warn', `Aucun exercice de ${a} dans cette séance (ni plus tôt cette semaine).`, `Ajoute un exercice de ${a}, ou prévois-le dans ta prochaine séance : chaque groupe gagne à être travaillé au moins 2 fois par semaine (Schoenfeld 2016).`); }
      });
      if (!missing.length) ok('Tous les grands groupes sont couverts cette semaine.');
      if (!setsBy['Abdominaux'] && !weekArenas.has('Abdominaux')) add(0.25, 'info', 'Pas d’abdos cette semaine.', 'Un exercice de gainage ou d’abdos (2 à 3 séries) complète bien la séance et aide pour le volley.');

      // 5. Équilibre poussée / tirage
      const pecs = setsBy['Pectoraux'] || 0, back = setsBy['Dos'] || 0;
      if (pecs > 0 && back === 0) add(1, 'warn', 'Tu pousses (pectoraux) sans aucun exercice de tirage.', 'Ajoute un exercice de dos (tirage, rowing) : le volley sollicite déjà beaucoup les épaules, l’équilibre protège l’articulation (pratique courante, preuves limitées).');
      else if (pecs > 0 && back > 0) {
        const r = back / pecs;
        if (r < 0.5) add(0.5, 'warn', 'Beaucoup plus de poussée que de tirage.', 'Ajoute une série ou deux de dos.');
        else if (r > 2) add(0.5, 'info', 'Beaucoup plus de tirage que de poussée.', 'Ajoute un peu de pectoraux ou d’épaules.');
        else ok('Poussée et tirage équilibrés.');
      }

      // 6. Volume et durée
      if (total < 6) add(1.5, 'warn', `Séance très courte (${total} séries).`, 'Vise au moins 8 à 12 séries au total pour que la séance compte.');
      else if (total > 24) add(1.5, 'warn', `Séance très longue (${total} séries).`, 'Au-delà d’environ 20 séries, la qualité baisse : retire les exercices les moins utiles.');
      else if (total > 18) add(0.5, 'info', `Séance chargée (${total} séries).`, 'Surveille ta fatigue et ta durée.');
      else ok(`Volume raisonnable (${total} séries).`);
      Object.keys(setsBy).forEach(a => {
        if (setsBy[a] > 10) add(0.75, 'warn', `${setsBy[a]} séries sur ${a} dans une seule séance.`, 'Au-delà de 10 séries par groupe dans une séance, le gain supplémentaire est faible : répartis sur une autre séance.');
      });
      const tgt = Number(coach.sessionMinutes) || 0;
      if (tgt && session.estMin < tgt - 12) add(1, 'warn', `Durée estimée de ${session.estMin} min, alors que tu veux environ ${tgt} min.`, 'Ajoute une série sur tes gros exercices ou un exercice pour un groupe peu travaillé : la séance vaut mieux le déplacement.');
      else if (tgt && session.estMin < tgt - 6) add(0.5, 'info', `Durée estimée de ${session.estMin} min (objectif ${tgt} min).`, 'Il te manque quelques minutes : une série ou un exercice en plus suffit.');
      else if (tgt) ok(`Durée estimée de ${session.estMin} min : proche de ton objectif de ${tgt} min.`);
      if (session.estMin > Math.max(90, tgt + 20)) add(1, 'warn', `Durée estimée de ${session.estMin} min.`, 'C’est long à tenir : réduis le nombre d’exercices ou de séries.');
      else if (!tgt && session.estMin > 75) add(0.5, 'info', `Durée estimée de ${session.estMin} min.`, 'Prévois du temps pour les repos.');
      if (ex.length > 9) add(1, 'warn', `${ex.length} exercices : c’est beaucoup.`, 'Garde 5 à 8 exercices bien faits plutôt que 10 survolés.');

      // 7. Ordre des exercices
      const firstCompound = ex.findIndex(e => e.compound);
      const isoBeforeCompound = ex.some((e, i) => !e.compound && e.arena !== 'Abdominaux' && ex.slice(i + 1).some(x => x.compound));
      if (firstCompound >= 0 && isoBeforeCompound) add(0.5, 'info', 'Des exercices d’isolation passent avant des exercices polyarticulaires.', 'Commence par les gros mouvements (squat, développé, rowing) quand tu es frais.');

      // 8. Progression
      const downs = ex.filter(e => e.change === 'down' || e.change === 'resume');
      if (downs.length) items.push({ level: 'info', text: `${downs.map(e => e.name).join(', ')} : le coach te fait reculer légèrement pour consolider.`, fix: '' });

      score = Math.max(1, Math.min(10, Math.round(score * 2) / 2));
      const label = score >= 9 ? 'Excellente' : score >= 7.5 ? 'Bonne' : score >= 6 ? 'Correcte' : score >= 4 ? 'À améliorer' : 'À revoir';
      const order = { bad: 0, warn: 1, info: 2, ok: 3 };
      items.sort((a, b) => order[a.level] - order[b.level]);
      return { score, label, items };
    }

    // Prochaine séance + plan des 2 prochaines semaines
    function coachOverview(state, today) {
      const coach = getCoachSettings(state);
      const ws0 = getWeekStart(today);
      const ws1 = addDaysISO(ws0, 7);
      const weeks = [coachPlanWeek(state, ws0, today), coachPlanWeek(state, ws1, today)];
      const templates = composeTemplates(state.quests, coach.sessionsPerWeek);
      const nextIdx = templates.length ? coachNextTemplateIdx(state, templates) : 0;
      const plannedAll = [];
      weeks.forEach(w => w.planned.forEach(d => plannedAll.push({ iso: d, week: w })));
      plannedAll.forEach((p, k) => { p.templateIdx = (nextIdx + k) % Math.max(1, templates.length); });
      const first = plannedAll.find(p => p.iso >= today) || null;
      const hasExercises = templates.some(t => t.quests.length > 0);
      let session = null;
      if (first && hasExercises) {
        const di = coachDayInfo(first.iso, coach);
        session = coachBuildSession(state, first.templateIdx, di, { deload: first.week.deload, matchWeek: first.week.matchInWeek });
      }
      return { coach, weeks, templates, plannedAll, first, session, hasExercises, nextIdx };
    }

    // Volume hebdomadaire par arène (moyenne des 28 derniers jours) et équilibre poussée/tirage
    function coachBalance(state, today) {
      const from = addDaysISO(today, -27);
      const sets = {}, days = {};
      COACH_ARENAS.forEach(a => { sets[a] = 0; days[a] = new Set(); });
      let push = 0, pull = 0;
      const PUSH = /developpe|pompes|dips|pec|ecarte|chest|triceps|push|militaire|elevation/i;
      const PULL = /traction|tirage|rowing|row|pull|oiseau|curl|shrug/i;
      getAllEntries(state).forEach(e => {
        if (e.quest.type !== 'strength' || e.date < from || e.date > today) return;
        const a = normalizeArenaGroup(e.quest.category, e.quest.type);
        const n = Array.isArray(e.setDetails) ? e.setDetails.length : Number(e.sets) || 0;
        if (sets[a] === undefined) return;
        sets[a] += n;
        days[a].add(e.date);
        const nm = stripAccents(e.quest.name || '');
        if (a === 'Dos' || (a === 'Épaules & Bras' && PULL.test(nm) && !PUSH.test(nm))) pull += n;
        else if (a === 'Pectoraux' || (a === 'Épaules & Bras' && PUSH.test(nm))) push += n;
      });
      const rows = COACH_ARENAS.map(a => {
        const band = a === 'Abdominaux' ? { min: 4, good: 8 } : { min: 6, good: 10 };
        const avg = Math.round((sets[a] / 4) * 10) / 10;
        const status = avg < band.min ? 'low' : avg < band.good ? 'mid' : 'good';
        return { arena: a, avg, perWeekFreq: Math.round((days[a].size / 4) * 10) / 10, band, status };
      });
      const ratio = push > 0 ? Math.round((pull / push) * 100) / 100 : null;
      return { rows, push, pull, ratio };
    }

    // Suggestions d'exercices du catalogue pour une arène en retard
    function coachSuggestExercises(state, arena, count = 3) {
      const owned = new Set((state.quests || []).map(q => q.catalogId));
      const ownedNames = new Set((state.quests || []).map(q => stripAccents(q.name || '')));
      const pref = ['Machine guidée', 'Hammer Strength', 'Poulie', 'Smith', 'Haltères', 'Barre', 'Poids du corps'];
      return EXERCISE_CATALOG
        .filter(c => c.type === 'strength' && normalizeArenaGroup(c.category, c.type) === arena && !owned.has(c.id) && !ownedNames.has(stripAccents(c.name)))
        .sort((a, b) => {
          const ca = coachIsCompound(a.name) ? 0 : 1, cb = coachIsCompound(b.name) ? 0 : 1;
          if (ca !== cb) return ca - cb;
          const pa = pref.indexOf(a.equip || ''), pb = pref.indexOf(b.equip || '');
          return (pa < 0 ? 99 : pa) - (pb < 0 ? 99 : pb);
        })
        .slice(0, count);
    }

    // Stagnation : aucune amélioration sur les 3 dernières séances
    function coachPlateau(q) {
      const es = coachRealEntries(q);
      if (es.length < 4) return false;
      const kind = coachKind(q);
      const tuple = e => {
        const sets = coachSetsOf(e, 3, 6);
        const loadScore = kind === 'load' ? Number(e.value) || 0 : kind === 'assisted' ? -(Number(e.assistanceKg) || 0) : 0;
        return [loadScore, sets.reduce((a, b) => a + (Number(b) || 0), 0)];
      };
      const better = (a, b) => a[0] > b[0] || (a[0] === b[0] && a[1] > b[1]);
      let best = tuple(es[0]);
      const improved = [false];
      for (let i = 1; i < es.length; i++) {
        const t = tuple(es[i]);
        improved.push(better(t, best));
        if (better(t, best)) best = t;
      }
      return !improved.slice(-3).some(Boolean);
    }

    // Date estimée d'atteinte de l'objectif (tendance sur les dernières séances)
    function coachEta(q, today) {
      const kind = coachKind(q);
      const es = coachRealEntries(q).slice(-6);
      const goal = kind === 'load' ? Number(q.goalValue) || 0 : kind === 'assisted' ? Number(q.goalAssistanceKg) || 0 : Number(q.goalReps) || 0;
      const val = e => kind === 'load' ? Number(e.value) || 0 : kind === 'assisted' ? Number(e.assistanceKg) || 0 : Math.max(0, ...coachSetsOf(e, 3, 6));
      const cur = es.length ? val(es[es.length - 1]) : kind === 'load' ? Number(q.currentValue) || 0 : 0;
      const reached = kind === 'assisted' ? cur <= goal : cur >= goal;
      if (reached && es.length) return { done: true };
      const dates = [...new Set(es.map(e => e.date))];
      if (es.length < 3 || dates.length < 3 || coachDaysBetween(es[0].date, es[es.length - 1].date) < 7) return { unknown: true };
      const t0 = es[0].date;
      const xs = es.map(e => coachDaysBetween(t0, e.date));
      const ys = es.map(val);
      const n = xs.length, mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
      const den = xs.reduce((s, x) => s + (x - mx) ** 2, 0);
      if (den === 0) return { unknown: true };
      const slope = xs.reduce((s, x, i) => s + (x - mx) * (ys[i] - my), 0) / den;
      const needed = kind === 'assisted' ? cur - goal : goal - cur;
      const rate = kind === 'assisted' ? -slope : slope;
      const minRate = kind === 'load' ? 0.02 : 0.01;
      if (rate < minRate) return { stalled: true };
      const days = Math.min(730, Math.ceil(needed / rate));
      return { days, date: addDaysISO(today, days), perWeek: Math.round(rate * 7 * 10) / 10 };
    }

    // Rythme de perte de poids et estimation de la date d'arrivée
    function coachWeightPace(state, today) {
      const hist = (state.weightHistory || []).filter(w => w.date && w.date <= today).sort((a, b) => a.date.localeCompare(b.date));
      const target = Number(state.targetWeightKg) || 0;
      const current = hist.length ? Number(hist[hist.length - 1].weightKg) : Number(state.userWeightKg) || 0;
      const from = addDaysISO(today, -28);
      const win = hist.filter(w => w.date >= from);
      if (win.length < 2 || coachDaysBetween(win[0].date, win[win.length - 1].date) < 5) return { current, target, unknown: true };
      const t0 = win[0].date;
      const xs = win.map(w => coachDaysBetween(t0, w.date));
      const ys = win.map(w => Number(w.weightKg) || 0);
      const n = xs.length, mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
      const den = xs.reduce((s, x) => s + (x - mx) ** 2, 0);
      if (den === 0) return { current, target, unknown: true };
      const slope = xs.reduce((s, x, i) => s + (x - mx) * (ys[i] - my), 0) / den;
      const kgWeek = Math.round(slope * 7 * 100) / 100;
      const pct = Math.round((kgWeek / Math.max(1, current)) * 1000) / 10;
      let eta = null;
      if (current > target && slope < -0.005) {
        const days = Math.min(900, Math.ceil((current - target) / -slope));
        eta = { days, date: addDaysISO(today, days) };
      }
      let level = 'ok';
      if (pct <= -1.0) level = 'fast';
      else if (pct > -0.25) level = 'slow';
      return { current, target, kgWeek, pct, eta, level };
    }

    // Activité de la semaine : minutes d'endurance (volley inclus) et jours de renforcement
    function coachWeekActivity(state, weekStart) {
      const end = addDaysISO(weekStart, 6);
      let aerobicMin = 0;
      const strengthDays = new Set();
      getAllEntries(state).forEach(e => {
        if (e.date < weekStart || e.date > end) return;
        if (e.quest.type === 'strength') strengthDays.add(e.date);
        else aerobicMin += Number(e.durationMin) || (e.quest.unit === 'min' ? Number(e.value) || 0 : 0);
      });
      return { aerobicMin: Math.round(aerobicMin), strengthDays: strengthDays.size };
    }

    // Nombre de semaines consécutives avec au moins une séance de muscu
    function coachTrainingWeeks(state, today) {
      const days = new Set(getAllEntries(state).filter(e => e.quest.type === 'strength').map(e => e.date));
      let ws = getWeekStart(today);
      const has = w => Array.from({ length: 7 }, (_, i) => addDaysISO(w, i)).some(d => days.has(d));
      if (!has(ws)) ws = addDaysISO(ws, -7);
      let n = 0;
      while (has(ws) && n < 60) { n++; ws = addDaysISO(ws, -7); }
      return n;
    }

    const COACH_SOURCES = [

    function CoachPanel({ gameState, setGameState, onStartGuided, onOpenLevelUp, onAddExercise, onQuickCardio, onGoTab, guidedActive, onResumeGuided }) {

      const questRows = useMemo(

      const updateCoach = patch =>

      const toggleMatch = iso => {

      const weekStart0 = getWeekStart(today);

      const customSession = useMemo(

          <section className={card}>
