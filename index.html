            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
              <div className="bg-slate-950 border border-slate-800 rounded-xl p-2.5">
                <span className="text-[10px] font-bold uppercase text-slate-400 block">Poids actuel</span>
                <span className="text-lg font-black text-white">{coachFmt(pace.current)} kg</span>
              </div>
              <div className="bg-slate-950 border border-slate-800 rounded-xl p-2.5">
                <span className="text-[10px] font-bold uppercase text-slate-400 block">Poids cible</span>
                <input type="number" min="35" max="250" step="0.5" value={gameState.targetWeightKg}
                  onChange={e => setGameState(prev => ({ ...prev, targetWeightKg: Math.max(35, Number(e.target.value) || 75) }))}
                  className="w-full bg-transparent text-lg font-black text-emerald-300 outline-none" />
              </div>
              <div className="bg-slate-950 border border-slate-800 rounded-xl p-2.5">
                <span className="text-[10px] font-bold uppercase text-slate-400 block">Rythme (4 sem.)</span>
                <span className="text-lg font-black text-white">{pace.unknown ? '—' : `${coachFmt(pace.kgWeek)} kg/sem.`}</span>
              </div>
              <div className="bg-slate-950 border border-slate-800 rounded-xl p-2.5">
                <span className="text-[10px] font-bold uppercase text-slate-400 block">Arrivée estimée</span>
                <span className="text-lg font-black text-white">{pace.eta ? coachDateFR(pace.eta.date).slice(0, 5) : '—'}</span>
              </div>
            </div>
            <p className="text-xs text-slate-300">
              {pace.unknown && 'Ajoute au moins 2 pesées espacées de 5 jours pour obtenir ton rythme.'}
              {!pace.unknown && pace.level === 'ok' && `Rythme de ${coachFmt(Math.abs(pace.pct))} % du poids par semaine : dans la zone généralement recommandée (environ 0,5 à 1 %).`}
              {!pace.unknown && pace.level === 'fast' && `Rythme de ${coachFmt(Math.abs(pace.pct))} % par semaine : rapide. Au-delà d’environ 1 %, le risque de perdre du muscle augmente (Garthe 2011). Vérifie tes apports et tes protéines.`}
              {!pace.unknown && pace.level === 'slow' && `Rythme de ${coachFmt(Math.abs(pace.pct))} % par semaine : lent ou stable. Si l’objectif est de perdre du poids, ajoute de l’activité ou ajuste l’alimentation.`}
              {!pace.unknown && pace.eta && ` Au rythme actuel, ${coachFmt(pace.target)} kg vers le ${coachDateFR(pace.eta.date)}.`}
            </p>
            <div className="grid sm:grid-cols-2 gap-2 text-xs">
              <div className="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-1">
                <p className="font-bold text-slate-200">Cette semaine</p>
                <p className="text-slate-300">Endurance (volley et cardio) : <b>{activity.aerobicMin} min</b> / 150 min minimum</p>
                <div className="h-1.5 bg-slate-800 rounded-full overflow-hidden"><div className="h-full bg-sky-500" style={{ width: `${Math.min(100, (activity.aerobicMin / 150) * 100)}%` }} /></div>
                <p className="text-slate-300">Renforcement : <b>{activity.strengthDays} jour(s)</b> / 2 minimum</p>
                {activity.aerobicMin < 150 && (
                  <button onClick={onQuickCardio} className="mt-1 px-2.5 py-1 rounded-lg bg-sky-600 text-white font-bold">+ Ajouter du cardio</button>
                )}
              </div>
              <div className="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-1">
                <p className="font-bold text-slate-200">Repère protéines</p>
                <p className="text-slate-300">Environ <b>{Math.round(protein * 1.6)} à {Math.round(protein * 2.2)} g par jour</b> (1,6 à 2,2 g/kg) pour préserver le muscle pendant une perte de poids (Morton 2018).</p>
                <p className="text-slate-500">Repère général : adapte-le avec un professionnel de santé si besoin.</p>
              </div>
            </div>
            <p className="text-[11px] text-slate-500">
              Conseil cardio : en phase de perte de poids, vise 150 à 250 minutes d’endurance par semaine ; ton volley compte. Une marche inclinée ou un vélo en intensité modérée un jour sans muscu est une bonne option (ACSM 2009).
            </p>
          </section>

          {/* VOLLEY */}
          {(coach.volleyDays || []).length > 0 && (
            <section className={card}>
              <h3 className="font-black text-white">🏐 Volley : épaules et gainage</h3>
              <p className="text-xs text-slate-300">
                Le volley sollicite beaucoup les épaules et les jambes. Renforcer la coiffe des rotateurs, le haut du dos et le tronc est une pratique courante en prévention. Attention : les preuves de réduction des blessures chez les volleyeurs restent limitées.
              </p>
              <div className="flex flex-wrap gap-1.5 text-xs">
                {['fp_ext_rotation', 'fp_face_pull', 'fp_plank'].map(id => {
                  const c = EXERCISE_CATALOG.find(x => x.id === id);
                  if (!c) return null;
                  const owned = gameState.quests.some(q => q.catalogId === id);
                  return owned ? (
                    <span key={id} className="px-2.5 py-1 rounded-lg bg-emerald-900/30 border border-emerald-500/40 text-emerald-300 font-bold">✅ {c.name}</span>
                  ) : (
                    <button key={id} onClick={() => onAddExercise(id)} className="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-100 font-bold">+ {c.name}</button>
                  );
                })}
              </div>
            </section>
          )}

          {/* SOURCES */}
          <section className={card}>
            <button onClick={() => setShowSources(s => !s)} className="w-full flex items-center justify-between text-left">
              <h3 className="font-black text-white">📚 Sources scientifiques</h3>
              <span className="text-xs text-pink-300 font-bold">{showSources ? 'Masquer' : 'Afficher'}</span>
            </button>
            {showSources && (
              <div className="space-y-2.5">
                <p className="text-[11px] text-slate-400">
                  ✔ = source consultée en ligne pour ce coach ; ◐ = référence réelle dont j’ai vérifié le titre, mais dont le chiffre cité vient de ma mémoire et que tu peux vérifier. Les études portent sur des groupes, pas sur toi en particulier.
                </p>
                {COACH_SOURCES.map((s, i) => (
                  <div key={i} className="text-[11px] bg-slate-950 border border-slate-800 rounded-xl p-2.5">
                    <p className="text-slate-200"><b>{s.ok ? '✔' : '◐'}</b> {s.text}</p>
                    <p className="text-slate-400 mt-0.5">→ {s.use}</p>
                  </div>
                ))}
              </div>
            )}
          </section>
        </div>
      );
    }

    // Séance guidée : exercice par exercice, avec repos automatique
    function GuidedSession({ g, setG, onFinish, onMinimize, onCancel }) {
      const [now, setNow] = useState(Date.now());
      const [confirmCancel, setConfirmCancel] = useState(false);
      useEffect(() => {
        const id = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(id);
      }, []);
      useEffect(() => {
        let lock = null;
        const req = async () => { try { if (navigator.wakeLock) lock = await navigator.wakeLock.request('screen'); } catch (e) {} };
        req();
        const onVis = () => { if (document.visibilityState === 'visible') req(); };
        document.addEventListener('visibilitychange', onVis);
        return () => {
          document.removeEventListener('visibilitychange', onVis);
          try { lock && lock.release(); } catch (e) {}
        };
      }, []);

      const elapsed = Math.max(0, Math.floor((now - g.startedAt) / 1000));
      const fmtT = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
      const items = g.items;
      const it = items[g.idx];
      const d = it ? g.data[it.questId] : null;
      const patch = (qid, p) => setG(prev => ({ ...prev, data: { ...prev.data, [qid]: { ...prev.data[qid], ...p } } }));
      const startRest = sec => { try { window.dispatchEvent(new CustomEvent('rondoufit-rest', { detail: sec })); } catch (e) {} };

      const toggleSet = i => {
        const wasDone = d.done[i];
        const done = d.done.map((x, k) => (k === i ? !x : x));
        patch(it.questId, { done });
        if (!wasDone) {
          const isLastSet = i === d.done.length - 1;
          const isLastEx = g.idx === items.length - 1;
          if (!(isLastSet && isLastEx)) startRest(it.restSec);
        }
      };
      const setReps = (i, v) => patch(it.questId, { reps: d.reps.map((r, k) => (k === i ? Math.max(0, v) : r)) });
      const addSet = () => patch(it.questId, { reps: [...d.reps, d.reps[d.reps.length - 1] || it.goalReps], done: [...d.done, false] });
      const removeSet = () => { if (d.reps.length > 1) patch(it.questId, { reps: d.reps.slice(0, -1), done: d.done.slice(0, -1) }); };
      const goto = idx => setG(prev => ({ ...prev, idx: Math.max(0, Math.min(items.length - 1, idx)), phase: 'run' }));
      const doneCount = it ? d.done.filter(Boolean).length : 0;
      const step = it && it.kind === 'load' ? (it.equip === 'Haltères' ? (d.load < 10 ? 1 : 2) : d.load < 10 ? 1 : 2.5) : 2.5;

      const RPE_LABELS = { 6: 'Facile', 7: 'Modéré', 8: 'Dur', 9: 'Très dur', 10: 'Maximum' };

      return (
        <div className="fixed inset-0 z-[60] bg-slate-950 overflow-y-auto">
          <div className="max-w-2xl mx-auto px-4 py-4 pb-28 space-y-4">
            <div className="flex items-center justify-between gap-2">
              <div>
                <p className="text-xs text-pink-300 font-black uppercase tracking-wider">Séance guidée {g.templateId ? `· ${g.templateId}` : ''}</p>
                <p className="text-xs text-slate-400">⏱ {fmtT(elapsed)} · {g.phase === 'summary' ? 'Résumé' : `Exercice ${g.idx + 1}/${items.length}`}</p>
              </div>
              <div className="flex gap-2">
                <button onClick={onMinimize} className="px-3 py-2 rounded-lg bg-slate-800 text-slate-200 text-xs font-bold">Réduire</button>
                <button onClick={() => setConfirmCancel(true)} className="px-3 py-2 rounded-lg bg-rose-900/60 text-rose-200 text-xs font-bold">Abandonner</button>
              </div>
            </div>

            <div className="flex gap-1">
              {items.map((x, i) => {
                const dn = g.data[x.questId].done.filter(Boolean).length;
                return (
                  <button key={x.questId} onClick={() => goto(i)} title={x.name}
                    className={`flex-1 h-2 rounded-full ${g.phase === 'run' && i === g.idx ? 'bg-pink-500' : dn > 0 ? 'bg-emerald-500' : 'bg-slate-700'}`} />
                );
              })}
            </div>

            {confirmCancel && (
              <div className="bg-rose-950/40 border border-rose-500/50 rounded-xl p-3 text-sm text-rose-100 space-y-2">
                <p>Abandonner la séance ? Rien ne sera enregistré.</p>
                <div className="flex gap-2">
                  <button onClick={onCancel} className="px-3 py-1.5 rounded-lg bg-rose-600 text-white font-bold text-xs">Oui, abandonner</button>
                  <button onClick={() => setConfirmCancel(false)} className="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-200 font-bold text-xs">Continuer</button>
                </div>
              </div>
            )}

            {g.phase === 'run' && it && d && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
                <div className="flex items-start justify-between gap-2">
                  <div>
                    <h2 className="text-xl font-black text-white">{it.icon} {it.name}</h2>
                    <p className="text-xs text-slate-400">{it.arena} · repos {Math.floor(it.restSec / 60)} min{it.restSec % 60 ? ` ${it.restSec % 60}` : ''}</p>
                  </div>
                  {(() => { const b = COACH_CHANGE_BADGES[it.change] || COACH_CHANGE_BADGES.new; return <span className={`shrink-0 px-2 py-0.5 rounded-full border text-[10px] font-bold ${b[2]}`}>{b[0]} {b[1]}</span>; })()}
                </div>
                <p className="text-[11px] text-slate-400">{it.reason}</p>
                {g.idx === 0 && g.warmup && <p className="text-[11px] text-amber-200 bg-amber-950/30 border border-amber-500/30 rounded-lg p-2">🔥 {g.warmup}</p>}

                {it.kind === 'load' && (
                  <div className="flex items-center justify-between bg-slate-950 border border-slate-800 rounded-xl p-3">
                    <span className="text-sm font-bold text-slate-300">Charge</span>
                    <div className="flex items-center gap-2">
                      <button onClick={() => patch(it.questId, { load: Math.max(0, Math.round((d.load - step) * 100) / 100) })} className="w-10 h-10 rounded-lg bg-slate-800 text-white text-xl font-black">−</button>
                      <input type="number" step="0.5" value={d.load} onChange={e => patch(it.questId, { load: Number(e.target.value) || 0 })} className="w-24 text-center bg-slate-950 border border-slate-700 rounded-lg py-2 text-xl font-black text-pink-300" />
                      <button onClick={() => patch(it.questId, { load: Math.round((d.load + step) * 100) / 100 })} className="w-10 h-10 rounded-lg bg-slate-800 text-white text-xl font-black">+</button>
                      <span className="text-sm text-slate-400">kg</span>
                    </div>
                  </div>
                )}
                {it.kind === 'assisted' && (
                  <div className="flex items-center justify-between bg-slate-950 border border-slate-800 rounded-xl p-3">
                    <span className="text-sm font-bold text-slate-300">Aide élastique</span>
                    <div className="flex items-center gap-2">
                      <button onClick={() => patch(it.questId, { assist: Math.max(0, d.assist - 2.5) })} className="w-10 h-10 rounded-lg bg-slate-800 text-white text-xl font-black">−</button>
                      <input type="number" step="2.5" value={d.assist} onChange={e => patch(it.questId, { assist: Math.max(0, Number(e.target.value) || 0) })} className="w-24 text-center bg-slate-950 border border-slate-700 rounded-lg py-2 text-xl font-black text-pink-300" />
                      <button onClick={() => patch(it.questId, { assist: d.assist + 2.5 })} className="w-10 h-10 rounded-lg bg-slate-800 text-white text-xl font-black">+</button>
                      <span className="text-sm text-slate-400">kg</span>
                    </div>
                  </div>
                )}

                <div className="space-y-2">
                  {d.reps.map((r, i) => (
                    <div key={i} className={`flex items-center justify-between gap-2 rounded-xl border p-2.5 ${d.done[i] ? 'bg-emerald-950/30 border-emerald-500/50' : 'bg-slate-950 border-slate-800'}`}>
                      <div>
                        <p className="text-sm font-black text-white">Série {i + 1}</p>
                        <p className="text-[10px] text-slate-500">objectif {it.targetReps[i] !== undefined ? it.targetReps[i] : it.goalReps} reps</p>
                      </div>
                      <div className="flex items-center gap-1.5">
                        <button onClick={() => setReps(i, (Number(r) || 0) - 1)} className="w-9 h-9 rounded-lg bg-slate-800 text-white text-lg font-black">−</button>
                        <input type="number" value={r} onChange={e => setReps(i, Number(e.target.value) || 0)} className="w-14 text-center bg-slate-950 border border-slate-700 rounded-lg py-1.5 text-lg font-black text-white" />
                        <button onClick={() => setReps(i, (Number(r) || 0) + 1)} className="w-9 h-9 rounded-lg bg-slate-800 text-white text-lg font-black">+</button>
                      </div>
                      <button onClick={() => toggleSet(i)} className={`px-3 py-2 rounded-lg text-sm font-black ${d.done[i] ? 'bg-emerald-600 text-white' : 'bg-pink-600 text-white'}`}>
                        {d.done[i] ? '✔ Faite' : 'Faite'}
                      </button>
                    </div>
                  ))}
                  <div className="flex gap-2">
                    <button onClick={addSet} className="flex-1 py-2 rounded-lg bg-slate-800 text-slate-200 text-xs font-bold">+ Série</button>
                    <button onClick={removeSet} className="flex-1 py-2 rounded-lg bg-slate-800 text-slate-200 text-xs font-bold">− Série</button>
                  </div>
                  <p className="text-[11px] text-slate-500">« Faite » lance automatiquement le chrono de repos (bouton en bas à droite).</p>
                </div>
              </div>
            )}

            {g.phase === 'summary' && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                <h2 className="text-lg font-black text-white">Résumé de la séance</h2>
                {items.map(x => {
                  const dd = g.data[x.questId];
                  const reps = dd.reps.filter((r, i) => dd.done[i]);
                  return (
                    <div key={x.questId} className="flex items-center justify-between gap-2 text-sm bg-slate-950 border border-slate-800 rounded-xl p-2.5">
                      <span className="font-bold text-white truncate">{x.icon} {x.name}</span>
                      <span className={reps.length ? 'text-emerald-300 font-bold' : 'text-slate-500'}>
                        {reps.length ? `${reps.join(' - ')} reps${x.kind === 'load' ? ` · ${coachFmt(dd.load)} kg` : x.kind === 'assisted' ? ` · aide ${coachFmt(dd.assist)} kg` : ''}` : 'passé'}
                      </span>
                    </div>
                  );
                })}
                <div>
                  <p className="text-xs font-bold text-slate-300 mb-1.5">Ressenti global de la séance (RPE)</p>
                  <div className="grid grid-cols-5 gap-1.5">
                    {[6, 7, 8, 9, 10].map(n => (
                      <button key={n} onClick={() => setG(prev => ({ ...prev, rpe: n }))}
                        className={`py-2 rounded-lg text-xs font-black border ${g.rpe === n ? 'bg-pink-600 border-pink-400 text-white' : 'bg-slate-950 border-slate-700 text-slate-300'}`}>
                        {n}<span className="block text-[9px] font-semibold">{RPE_LABELS[n]}</span>
                      </button>
                    ))}
                  </div>
                  <p className="text-[11px] text-slate-500 mt-1">Le coach s’en sert : si la séance était très dure, il consolide au lieu d’augmenter.</p>
                </div>
                <div className="flex gap-2">
                  <button onClick={() => goto(items.length - 1)} className="flex-1 py-3 rounded-xl bg-slate-800 text-slate-200 font-bold text-sm">Retour</button>
                  <button onClick={() => onFinish(g)} className="flex-[2] py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-black text-sm">Enregistrer la séance</button>
                </div>
              </div>
            )}
          </div>

          {g.phase === 'run' && it && (
            <div className="fixed bottom-0 inset-x-0 z-[61] bg-slate-950/95 border-t border-slate-800 px-4 py-3">
              <div className="max-w-2xl mx-auto flex gap-2">
                <button onClick={() => goto(g.idx - 1)} disabled={g.idx === 0} className="px-4 py-3 rounded-xl bg-slate-800 text-slate-200 font-bold text-sm disabled:opacity-40">◀</button>
                <button onClick={() => goto(g.idx + 1)} className="px-4 py-3 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs">Passer</button>
                <button
                  onClick={() => (g.idx === items.length - 1 ? setG(prev => ({ ...prev, phase: 'summary' })) : goto(g.idx + 1))}
                  className="flex-1 py-3 rounded-xl bg-pink-600 hover:bg-pink-500 text-white font-black text-sm"
                >
                  {g.idx === items.length - 1 ? 'Terminer ▶ Résumé' : `Exercice suivant ▶ (${doneCount}/${d.reps.length} séries)`}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function RestTimer({ soundEnabled }) {
      const [open, setOpen] = useState(false);
      const [endAt, setEndAt] = useState(null);
      const [left, setLeft] = useState(0);
      const [total, setTotal] = useState(90);
      useEffect(() => {
        if (!endAt) return;
        const id = setInterval(() => {
          const l = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
          setLeft(l);
          if (l === 0) {
            clearInterval(id);
            setEndAt(null);
            playGameSound('boss', soundEnabled);
            try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
          }
        }, 250);
        return () => clearInterval(id);
      }, [endAt]);
      const start = sec => { setTotal(sec); setLeft(sec); setEndAt(Date.now() + sec * 1000); };
      const addTime = () => { setTotal(t => t + 30); setLeft(l => l + 30); setEndAt(e => (e || Date.now()) + 30000); };
      const stop = () => { setEndAt(null); setLeft(0); };
      useEffect(() => {
        const h = e => { const s = Number(e.detail) || 90; start(s); };
        window.addEventListener('rondoufit-rest', h);
        return () => window.removeEventListener('rondoufit-rest', h);
      });
      const fmt = sec => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
      const running = !!endAt;
      return (
        <div className="fixed bottom-24 right-4 z-[70] flex flex-col items-end gap-2">
          {open && (
            <div className="bg-slate-900 border border-slate-700 rounded-2xl p-3 shadow-2xl w-56 space-y-2.5">
              <div className="flex items-center justify-between">
                <span className="text-xs font-black uppercase text-pink-300">⏱ Repos entre séries</span>
                <button onClick={() => setOpen(false)} className="text-slate-400 hover:text-white text-sm">✕</button>
              </div>
              {running && (
                <div>
                  <div className="text-3xl font-black text-white text-center tabular-nums">{fmt(left)}</div>
                  <div className="h-1.5 bg-slate-800 rounded-full overflow-hidden mt-1">
                    <div className="h-full bg-pink-500 transition-all" style={{ width: `${Math.min(100, (left / total) * 100)}%` }} />
                  </div>
                  <div className="flex gap-2 mt-2">
                    <button onClick={addTime} className="flex-1 py-1.5 rounded-lg bg-slate-800 text-xs font-bold text-slate-200 hover:bg-slate-700">+30 s</button>
                    <button onClick={stop} className="flex-1 py-1.5 rounded-lg bg-rose-900/60 text-xs font-bold text-rose-200 hover:bg-rose-800">Stop</button>
                  </div>
                </div>
              )}
              <div className="grid grid-cols-3 gap-2">
                {[60, 90, 120].map(sec => (
                  <button key={sec} onClick={() => start(sec)} className="py-2 rounded-lg bg-pink-600/80 hover:bg-pink-600 text-white text-xs font-black">
                    {sec} s
                  </button>
                ))}
              </div>
            </div>
          )}
          <button
            onClick={() => setOpen(o => !o)}
            title="Minuteur de repos"
            className={`h-12 px-4 rounded-full shadow-2xl border-2 text-sm font-black flex items-center justify-center gap-1.5 ${
              running ? 'bg-emerald-600 border-emerald-300 text-white' : 'bg-pink-600 border-pink-300 text-white shadow-pink-600/50'
            }`}
          >
            ⏱ {running ? <span className="tabular-nums text-base">{fmt(left)}</span> : <span>Repos</span>}
          </button>
        </div>
      );
    }

    // ==========================================
    // FONCTIONS UTILITAIRES
    // ==========================================
    const toLocalISODate = d =>
      `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const getTodayISODate = () => toLocalISODate(new Date());

    function getYesterdayISODate() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return toLocalISODate(d);
    }

    function getSetDetailsArray(item, fallbackSets = 3, fallbackReps = 6) {
      if (Array.isArray(item?.setDetails) && item.setDetails.length > 0) {
        return item.setDetails.map(r => Math.max(0, Number(r) || 0));
      }
      const count = Math.max(1, Number(item?.sets || item?.currentSets || fallbackSets) || 3);
      const reps = Math.max(0, Number(item?.reps ?? item?.value ?? item?.currentValue ?? fallbackReps) || 0);
      return Array(count).fill(reps);
    }

    function formatSetsBreakdown(setDetails) {
      if (!Array.isArray(setDetails) || setDetails.length === 0) return '';
      return setDetails.join(' - ');
    }

    function countValidatedSets(setDetails, goalReps) {
      const target = Math.max(1, Number(goalReps) || 1);
      return (setDetails || []).filter(r => Number(r) >= target).length;
    }

    // Calories NETTES (hors métabolisme de repos : 1 MET = 1 kcal/kg/h retiré)
    function calculateStrengthCalories({ unit, weightKg = 0, assistanceKg = 0, setDetails = [6, 6, 6], rpe = 7, userWeightKg = 82 }) {
      const numSets = Math.max(1, setDetails.length);
      const totalReps = setDetails.reduce((acc, r) => acc + (Number(r) || 0), 0);
      const durationHours = (numSets * 2.2 + totalReps * 0.05) / 60;
      const effectiveLoad = unit === 'reps'
        ? Math.max(15, userWeightKg * 0.78 - (Number(assistanceKg) || 0))
        : Math.max(5, Number(weightKg) || 0);
      const loadRatio = effectiveLoad / Math.max(45, userWeightKg);
      const grossMet = Math.min(6.0, 3.8 + (rpe - 5) * 0.55 + Math.min(2.8, loadRatio * 1.45));
      return Math.max(10, Math.round((grossMet - 1) * userWeightKg * durationHours));
    }

    function calculateCardioCalories({ cardioMode = 'run', distanceKm = 5, durationMin = 30, elevationM = 0, rpe = 7, userWeightKg = 82 }) {
      const durMin = Math.max(1, Number(durationMin) || 20);
      const distKm = Math.max(0.1, Number(distanceKm) || 0);
      const elevM = Math.max(0, Number(elevationM) || 0);
      const w = Math.max(30, Number(userWeightKg) || 82);
      const hours = durMin / 60;
      let kcal = 0;

      if (cardioMode === 'volleyball') {
        // ~3 MET à RPE 4, ~4,8 à RPE 7, ~6 à RPE 9 (valeurs brutes), temps morts inclus
        const grossMet = Math.max(2, 3 + (Math.min(10, Math.max(1, rpe)) - 4) * 0.6);
        kcal = (grossMet - 1) * w * hours;
      } else if (['run', 'interval', 'walk', 'incline_walk'].includes(cardioMode)) {
        // Équations ACSM (vitesse + pente), VO2 en ml/kg/min, 1 L O2 ≈ 5 kcal
        const speed = (distKm * 1000) / durMin; // m/min
        const grade = Math.min(0.25, elevM / (distKm * 1000));
        const isRunning = cardioMode === 'run' || cardioMode === 'interval' || speed >= 120;
        const vo2 = isRunning
          ? 0.2 * speed + 0.9 * speed * grade + 3.5
          : 0.1 * speed + 1.8 * speed * grade + 3.5;
        kcal = (vo2 - 3.5) * w * durMin / 1000 * 5; // net : repos retiré
      } else {
        const MET_BY_MODE = { bike: 6.8, elliptical: 5.0, rower: 7.0, stairs: 8.8, skierg: 7.5, jumprope: 10.5, hiit: 8.0, boxing: 7.5, group_class: 6.0 };
        const grossMet = (MET_BY_MODE[cardioMode] || 6.8) + (rpe - 6) * 0.5;
        kcal = (grossMet - 1) * w * hours + (cardioMode === 'other' ? w * elevM * 0.01 : 0);
      }
      return Math.max(20, Math.round(kcal));
    }

    function formatPaceAndSpeed(distanceKm, durationMin) {
      const dist = Number(distanceKm) || 0;
      const dur = Number(durationMin) || 0;
      if (dist <= 0 || dur <= 0) return { pace: '--:-- /km', speed: '0.0 km/h' };
      const paceDecimal = dur / dist;
      const paceMin = Math.floor(paceDecimal);
      const paceSec = Math.round((paceDecimal - paceMin) * 60);
      const normalizedMin = paceSec === 60 ? paceMin + 1 : paceMin;
      const normalizedSec = paceSec === 60 ? 0 : paceSec;
      const speed = (dist / (dur / 60)).toFixed(1);
      return {
        pace: `${normalizedMin}'${String(normalizedSec).padStart(2, '0')}" /km`,
        speed: `${speed} km/h`
      };
    }

    function evaluateQuestProgress(quest) {
      if (quest.type === 'cardio') {
if (quest.goalMode === 'free_mode') return { percent: 100, isBossDefeated: false, validatedSets: 1, goalSets: 1, goalReps: 1, setDetails: [] };
        const start = Number(quest.startValue) || 0;
        const current = Number(quest.currentValue) || 0;
        const goal = Number(quest.goalValue) || 1;
        if (current >= goal) return { percent: 100, isBossDefeated: true, validatedSets: 1, goalSets: 1 };
        if (goal <= start) return { percent: 100, isBossDefeated: true, validatedSets: 1, goalSets: 1 };
        const pct = Math.round(((current - start) / (goal - start)) * 100);
        return { percent: Math.max(5, Math.min(99, pct)), isBossDefeated: false, validatedSets: 0, goalSets: 1 };
      }

      const goalMode = quest.goalMode || 'sets_reps';
if (goalMode === 'free_mode') return { percent: 100, isBossDefeated: false, validatedSets: 1, goalSets: 1, goalReps: 1, setDetails: [] };
      const goalSets = Math.max(1, Number(quest.goalSets) || 3);
      const goalReps = Math.max(1, Number(quest.goalReps) || Number(quest.goalValue) || 6);
      const setDetails = getSetDetailsArray(quest, goalSets, goalReps);
      const validatedSets = countValidatedSets(setDetails, goalReps);
      const bestReps = Math.max(...setDetails, Number(quest.currentValue) || 0);

      if (goalMode === 'weight_only') {
        const startKg = Number(quest.startValue) || 0;
        const currKg = Number(quest.currentValue) || 0;
        const goalKg = Number(quest.goalValue) || 1;
        if (currKg >= goalKg) {
          return { percent: 100, isBossDefeated: true, validatedSets, goalSets, goalReps, setDetails };
        }
        const ratio = goalKg > startKg ? (currKg - startKg) / (goalKg - startKg) : 0.5;
        return { percent: Math.max(5, Math.min(99, Math.round(ratio * 100))), isBossDefeated: false, validatedSets, goalSets, goalReps, setDetails };
      }

      const startAssist = Number(quest.startAssistanceKg) || 0;
      const currAssist = Number(quest.currentAssistanceKg) || 0;
      const goalAssist = Number(quest.goalAssistanceKg) || 0;
      const assistGoalMet = quest.unit !== 'reps' || currAssist <= goalAssist;

      let assistRatio = 1;
      if (quest.unit === 'reps') {
        if (startAssist > goalAssist) {
          assistRatio = Math.max(0, Math.min(1, (startAssist - currAssist) / (startAssist - goalAssist)));
        } else if (currAssist > goalAssist) {
          assistRatio = Math.max(0, 1 - (currAssist - goalAssist) / 25);
        }
      }

      if (goalMode === 'reps_only') {
        const startR = Number(quest.startValue) || 0;
        const targetR = goalReps;
        const repsMet = bestReps >= targetR;
        const loadMet = quest.unit !== 'kg' || (Number(quest.currentValue) || 0) >= (Number(quest.goalValue) || 0);

        if (repsMet && assistGoalMet && loadMet) {
          return { percent: 100, isBossDefeated: true, validatedSets, goalSets: 1, goalReps: targetR, setDetails };
        }
        const repRatio = targetR > startR ? Math.max(0, Math.min(1, (bestReps - startR) / (targetR - startR))) : Math.min(1, bestReps / Math.max(1, targetR));
        const combined = quest.unit === 'reps' && (startAssist > goalAssist || currAssist > goalAssist)
          ? repRatio * 0.65 + assistRatio * 0.35
          : repRatio;
        return { percent: Math.max(5, Math.min(99, Math.round(combined * 100))), isBossDefeated: false, validatedSets, goalSets: 1, goalReps: targetR, setDetails };
      }

      let achievedTargetRepsSum = 0;
      for (let i = 0; i < goalSets; i++) {
        const r = Number(setDetails[i]) || 0;
        achievedTargetRepsSum += Math.min(r, goalReps);
      }
      const setsRepsRatio = achievedTargetRepsSum / (goalSets * goalReps);
      const allSetsValidated = validatedSets >= goalSets;

      if (quest.unit === 'reps') {
        if (allSetsValidated && assistGoalMet) {
          return { percent: 100, isBossDefeated: true, validatedSets, goalSets, goalReps, setDetails };
        }
        const combined = startAssist > goalAssist || currAssist > goalAssist
          ? setsRepsRatio * 0.65 + assistRatio * 0.35
          : setsRepsRatio;
        return { percent: Math.max(5, Math.min(99, Math.round(combined * 100))), isBossDefeated: false, validatedSets, goalSets, goalReps, setDetails };
      } else {
        const startKg = Number(quest.startValue) || 0;
        const currKg = Number(quest.currentValue) || 0;
        const goalKg = Number(quest.goalValue) || 1;
        const loadGoalMet = currKg >= goalKg;
        let loadRatio = 1;
        if (goalKg > startKg) {
          loadRatio = Math.max(0, Math.min(1, (currKg - startKg) / (goalKg - startKg)));
        }
        if (loadGoalMet && allSetsValidated) {
          return { percent: 100, isBossDefeated: true, validatedSets, goalSets, goalReps, setDetails };
        }
        const combined = loadRatio * 0.55 + setsRepsRatio * 0.45;
        return { percent: Math.max(5, Math.min(99, Math.round(combined * 100))), isBossDefeated: false, validatedSets, goalSets, goalReps, setDetails };
      }
    }

    function compareWithPreviousSession(quest, currentEntry, prevEntry) {
      if (!prevEntry) {
        return {
          isFirst: true,
          improved: false,
          goalBeaten: Boolean(currentEntry.goalBeaten),
          badges: ['🌟 Première séance sur cet exercice'],
          prevSummary: null,
          currSummary: null
        };
      }

      const badges = [];
      let improved = false;

      if (quest.type === 'cardio') {
        const currVal = Number(currentEntry.value) || 0;
        const prevVal = Number(prevEntry.value) || 0;
        const diffVal = +(currVal - prevVal).toFixed(2);
        if (diffVal > 0) {
          improved = true;
          badges.push(`🏃 +${diffVal} ${quest.unit} parcourus`);
        }
        const currDur = Number(currentEntry.durationMin) || 0;
        const prevDur = Number(prevEntry.durationMin) || 0;
        if (currVal >= prevVal && currDur > 0 && prevDur > 0 && currDur < prevDur) {
          improved = true;
          badges.push(`⚡ -${prevDur - currDur} min (plus rapide)`);
        }
        return {
          isFirst: false,
          improved,
          goalBeaten: Boolean(currentEntry.goalBeaten || currVal >= (Number(quest.goalValue) || 999)),
          badges,
          prevSummary: `${prevVal} ${quest.unit} (${prevDur || 25} min)`,
          currSummary: `${currVal} ${quest.unit} (${currDur || 25} min)`
        };
      }

      const goalReps = Number(currentEntry.goalReps || quest.goalReps || quest.goalValue || 6);
      const goalSets = Number(currentEntry.goalSets || quest.goalSets || 3);
      const currSetsArr = getSetDetailsArray(currentEntry, goalSets, goalReps);
      const prevSetsArr = getSetDetailsArray(prevEntry, goalSets, goalReps);

      const currValidSets = countValidatedSets(currSetsArr, goalReps);
      const prevValidSets = countValidatedSets(prevSetsArr, goalReps);

      const currTotalReps = currSetsArr.reduce((a, b) => a + b, 0);
      const prevTotalReps = prevSetsArr.reduce((a, b) => a + b, 0);

      if (quest.unit === 'kg') {
        const currKg = Number(currentEntry.value) || 0;
        const prevKg = Number(prevEntry.value) || 0;
        const diffKg = +(currKg - prevKg).toFixed(1);
        if (diffKg > 0) {
          improved = true;
          badges.push(`🏋️ +${diffKg} kg sur la barre`);
        }
      } else if (quest.unit === 'reps') {
        const currAssist = Number(currentEntry.assistanceKg) || 0;
        const prevAssist = Number(prevEntry.assistanceKg) || 0;
        if (currAssist < prevAssist) {
          improved = true;
          badges.push(`🪢 -${+(prevAssist - currAssist).toFixed(1)} kg d'aide élastique`);
        }
      }

      if (currValidSets > prevValidSets) {
        improved = true;
        badges.push(`🔴 +${currValidSets - prevValidSets} série(s) cible(s) validée(s)`);
      }

      if (currTotalReps > prevTotalReps) {
        improved = true;
        badges.push(`🔁 +${currTotalReps - prevTotalReps} reps au volume total`);
      }

      const prevSummary = quest.unit === 'kg'
        ? `${prevEntry.value} kg • [${formatSetsBreakdown(prevSetsArr)}]`
        : `[${formatSetsBreakdown(prevSetsArr)}] (${Number(prevEntry.assistanceKg) > 0 ? `Aide ${prevEntry.assistanceKg}kg` : 'Strict 0kg'})`;

      const currSummary = quest.unit === 'kg'
        ? `${currentEntry.value} kg • [${formatSetsBreakdown(currSetsArr)}]`
        : `[${formatSetsBreakdown(currSetsArr)}] (${Number(currentEntry.assistanceKg) > 0 ? `Aide ${currentEntry.assistanceKg}kg` : 'Strict 0kg'})`;

      return {
        isFirst: false,
        improved,
        goalBeaten: Boolean(currentEntry.goalBeaten),
        badges,
        prevSummary,
        currSummary
      };
    }

    // ==========================================
    function playGameSound(type, enabled = true) {
      if (!enabled || typeof window === 'undefined') return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        const makeTone = (freq, start, duration, wave = 'sine', gainVal = 0.12) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = wave;
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(gainVal, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + duration);
        };

        if (type === 'xp') {
          makeTone(523.25, now, 0.12, 'sine', 0.12);
          makeTone(659.25, now + 0.1, 0.15, 'sine', 0.13);
          makeTone(783.99, now + 0.2, 0.24, 'triangle', 0.14);
        } else if (type === 'boss') {
          makeTone(659.25, now, 0.22, 'sine', 0.15);
          makeTone(783.99, now + 0.24, 0.22, 'sine', 0.15);
          makeTone(739.99, now + 0.48, 0.22, 'sine', 0.15);
          makeTone(783.99, now + 0.72, 0.22, 'sine', 0.15);
          makeTone(880.0, now + 0.96, 0.45, 'triangle', 0.18);
        } else if (type === 'click') {
          makeTone(680, now, 0.05, 'sine', 0.07);
        }
      } catch (e) {}
    }

    // Ajoute au dictionnaire vocal une entrée par exercice du catalogue étendu
    (function extendVoiceDictionary() {
      const clean = t => stripAccents(t).replace(/[^a-z0-9]+/g, ' ').trim();
      const seen = new Set();
      VOICE_DICTIONARY.forEach(d => d.aliases.forEach(a => seen.add(clean(a))));
      EXERCISE_CATALOG.forEach(c => {
        const list = VOICE_ALIASES_EXTRA[c.id];
        if (!list) return;
        const aliases = [];
        list.forEach(a => {
          const n = clean(a);
          if (!n || n.split(' ').length > 3 || seen.has(n)) return;
          seen.add(n);
          aliases.push(n);
        });
        if (aliases.length === 0) return;
        VOICE_DICTIONARY.push({
          id: c.id,
          name: c.name,
          category: c.category,
          type: c.type,
          unit: c.unit,
          cardioMode: c.cardioMode,
          icon: c.icon,
          defaultGoal: c.defaultGoal,
          defaultGoalSets: c.defaultGoalSets || 3,
          defaultGoalReps: c.defaultGoalReps || 8,
          strict: true,
          aliases
        });
      });
    })();

    // Supprime les accents et normalise pour comparer facilement les mots mal retranscrits
    function stripAccents(str = '') {
      return str
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase();
    }

    // Distance de Levenshtein pour tolérer les fautes de frappe ou d'écoute ("tracon" vs "traction" = 1)
    function levenshteinDistance(a = '', b = '') {
      const m = a.length;
      const n = b.length;
      if (m === 0) return n;
      if (n === 0) return m;
      const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + cost
          );
        }
      }
      return dp[m][n];
    }

    // Convertit les nombres écrits en toutes lettres par la dictée vocale
    function normalizeSpokenNumbers(text = '') {
      return text
        .replace(/,/g, '.')
        .replace(/\b(une|un)\b/gi, '1')
        .replace(/\bdeux\b/gi, '2')
        .replace(/\btrois\b/gi, '3')
        .replace(/\bquatre\b/gi, '4')
        .replace(/\bcinq\b/gi, '5')
        .replace(/\bsix\b/gi, '6')
        .replace(/\bsept\b/gi, '7')
        .replace(/\bhuit\b/gi, '8')
        .replace(/\bneuf\b/gi, '9')
        .replace(/\bdix\b/gi, '10')
        .replace(/\bonze\b/gi, '11')
        .replace(/\bdouze\b/gi, '12')
        .replace(/\btreize\b/gi, '13')
        .replace(/\bquatorze\b/gi, '14')
        .replace(/\bquinze\b/gi, '15')
        .replace(/\bseize\b/gi, '16')
        .replace(/\bvingt\b/gi, '20')
        .replace(/\btrente\b/gi, '30')
        .replace(/\bquarante\b/gi, '40')
        .replace(/\bcinquante\b/gi, '50')
        .replace(/\bsoixante\b/gi, '60')
        .replace(/\bquatre-vingts?\b/gi, '80')
        .replace(/\bcent\b/gi, '100');
    }

      'elastique', 'elastiques', 'series', 'serie', 'repetitions', 'repetition', 'kilos', 'kilo',
      'fois', 'minutes', 'minute', 'heure', 'heures', 'kilometres', 'kilometre', 'aide', 'seance',
      'matin', 'soir', 'fini', 'fin', 'derniere', 'premier'
    ]);

    // Repère TOUS les exercices présents dans une même phrase et découpe automatiquement
    function parseSpokenWorkout(rawText, existingQuests = [], userWeightKg = 82) {
      if (!rawText || !rawText.trim()) return [];

      const textWithDigits = normalizeSpokenNumbers(rawText);
      const normText = stripAccents(textWithDigits);

      // Construction de la liste complète de cibles (Quêtes perso + Dictionnaire vocal)
      const candidates = [];

      existingQuests.forEach(q => {
        const cleanQName = stripAccents(q.name);
        candidates.push({
          phrase: cleanQName,
          quest: q,
          catalog: VOICE_DICTIONARY.find(d => d.id === q.catalogId) || null
        });
      });

      VOICE_DICTIONARY.forEach(dictItem => {
        const linkedQuest = existingQuests.find(
          q => q.catalogId === dictItem.id || stripAccents(q.name) === stripAccents(dictItem.name)
        );
        dictItem.aliases.forEach(alias => {
          candidates.push({
            phrase: stripAccents(alias),
            quest: linkedQuest || null,
            catalog: dictItem,
            strict: !!dictItem.strict
          });
        });
      });

      // Tri par longueur décroissante pour privilégier "tractions supination" avant "tractions"
      candidates.sort((a, b) => b.phrase.length - a.phrase.length);

      // Découpage en mots avec leur position exacte dans la phrase
      const wordTokens = [];
      const wordRegex = /[a-z0-9]+/g;
      let match;
      while ((match = wordRegex.exec(normText)) !== null) {
        wordTokens.push({
          word: match[0],
          start: match.index,
          end: match.index + match[0].length
        });
      }

      const anchors = [];
      const usedTokenIndices = new Set();

      // Analyse glissante sur 1, 2 et 3 mots avec tolérance aux fautes (Levenshtein)
      for (let i = 0; i < wordTokens.length; i++) {
        if (usedTokenIndices.has(i)) continue;
        // Ignore les petits mots de liaison ou chiffres purs comme point de départ
        if (/^\d+$/.test(wordTokens[i].word) || wordTokens[i].word.length <= 2) continue;

        let bestMatch = null;

        for (let len = 3; len >= 1; len--) {
          if (i + len > wordTokens.length) continue;
          const sliceTokens = wordTokens.slice(i, i + len);
          const spokenPhrase = sliceTokens.map(t => t.word).join(' ');
          const startsWithCommon = VOICE_COMMON_WORDS.has(sliceTokens[0].word);

          for (const cand of candidates) {
            const target = cand.phrase;
            const targetWordsCount = target.split(' ').length;
            if (Math.abs(targetWordsCount - len) > 1) continue;

            const dist = levenshteinDistance(spokenPhrase, target);
            if (dist > 0 && startsWithCommon) continue;
            let maxAllowedDist = target.length >= 10 ? 3 : target.length >= 5 ? 2 : 0;
            if (cand.strict) {
              // Exercices du catalogue étendu : tolérance réduite, même première lettre
              maxAllowedDist = target.length >= 12 ? 2 : target.length >= 6 ? 1 : 0;
              if (dist > 0 && spokenPhrase[0] !== target[0]) continue;
            }

            if (dist <= maxAllowedDist) {
              if (!bestMatch || dist < bestMatch.dist || (dist === bestMatch.dist && target.length > bestMatch.targetLen)) {
                bestMatch = {
                  cand,
                  dist,
                  targetLen: target.length,
                  startChar: sliceTokens[0].start,
                  tokenStart: i,
                  tokenEnd: i + len - 1
                };
              }
            }
          }
          if (bestMatch && bestMatch.dist === 0) break;
        }

        if (bestMatch) {
          for (let k = bestMatch.tokenStart; k <= bestMatch.tokenEnd; k++) {
            usedTokenIndices.add(k);
          }
          anchors.push({
            startChar: bestMatch.startChar,
            quest: bestMatch.cand.quest,
            catalog: bestMatch.cand.catalog
          });
        }
      }

      if (anchors.length === 0) return [];

      // Si deux ancres consécutives désignent exactement le même exercice sans chiffre entre elles, on les fusionne
      const cleanedAnchors = [];
      anchors.forEach(a => {
        const prev = cleanedAnchors[cleanedAnchors.length - 1];
        const sameId =
          prev &&
          ((a.quest && prev.quest && a.quest.id === prev.quest.id) ||
            (a.catalog && prev.catalog && a.catalog.id === prev.catalog.id));
        const betweenText = prev ? normText.slice(prev.startChar, a.startChar) : '';
        if (sameId && !/\d/.test(betweenText)) {
          return;
        }
        cleanedAnchors.push(a);
      });

      // Extraction des paramètres (kg, élastique, séries, reps, km) pour chaque segment d'exercice
      return cleanedAnchors.map((anchor, idx) => {
        const segEnd = idx + 1 < cleanedAnchors.length ? cleanedAnchors[idx + 1].startChar : normText.length;
        // Les chiffres suivent en général le nom de l'exercice : on part du nom s'il y a des chiffres après,
        // sinon on garde l'ancien découpage au milieu des deux exercices.
        const ownText = normText.slice(anchor.startChar, segEnd);
        const segStart =
          idx === 0
            ? 0
            : /\d/.test(ownText)
              ? anchor.startChar
              : Math.floor((cleanedAnchors[idx - 1].startChar + anchor.startChar) / 2);
        const seg = normText.slice(segStart, segEnd);

        const ref = anchor.quest || anchor.catalog;
        const isCardio = ref.type === 'cardio';

        if (isCardio) {
          const isTimeOnly = ref.unit === 'min';
          const kmMatch = seg.match(/(\d+(?:\.\d+)?)\s*(?:km|kilom[eè]tre|kilom[eè]tres|borne|bornes)/i);
          const minMatch = seg.match(/(\d+(?:\.\d+)?)\s*(?:min|minute|minutes)/i);
          const hourMatch = seg.match(/(\d+(?:\.\d+)?)\s*(?:heure|heures|h\b)/i);
          
          let parsedMin = 0;
          if (hourMatch) parsedMin += Number(hourMatch[1]) * 60;
          if (minMatch) parsedMin += Number(minMatch[1]);
          
          const dist = kmMatch ? Number(kmMatch[1]) : (isTimeOnly ? 0 : (Number(anchor.quest?.currentValue) || 5));
          const dur = parsedMin > 0 ? parsedMin : (isTimeOnly ? (Number(anchor.quest?.currentValue) || 60) : Math.round(dist * 6));
          
          const kcal = calculateCardioCalories({
            cardioMode: ref.cardioMode || 'run',
            distanceKm: dist,
            durationMin: dur,
            elevationM: 0,
            rpe: 7,
            userWeightKg
          });
          return {
            id: `vp_${idx}_${Date.now()}`,
            questId: anchor.quest?.id || null,
            catalogRef: anchor.catalog,
            name: ref.name,
            category: ref.category || 'Course & Cardio',
            type: 'cardio',
            unit: ref.unit || 'km',
            icon: ref.icon || '🏃',
            distanceKm: dist,
            durationMin: dur,
            calories: kcal,
            summary: isTimeOnly ? `${dur} min` : `${dist} km en ${dur} min`
          };
        }

        // 1. Aide élastique éventuelle (ex: "élastique 10 kg", "aide de 15 kilos", "assisté à 10 kg")
        const assistMatch = seg.match(/(?:elastique|elas|aide|assiste|delestage)\s*(?:de|a)?\s*(\d+(?:\.\d+)?)\s*(?:kg|kilo|kilos)?/);
        const assistanceKg = assistMatch ? Number(assistMatch[1]) : 0;

        // 2. Charge en kg (hors élastique)
        let segWithoutAssist = assistMatch ? seg.replace(assistMatch[0], ' ') : seg;
        const kgMatch = segWithoutAssist.match(/(\d+(?:\.\d+)?)\s*(?:kg|kilo|kilos)/);
        const weightKg = kgMatch ? Number(kgMatch[1]) : (Number(anchor.quest?.currentValue) || 40);
        if (kgMatch) {
          segWithoutAssist = segWithoutAssist.replace(kgMatch[0], ' ');
        }

        // 3. Extraction intelligente des séries et répétitions
        let setDetails = [];
        // Format uniforme : "3 séries de 10", "3 x 10", "3 fois 10", "4 par 8"
        const uniformMatch = segWithoutAssist.match(/(\d+)\s*(?:series?\s*(?:de|a)|fois|x|×|par)\s*(\d+)/);
        // Format inversé : "10 répétitions sur 3 séries"
        const reverseUniformMatch = segWithoutAssist.match(/(\d+)\s*(?:repetitions?|reps?)\s*(?:sur|en|x)\s*(\d+)\s*series?/);

        if (uniformMatch) {
          const sCount = Math.min(12, Math.max(1, Number(uniformMatch[1])));
          const rCount = Math.max(1, Number(uniformMatch[2]));
          setDetails = Array(sCount).fill(rCount);
        } else if (reverseUniformMatch) {
          const rCount = Math.max(1, Number(reverseUniformMatch[1]));
          const sCount = Math.min(12, Math.max(1, Number(reverseUniformMatch[2])));
          setDetails = Array(sCount).fill(rCount);
        } else {
          // Format détaillé : "6, 6 et 4 reps" ou "3 séries : 8 8 6"
          const cleanedForReps = segWithoutAssist.replace(/(\d+)\s*series?(?!\s*(?:de|a|\d))/g, ' ');
          const allNums = (cleanedForReps.match(/\d+/g) || [])
            .map(Number)
            .filter(n => n > 0 && n <= 100);

          if (allNums.length >= 2) {
            setDetails = allNums.slice(0, 8);
          } else if (allNums.length === 1) {
            const defSets = Number(anchor.quest?.goalSets || anchor.catalog?.defaultGoalSets || 3);
            setDetails = Array(defSets).fill(allNums[0]);
          } else {
            const defSets = Number(anchor.quest?.goalSets || anchor.catalog?.defaultGoalSets || 3);
            const defReps = Number(anchor.quest?.goalReps || anchor.catalog?.defaultGoalReps || 8);
            setDetails = Array(defSets).fill(defReps);
          }
        }

        const unit = anchor.quest?.unit || ref.unit || (kgMatch ? 'kg' : 'reps');
        const kcal = calculateStrengthCalories({
          unit,
          weightKg: unit === 'kg' ? weightKg : 0,
          assistanceKg: unit === 'reps' ? assistanceKg : 0,
          setDetails,
          rpe: 7,
          userWeightKg
        });

        return {
          id: `vp_${idx}_${Date.now()}`,
          questId: anchor.quest?.id || null,
          catalogRef: anchor.catalog,
          name: ref.name,
          category: ref.category || 'Pectoraux',
          type: 'strength',
          unit,
          icon: ref.icon || '🏋️',
          weightKg: unit === 'kg' ? weightKg : Math.max(...setDetails),
          assistanceKg: unit === 'reps' ? assistanceKg : 0,
          setDetails,
          calories: kcal,
          summary: `${unit === 'kg' ? `${weightKg} kg • ` : ''}[${setDetails.join(' - ')} reps]${
            unit === 'reps' && assistanceKg > 0 ? ` (Aide -${assistanceKg} kg)` : ''
          }`
        };
      });
    }

    function VoiceWorkoutAssistant({ gameState, setGameState, selectedDate, triggerToast, playGameSound }) {
      const [isOpen, setIsOpen] = useState(false);
      const [spokenText, setSpokenText] = useState('');
      const [interimText, setInterimText] = useState('');
      const [isListening, setIsListening] = useState(false);
      const [micStatusMsg, setMicStatusMsg] = useState('');
      const [editableItems, setEditableItems] = useState([]);
      const recognitionRef = useRef(null);
      const inputRef = useRef(null);

      const combinedText = (spokenText + (interimText ? ' ' + interimText : '')).trim();

      // Met à jour la liste des exercices détectés dès que le texte dicté évolue
      useEffect(() => {
        const parsed = parseSpokenWorkout(combinedText, gameState.quests, gameState.userWeightKg);
        setEditableItems(parsed);
      }, [combinedText, gameState.quests, gameState.userWeightKg]);

      const toggleBrowserDictation = () => {
        if (isListening && recognitionRef.current) {
          try { recognitionRef.current.stop(); } catch (e) {}
          setIsListening(false);
          setInterimText('');
          setMicStatusMsg('Écoute terminée. Vérifiez l’aperçu ci-dessous puis validez en 1 clic !');
          return;
        }

        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          setMicStatusMsg("💡 Astuce : Cliquez dans la zone de texte et utilisez le bouton Micro 🎤 de votre clavier (ou Windows + H sur PC) !");
          inputRef.current?.focus();
          return;
        }

        try {
          if (recognitionRef.current) {
            try { recognitionRef.current.abort(); } catch (e) {}
          }

          const rec = new SpeechRec();
          recognitionRef.current = rec;
          rec.lang = 'fr-FR';
          rec.continuous = true;
          rec.interimResults = true;

          rec.onstart = () => {
            setIsListening(true);
            setMicStatusMsg('🟢 Micro actif : dictez toute votre séance d’une traite (plusieurs exercices)...');
          };

          rec.onresult = (event) => {
            let finalChunk = '';
            let interimChunk = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
              const transcript = event.results[i][0].transcript;
              if (event.results[i].isFinal) {
                finalChunk += transcript + ' ';
              } else {
                interimChunk += transcript;
              }
            }
            if (finalChunk) {
              setSpokenText(prev => (prev ? `${prev.trim()} ${finalChunk.trim()}` : finalChunk.trim()));
            }
            setInterimText(interimChunk);
          };

          rec.onerror = () => {
            setIsListening(false);
            setInterimText('');
            setMicStatusMsg("💡 Google Sites bloque le micro direct sur ce navigateur : cliquez dans le champ texte et utilisez le micro 🎤 de votre clavier de téléphone (ou Touche Windows + H sur PC) !");
            inputRef.current?.focus();
          };

          rec.onend = () => {
            setIsListening(false);
            setInterimText('');
          };

          rec.start();
        } catch (e) {
          setIsListening(false);
        }
      };

      const handleRemovePreviewItem = (id) => {
        setEditableItems(prev => prev.filter(item => item.id !== id));
      };

      const handleConfirmAllVoiceSessions = () => {
        if (editableItems.length === 0) return;
        if (isListening && recognitionRef.current) {
          try { recognitionRef.current.stop(); } catch (e) {}
          setIsListening(false);
        }

        const knownArenas = new Set(gameState.quests.map(q => normalizeArenaGroup(q.category, q.type)));
        const createdNames = [];
        const newArenas = [];
        editableItems.forEach(item => {
          const exists = gameState.quests.some(
            q =>
              q.id === item.questId ||
              stripAccents(q.name) === stripAccents(item.name) ||
              (item.catalogRef && q.catalogId === item.catalogRef.id)
          );
          if (exists) return;
          createdNames.push(item.name);
          const arena = normalizeArenaGroup(item.category, item.type);
          if (!knownArenas.has(arena)) {
            knownArenas.add(arena);
            newArenas.push(arena);
          }
        });

        let totalXpGain = 0;
        let totalKcalGain = 0;

        setGameState(prev => {
          let updatedQuests = [...prev.quests];

          editableItems.forEach(item => {
            totalKcalGain += item.calories;
            totalXpGain += 80 + Math.round(item.calories * 0.15);

            const newHistoryEntry = item.type === 'cardio'
              ? {
                  id: `h_voice_${Date.now()}_${Math.random()}`,
                  date: selectedDate,
                  value: item.unit === 'min' ? item.durationMin : item.distanceKm,
                  durationMin: item.durationMin,
                  elevationM: 0,
                  rpe: 7,
                  calories: item.calories,
                  goalBeaten: false,
                  note: `🎤 Dictée : ${item.summary}`
                }
              : {
                  id: `h_voice_${Date.now()}_${Math.random()}`,
                  date: selectedDate,
                  value: item.weightKg,
                  sets: item.setDetails.length,
                  reps: Math.max(...item.setDetails),
                  setDetails: item.setDetails,
                  assistanceKg: item.assistanceKg,
                  rpe: 7,
                  calories: item.calories,
                  goalBeaten: false,
                  note: `🎤 Dictée : ${item.summary}`
                };

            const existingIdx = updatedQuests.findIndex(
              q =>
                q.id === item.questId ||
                stripAccents(q.name) === stripAccents(item.name) ||
                (item.catalogRef && q.catalogId === item.catalogRef.id)
            );

            if (existingIdx !== -1) {
              const q = updatedQuests[existingIdx];
              updatedQuests[existingIdx] = {
                ...q,
                currentValue: item.type === 'cardio' ? Math.max(Number(q.currentValue) || 0, item.unit === 'min' ? item.durationMin : item.distanceKm) : item.weightKg,
                currentAssistanceKg: item.unit === 'reps' ? item.assistanceKg : 0,
                setDetails: item.type === 'strength' ? item.setDetails : q.setDetails,
                history: [...(q.history || []), newHistoryEntry]
              };
            } else {
              updatedQuests.unshift({
                id: `q_voice_${Date.now()}_${Math.random()}`,
                catalogId: item.catalogRef?.id || 'custom',
                name: item.name,
                category: item.category,
                type: item.type,
                unit: item.unit,
                goalMode: 'sets_reps',
                cardioMode: item.type === 'cardio' ? (item.catalogRef?.cardioMode || 'run') : undefined,
                durationMin: item.type === 'cardio' ? item.durationMin : undefined,
                elevationM: item.type === 'cardio' ? 0 : undefined,
                level: 1,
                icon: item.icon,
                startValue: item.type === 'cardio' ? (item.unit === 'min' ? item.durationMin : item.distanceKm) : item.weightKg,
                currentValue: item.type === 'cardio' ? (item.unit === 'min' ? item.durationMin : item.distanceKm) : item.weightKg,
                goalValue: item.catalogRef?.defaultGoal || (item.unit === 'kg' ? item.weightKg + 15 : 10),
                goalSets: item.catalogRef?.defaultGoalSets || item.setDetails?.length || 3,
                goalReps: item.catalogRef?.defaultGoalReps || item.setDetails?.[0] || 8,
                setDetails: item.setDetails || [8, 8, 8],
                startAssistanceKg: item.assistanceKg || 0,
                currentAssistanceKg: item.assistanceKg || 0,
                goalAssistanceKg: 0,
                history: [newHistoryEntry]
              });
            }
          });

          return {
            ...prev,
            xp: prev.xp + totalXpGain,
            quests: updatedQuests
          };
        });

        playGameSound('boss', gameState.soundEnabled);
        triggerToast(
          `🎤 ${editableItems.length} exercice(s) validé(s) d'un coup !`,
          `+${totalKcalGain} kcal ajoutées au bilan du ${selectedDate}` +
            (createdNames.length ? ` • ${createdNames.length} nouvel(s) objectif(s) ajouté(s)` : '') +
            (newArenas.length ? ` • Arène débloquée : ${newArenas.join(', ')}` : ''),
          totalXpGain,
          '🎤'
        );
        setSpokenText('');
        setInterimText('');
        setEditableItems([]);
        setMicStatusMsg('');
        setIsOpen(false);
      };

      return (
        <div className="bg-gradient-to-r from-pink-950/50 via-slate-900 to-indigo-950/50 border border-pink-500/40 rounded-2xl p-4 shadow-lg">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-3">
              <span className="text-2xl">🎤</span>
              <div>
                <h3 className="text-sm font-black text-white">
                  Micro Magique de Rondoudou (Résumé Vocal Multi-Exercices)
                </h3>
                <p className="text-xs text-slate-300">
                  Dictez toute votre séance en une seule phrase, même avec des fautes de retranscription (ex: <em>« tracon »</em>, <em>« ip trust »</em>, <em>« skouat »</em>).
                </p>
              </div>
            </div>
            <button
              type="button"
              onClick={() => {
                setIsOpen(!isOpen);
                setTimeout(() => inputRef.current?.focus(), 100);
              }}
              className="px-4 py-2 rounded-xl text-xs font-black bg-gradient-to-r from-pink-500 to-purple-600 text-white shadow-md hover:opacity-95 transition"
            >
              {isOpen ? 'Fermer la dictée' : '🎤 Dicter toute ma séance'}
            </button>
          </div>

          {isOpen && (
            <div className="mt-4 pt-4 border-t border-pink-500/20 space-y-3">
              <div className="flex flex-col sm:flex-row gap-2">
                <textarea
                  ref={inputRef}
                  rows={2}
                  value={combinedText}
                  onChange={e => {
                    setInterimText('');
                    setSpokenText(e.target.value);
                  }}
                  placeholder="Dictez toute votre séance ici (ex: J'ai fait du développer coucher 50 kg 3x8, des tracons élastique 10 kg 6 6 4, un ip trust 80 kg 4x10 et 4 km de course en 24 min)..."
                  className="flex-1 bg-slate-950 border border-pink-500/50 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-white font-semibold focus:outline-none focus:border-pink-400"
                />
                <div className="flex sm:flex-col gap-2 shrink-0">
                  <button
                    type="button"
                    onClick={toggleBrowserDictation}
                    className={`flex-1 px-4 py-2.5 rounded-xl text-xs font-black text-white transition ${
                      isListening ? 'bg-rose-600 animate-pulse' : 'bg-indigo-600 hover:bg-indigo-500'
                    }`}
                  >
                    {isListening ? '⏹️ Stop Micro' : '🎙️ Micro Direct'}
                  </button>
                  {combinedText && (
                    <button
                      type="button"
                      onClick={() => { setSpokenText(''); setInterimText(''); setEditableItems([]); }}
                      className="px-3 py-2 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300"
                    >
                      Effacer
                    </button>
                  )}
                </div>
              </div>

              {/* Bouton de test avec fautes de frappe volontaires + 4 exercices en une seule phrase */}
              <div className="flex flex-wrap items-center gap-1.5 text-[11px]">
                <span className="text-slate-400 font-bold">Tester une phrase complète avec fautes :</span>
                <button
                  type="button"
                  onClick={() =>
                    setSpokenText(
                      "Aujourd'hui j'ai fait du développer coucher à 50 kilos 3 séries de 8 des tracons avec élastique 10 kilos 6 6 et 4 répétitions un ip trust à 80 kilos 4 fois 10 et 4,5 km de footing en 26 minutes"
                    )
                  }
                  className="px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 border border-pink-500/40 text-pink-300 font-semibold"
                >
                  🪄 Tester : « développer coucher 50kg 3×8 + tracons élastique 10kg 6-6-4 + ip trust 80kg 4×10 + footing 4,5km »
                </button>
              </div>

              {micStatusMsg && (
                <div className="text-xs bg-slate-950/90 border border-amber-500/40 text-amber-200 px-3 py-2 rounded-xl">
                  {micStatusMsg}
                </div>
              )}

              {editableItems.length > 0 && (
                <div className="bg-slate-950/95 border border-emerald-500/40 rounded-xl p-3.5 space-y-3">
                  <p className="text-xs font-black uppercase tracking-wider text-emerald-300">
                    ✨ Synthèse de votre séance ({editableItems.length} exercice(s) détecté(s)) :
                  </p>
                  <div className="space-y-2">
                    {editableItems.map(item => (
                      <div
                        key={item.id}
                        className="flex flex-wrap items-center justify-between gap-2 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs"
                      >
                        <div className="flex items-center gap-2">
                          <span className="text-base">{item.icon}</span>
                          <strong className="text-white">{item.name}</strong>
                          <span className="px-2 py-0.5 rounded bg-slate-800 text-[10px] text-slate-300 font-bold">
                            {item.category}
                          </span>
                          <span className="text-pink-300 font-bold">{item.summary}</span>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="px-2 py-0.5 rounded bg-orange-500/20 text-orange-300 font-bold">
                            🔥 ~{item.calories} kcal
                          </span>
                          <button
                            type="button"
                            onClick={() => handleRemovePreviewItem(item.id)}
                            title="Retirer cet exercice de la liste"
                            className="text-slate-400 hover:text-rose-400 px-1.5 font-bold"
                          >
                            ✕
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                  <button
                    type="button"
                    onClick={handleConfirmAllVoiceSessions}
                    className="w-full py-2.5 rounded-xl text-xs sm:text-sm font-black bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 shadow-lg transition"
                  >
                    ✅ Valider toute la séance en 1 clic ({editableItems.length} exercice(s))
                  </button>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [gameState, setGameState] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && Array.isArray(parsed.quests)) {
              return {
                ...INITIAL_STATE,
                ...parsed,
                weightHistory: Array.isArray(parsed.weightHistory)
                  ? parsed.weightHistory
                  : INITIAL_STATE.weightHistory
              };
            }
          }
        } catch (e) {}
        return INITIAL_STATE;
      });

      const [cloudStatus, setCloudStatus] = useState('loading');
      const isLoaded = useRef(false);

      // 1. Chargement automatique au démarrage depuis Google Sheets (et LocalStorage en secours)
      useEffect(() => {
        setCloudStatus('loading');
        fetch(SCRIPT_URL + "?t=" + Date.now(), { redirect: "follow" })
          .then(r => r.json())
          .then(res => {
            if (res && res.data && Array.isArray(res.data.quests)) {
              const merged = {
                ...INITIAL_STATE,
                ...res.data,
                weightHistory: Array.isArray(res.data.weightHistory)
                  ? res.data.weightHistory
                  : INITIAL_STATE.weightHistory
              };
              setGameState(merged);
              try { localStorage.setItem(STORAGE_KEY, JSON.stringify(merged)); } catch (e) {}
              setCloudStatus('synced');
            } else {
              fetch(SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(gameState),
                redirect: "follow"
              })
                .then(() => setCloudStatus('synced'))
                .catch(() => setCloudStatus('error'));
            }
          })
          .catch(() => {
            setCloudStatus('error');
          })
          .finally(() => {
            isLoaded.current = true;
          });
      }, []);

      // 2. Sauvegarde automatique à chaque modification (LocalStorage + Google Sheets)
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
        } catch (e) {}

        if (!isLoaded.current) return;
        setCloudStatus('saving');
        const timer = setTimeout(() => {
          fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(gameState),
            redirect: "follow"
          })
            .then(() => setCloudStatus('synced'))
            .catch(() => setCloudStatus('error'));
        }, 500);

        return () => clearTimeout(timer);
      }, [gameState]);

      // Navigation et filtres
      const [activeTab, setActiveTab] = useState('quests');
      const [questFilter, setQuestFilter] = useState('all');
      const [selectedDate, setSelectedDate] = useState(getTodayISODate());
      const [selectedJournalDay, setSelectedJournalDay] = useState(getTodayISODate());
      const [selectedChartQuestId, setSelectedChartQuestId] = useState(
        () => gameState.quests[0]?.id || ''
      );

      // Toast RPG Pokémon
      const [toast, setToast] = useState(null);
      const toastQueueRef = useRef([]);
      const triggerToast = (title, subtitle, xpGain = 0, badge = '🎵') => {
        const t = { title, subtitle, xpGain, badge, id: Date.now() + Math.random() };
        setToast(cur => {
          if (cur) { toastQueueRef.current.push(t); return cur; }
          return t;
        });
      };
      const dismissToast = () => setToast(toastQueueRef.current.shift() || null);
      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(dismissToast, 4500);
        return () => clearTimeout(t);
      }, [toast]);

      // Déblocage automatique des trophées + versement du bonus EXP
      const paidAchievementsRef = useRef(null);
      useEffect(() => {
        if (!isLoaded.current) return;
        const unlocked = gameState.unlockedAchievements || [];
        if (paidAchievementsRef.current === null) {
          paidAchievementsRef.current = new Set(unlocked);
        }
        const paid = paidAchievementsRef.current;
        const all = new Set([...unlocked, ...computeDerivedAchievements(gameState)]);
        Array.from(paid).forEach(id => { if (!all.has(id)) paid.delete(id); });

        const fresh = ACHIEVEMENTS_LIST.filter(a => all.has(a.id) && !paid.has(a.id));
        if (fresh.length === 0) return;

        fresh.forEach(a => paid.add(a.id));
        const bonus = fresh.reduce((sum, a) => sum + a.xpBonus, 0);

        setGameState(prev => ({
          ...prev,
          xp: prev.xp + bonus,
          unlockedAchievements: Array.from(
            new Set([...(prev.unlockedAchievements || []), ...fresh.map(a => a.id)])
          )
        }));

        {
          playGameSound('boss', gameState.soundEnabled);
          triggerToast(
            fresh.length === 1 ? `🏆 Trophée : ${fresh[0].title}` : `🏆 ${fresh.length} trophées débloqués !`,
            fresh.length === 1 ? fresh[0].desc : fresh.map(a => a.title).join(' • '),
            bonus,
            fresh[0].icon
          );
        }
      }, [gameState, cloudStatus]);

      // Annuler après suppression
      const skipPRRef = useRef(false);
      const [undoInfo, setUndoInfo] = useState(null);
      const registerUndo = label => setUndoInfo({ label, snapshot: gameState, id: Date.now() });
      useEffect(() => {
        if (!undoInfo) return;
        const t = setTimeout(() => setUndoInfo(null), 8000);
        return () => clearTimeout(t);
      }, [undoInfo]);
      const handleUndo = () => {
        if (!undoInfo) return;
        skipPRRef.current = true;
        setGameState(undoInfo.snapshot);
        setUndoInfo(null);
        triggerToast('Suppression annulée', 'Les données ont été restaurées.', 0, '↩️');
      };

      // Détection des nouveaux records personnels
      const prRef = useRef(null);
      useEffect(() => {
        if (!isLoaded.current) return;
        const flat = {};
        computePersonalRecords(gameState).forEach(g =>
          g.recs.forEach(r => { flat[r.key] = { ...r, name: g.name }; })
        );
        const prev = prRef.current;
        prRef.current = flat;
        if (prev === null) return;
        if (skipPRRef.current) { skipPRRef.current = false; return; }
        const broken = Object.keys(flat).filter(k => prev[k] !== undefined && flat[k].score > prev[k].score);
        if (broken.length === 0) return;
        const r = flat[broken[0]];
        playGameSound('boss', gameState.soundEnabled);
        triggerToast(
          `Nouveau record : ${r.name}`,
          `${r.label} : ${r.text}${broken.length > 1 ? ` (+${broken.length - 1} autre(s) record(s))` : ''}`,

      const weekData = useMemo(() => {
