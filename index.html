    // Supprime les accents et normalise pour comparer facilement les mots mal retranscrits
    function stripAccents(str = '') {
      return str
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase();
    }

    // Distance de Levenshtein pour tolérer les fautes de frappe ou d'écoute ("tracon" vs "traction" = 1)
    function levenshteinDistance(a = '', b = '') {
      const m = a.length;
      const n = b.length;
      if (m === 0) return n;
      if (n === 0) return m;
      const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + cost
          );
        }
      }
      return dp[m][n];
    }

    // Convertit les nombres écrits en toutes lettres par la dictée vocale
    function normalizeSpokenNumbers(text = '') {
      return text
        .replace(/,/g, '.')
        .replace(/\b(une|un)\b/gi, '1')
        .replace(/\bdeux\b/gi, '2')
        .replace(/\btrois\b/gi, '3')
        .replace(/\bquatre\b/gi, '4')
        .replace(/\bcinq\b/gi, '5')
        .replace(/\bsix\b/gi, '6')
        .replace(/\bsept\b/gi, '7')
        .replace(/\bhuit\b/gi, '8')
        .replace(/\bneuf\b/gi, '9')
        .replace(/\bdix\b/gi, '10')
        .replace(/\bonze\b/gi, '11')
        .replace(/\bdouze\b/gi, '12')
        .replace(/\btreize\b/gi, '13')
        .replace(/\bquatorze\b/gi, '14')
        .replace(/\bquinze\b/gi, '15')
        .replace(/\bseize\b/gi, '16')
        .replace(/\bvingt\b/gi, '20')
        .replace(/\btrente\b/gi, '30')
        .replace(/\bquarante\b/gi, '40')
        .replace(/\bcinquante\b/gi, '50')
        .replace(/\bsoixante\b/gi, '60')
        .replace(/\bquatre-vingts?\b/gi, '80')
        .replace(/\bcent\b/gi, '100');
    }

    // Repère TOUS les exercices présents dans une même phrase et découpe automatiquement
    function parseSpokenWorkout(rawText, existingQuests = [], userWeightKg = 82) {
      if (!rawText || !rawText.trim()) return [];

      const textWithDigits = normalizeSpokenNumbers(rawText);
      const normText = stripAccents(textWithDigits);

      // Construction de la liste complète de cibles (Quêtes perso + Dictionnaire vocal)
      const candidates = [];

      existingQuests.forEach(q => {
        const cleanQName = stripAccents(q.name);
        candidates.push({
          phrase: cleanQName,
          quest: q,
          catalog: VOICE_DICTIONARY.find(d => d.id === q.catalogId) || null
        });
      });

      VOICE_DICTIONARY.forEach(dictItem => {
        const linkedQuest = existingQuests.find(
          q => q.catalogId === dictItem.id || stripAccents(q.name) === stripAccents(dictItem.name)
        );
        dictItem.aliases.forEach(alias => {
          candidates.push({
            phrase: stripAccents(alias),
            quest: linkedQuest || null,
            catalog: dictItem
          });
        });
      });

      // Tri par longueur décroissante pour privilégier "tractions supination" avant "tractions"
      candidates.sort((a, b) => b.phrase.length - a.phrase.length);

      // Découpage en mots avec leur position exacte dans la phrase
      const wordTokens = [];
      const wordRegex = /[a-z0-9]+/g;
      let match;
      while ((match = wordRegex.exec(normText)) !== null) {
        wordTokens.push({
          word: match[0],
          start: match.index,
          end: match.index + match[0].length
        });
      }

      const anchors = [];
      const usedTokenIndices = new Set();

      // Analyse glissante sur 1, 2 et 3 mots avec tolérance aux fautes (Levenshtein)
      for (let i = 0; i < wordTokens.length; i++) {
        if (usedTokenIndices.has(i)) continue;
        // Ignore les petits mots de liaison ou chiffres purs comme point de départ
        if (/^\d+$/.test(wordTokens[i].word) || wordTokens[i].word.length <= 2) continue;

        let bestMatch = null;

        for (let len = 3; len >= 1; len--) {
          if (i + len > wordTokens.length) continue;
          const sliceTokens = wordTokens.slice(i, i + len);
          const spokenPhrase = sliceTokens.map(t => t.word).join(' ');

          for (const cand of candidates) {
            const target = cand.phrase;
            const targetWordsCount = target.split(' ').length;
            if (Math.abs(targetWordsCount - len) > 1) continue;

            const dist = levenshteinDistance(spokenPhrase, target);
            const maxAllowedDist = target.length >= 10 ? 3 : target.length >= 5 ? 2 : 0;

            if (dist <= maxAllowedDist) {
              if (!bestMatch || dist < bestMatch.dist || (dist === bestMatch.dist && target.length > bestMatch.targetLen)) {
                bestMatch = {
                  cand,
                  dist,
                  targetLen: target.length,
                  startChar: sliceTokens[0].start,
                  tokenStart: i,
                  tokenEnd: i + len - 1
                };
              }
            }
          }
          if (bestMatch && bestMatch.dist === 0) break;
        }

        if (bestMatch) {
          for (let k = bestMatch.tokenStart; k <= bestMatch.tokenEnd; k++) {
            usedTokenIndices.add(k);
          }
          anchors.push({
            startChar: bestMatch.startChar,
            quest: bestMatch.cand.quest,
            catalog: bestMatch.cand.catalog
          });
        }
      }

      if (anchors.length === 0) return [];

      // Si deux ancres consécutives désignent exactement le même exercice sans chiffre entre elles, on les fusionne
      const cleanedAnchors = [];
      anchors.forEach(a => {
        const prev = cleanedAnchors[cleanedAnchors.length - 1];
        const sameId =
          prev &&
          ((a.quest && prev.quest && a.quest.id === prev.quest.id) ||
            (a.catalog && prev.catalog && a.catalog.id === prev.catalog.id));
        const betweenText = prev ? normText.slice(prev.startChar, a.startChar) : '';
        if (sameId && !/\d/.test(betweenText)) {
          return;
        }
        cleanedAnchors.push(a);
      });

      // Extraction des paramètres (kg, élastique, séries, reps, km) pour chaque segment d'exercice
      return cleanedAnchors.map((anchor, idx) => {
        const segStart = idx === 0 ? 0 : Math.floor((cleanedAnchors[idx - 1].startChar + anchor.startChar) / 2);
        const segEnd = idx + 1 < cleanedAnchors.length ? cleanedAnchors[idx + 1].startChar : normText.length;
        const seg = normText.slice(segStart, segEnd);

        const ref = anchor.quest || anchor.catalog;
        const isCardio = ref.type === 'cardio';

        if (isCardio) {
          const isTimeOnly = ref.unit === 'min';
          const kmMatch = seg.match(/(\d+(?:\.\d+)?)\s*(?:km|kilom[eè]tre|kilom[eè]tres|borne|bornes)/i);
          const minMatch = seg.match(/(\d+(?:\.\d+)?)\s*(?:min|minute|minutes)/i);
          const hourMatch = seg.match(/(\d+(?:\.\d+)?)\s*(?:heure|heures|h\b)/i);
          
          let parsedMin = 0;
          if (hourMatch) parsedMin += Number(hourMatch[1]) * 60;
          if (minMatch) parsedMin += Number(minMatch[1]);
          
          const dist = kmMatch ? Number(kmMatch[1]) : (isTimeOnly ? 0 : (Number(anchor.quest?.currentValue) || 5));
          const dur = parsedMin > 0 ? parsedMin : (isTimeOnly ? (Number(anchor.quest?.currentValue) || 60) : Math.round(dist * 6));
          
          const kcal = calculateCardioCalories({
            cardioMode: ref.cardioMode || 'run',
            distanceKm: dist,
            durationMin: dur,
            elevationM: 20,
            rpe: 7,
            userWeightKg
          });
          return {
            id: `vp_${idx}_${Date.now()}`,
            questId: anchor.quest?.id || null,
            catalogRef: anchor.catalog,
            name: ref.name,
            category: ref.category || 'Course & Cardio',
            type: 'cardio',
            unit: ref.unit || 'km',
            icon: ref.icon || '🏃',
            distanceKm: dist,
            durationMin: dur,
            calories: kcal,
            summary: isTimeOnly ? `${dur} min` : `${dist} km en ${dur} min`
          };
        }

        // 1. Aide élastique éventuelle (ex: "élastique 10 kg", "aide de 15 kilos", "assisté à 10 kg")
        const assistMatch = seg.match(/(?:elastique|elas|aide|assiste|delestage)\s*(?:de|a)?\s*(\d+(?:\.\d+)?)\s*(?:kg|kilo|kilos)?/);
        const assistanceKg = assistMatch ? Number(assistMatch[1]) : 0;

        // 2. Charge en kg (hors élastique)
        let segWithoutAssist = assistMatch ? seg.replace(assistMatch[0], ' ') : seg;
        const kgMatch = segWithoutAssist.match(/(\d+(?:\.\d+)?)\s*(?:kg|kilo|kilos)/);
        const weightKg = kgMatch ? Number(kgMatch[1]) : (Number(anchor.quest?.currentValue) || 40);
        if (kgMatch) {
          segWithoutAssist = segWithoutAssist.replace(kgMatch[0], ' ');
        }

        // 3. Extraction intelligente des séries et répétitions
        let setDetails = [];
        // Format uniforme : "3 séries de 10", "3 x 10", "3 fois 10", "4 par 8"
        const uniformMatch = segWithoutAssist.match(/(\d+)\s*(?:series?\s*(?:de|a)|fois|x|×|par)\s*(\d+)/);
        // Format inversé : "10 répétitions sur 3 séries"
        const reverseUniformMatch = segWithoutAssist.match(/(\d+)\s*(?:repetitions?|reps?)\s*(?:sur|en|x)\s*(\d+)\s*series?/);

        if (uniformMatch) {
          const sCount = Math.min(12, Math.max(1, Number(uniformMatch[1])));
          const rCount = Math.max(1, Number(uniformMatch[2]));
          setDetails = Array(sCount).fill(rCount);
        } else if (reverseUniformMatch) {
          const rCount = Math.max(1, Number(reverseUniformMatch[1]));
          const sCount = Math.min(12, Math.max(1, Number(reverseUniformMatch[2])));
          setDetails = Array(sCount).fill(rCount);
        } else {
          // Format détaillé : "6, 6 et 4 reps" ou "3 séries : 8 8 6"
          const cleanedForReps = segWithoutAssist.replace(/(\d+)\s*series?(?!\s*(?:de|a|\d))/g, ' ');
          const allNums = (cleanedForReps.match(/\d+/g) || [])
            .map(Number)
            .filter(n => n > 0 && n <= 100);

          if (allNums.length >= 2) {
            setDetails = allNums.slice(0, 8);
          } else if (allNums.length === 1) {
            const defSets = Number(anchor.quest?.goalSets || anchor.catalog?.defaultGoalSets || 3);
            setDetails = Array(defSets).fill(allNums[0]);
          } else {
            const defSets = Number(anchor.quest?.goalSets || anchor.catalog?.defaultGoalSets || 3);
            const defReps = Number(anchor.quest?.goalReps || anchor.catalog?.defaultGoalReps || 8);
            setDetails = Array(defSets).fill(defReps);
          }
        }

        const unit = anchor.quest?.unit || ref.unit || (kgMatch ? 'kg' : 'reps');
        const kcal = calculateStrengthCalories({
          unit,
          weightKg: unit === 'kg' ? weightKg : 0,
          assistanceKg: unit === 'reps' ? assistanceKg : 0,
          setDetails,
          rpe: 7,
          userWeightKg
        });

        return {
          id: `vp_${idx}_${Date.now()}`,
          questId: anchor.quest?.id || null,
          catalogRef: anchor.catalog,
          name: ref.name,
          category: ref.category || 'Pectoraux',
          type: 'strength',
          unit,
          icon: ref.icon || '🏋️',
          weightKg: unit === 'kg' ? weightKg : Math.max(...setDetails),
          assistanceKg: unit === 'reps' ? assistanceKg : 0,
          setDetails,
          calories: kcal,
          summary: `${unit === 'kg' ? `${weightKg} kg • ` : ''}[${setDetails.join(' - ')} reps]${
            unit === 'reps' && assistanceKg > 0 ? ` (Aide -${assistanceKg} kg)` : ''
          }`
        };
      });
    }

    function VoiceWorkoutAssistant({ gameState, setGameState, selectedDate, triggerToast, playGameSound }) {
      const [isOpen, setIsOpen] = useState(false);
      const [spokenText, setSpokenText] = useState('');
      const [interimText, setInterimText] = useState('');
      const [isListening, setIsListening] = useState(false);
      const [micStatusMsg, setMicStatusMsg] = useState('');
      const [editableItems, setEditableItems] = useState([]);
      const recognitionRef = useRef(null);
      const inputRef = useRef(null);

      const combinedText = (spokenText + (interimText ? ' ' + interimText : '')).trim();

      // Met à jour la liste des exercices détectés dès que le texte dicté évolue
      useEffect(() => {
        const parsed = parseSpokenWorkout(combinedText, gameState.quests, gameState.userWeightKg);
        setEditableItems(parsed);
      }, [combinedText, gameState.quests, gameState.userWeightKg]);

      const toggleBrowserDictation = () => {
        if (isListening && recognitionRef.current) {
          try { recognitionRef.current.stop(); } catch (e) {}
          setIsListening(false);
          setInterimText('');
          setMicStatusMsg('Écoute terminée. Vérifiez l’aperçu ci-dessous puis validez en 1 clic !');
          return;
        }

        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          setMicStatusMsg("💡 Astuce : Cliquez dans la zone de texte et utilisez le bouton Micro 🎤 de votre clavier (ou Windows + H sur PC) !");
          inputRef.current?.focus();
          return;
        }

        try {
          if (recognitionRef.current) {
            try { recognitionRef.current.abort(); } catch (e) {}
          }

          const rec = new SpeechRec();
          recognitionRef.current = rec;
          rec.lang = 'fr-FR';
          rec.continuous = true;
          rec.interimResults = true;

          rec.onstart = () => {
            setIsListening(true);
            setMicStatusMsg('🟢 Micro actif : dictez toute votre séance d’une traite (plusieurs exercices)...');
          };

          rec.onresult = (event) => {
            let finalChunk = '';
            let interimChunk = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
              const transcript = event.results[i][0].transcript;
              if (event.results[i].isFinal) {
                finalChunk += transcript + ' ';
              } else {
                interimChunk += transcript;
              }
            }
            if (finalChunk) {
              setSpokenText(prev => (prev ? `${prev.trim()} ${finalChunk.trim()}` : finalChunk.trim()));
            }
            setInterimText(interimChunk);
          };

          rec.onerror = () => {
            setIsListening(false);
            setInterimText('');
            setMicStatusMsg("💡 Google Sites bloque le micro direct sur ce navigateur : cliquez dans le champ texte et utilisez le micro 🎤 de votre clavier de téléphone (ou Touche Windows + H sur PC) !");
            inputRef.current?.focus();
          };

          rec.onend = () => {
            setIsListening(false);
            setInterimText('');
          };

          rec.start();
        } catch (e) {
          setIsListening(false);
        }
      };

      const handleRemovePreviewItem = (id) => {
        setEditableItems(prev => prev.filter(item => item.id !== id));
      };

      const handleConfirmAllVoiceSessions = () => {
        if (editableItems.length === 0) return;
        if (isListening && recognitionRef.current) {
          try { recognitionRef.current.stop(); } catch (e) {}
          setIsListening(false);
        }

        let totalXpGain = 0;
        let totalKcalGain = 0;

        setGameState(prev => {
          let updatedQuests = [...prev.quests];

          editableItems.forEach(item => {
            totalKcalGain += item.calories;
            totalXpGain += 80 + Math.round(item.calories * 0.15);

            const newHistoryEntry = item.type === 'cardio'
              ? {
                  id: `h_voice_${Date.now()}_${Math.random()}`,
                  date: selectedDate,
                  value: item.unit === 'min' ? item.durationMin : item.distanceKm,
                  durationMin: item.durationMin,
                  elevationM: 20,
                  rpe: 7,
                  calories: item.calories,
                  goalBeaten: false,
                  note: `🎤 Dictée : ${item.summary}`
                }
              : {
                  id: `h_voice_${Date.now()}_${Math.random()}`,
                  date: selectedDate,
                  value: item.weightKg,
                  sets: item.setDetails.length,
                  reps: Math.max(...item.setDetails),
                  setDetails: item.setDetails,
                  assistanceKg: item.assistanceKg,
                  rpe: 7,
                  calories: item.calories,
                  goalBeaten: false,
                  note: `🎤 Dictée : ${item.summary}`
                };

            const existingIdx = updatedQuests.findIndex(
              q => q.id === item.questId || stripAccents(q.name) === stripAccents(item.name)
            );

            if (existingIdx !== -1) {
              const q = updatedQuests[existingIdx];
              updatedQuests[existingIdx] = {
                ...q,
                currentValue: item.type === 'cardio' ? Math.max(Number(q.currentValue) || 0, item.unit === 'min' ? item.durationMin : item.distanceKm) : item.weightKg,
                currentAssistanceKg: item.unit === 'reps' ? item.assistanceKg : 0,
                setDetails: item.type === 'strength' ? item.setDetails : q.setDetails,
                history: [...(q.history || []), newHistoryEntry]
              };
            } else {
              updatedQuests.unshift({
                id: `q_voice_${Date.now()}_${Math.random()}`,
                catalogId: item.catalogRef?.id || 'custom',
                name: item.name,
                category: item.category,
                type: item.type,
                unit: item.unit,
                goalMode: 'sets_reps',
                level: 1,
                icon: item.icon,
                startValue: item.type === 'cardio' ? (item.unit === 'min' ? item.durationMin : item.distanceKm) : item.weightKg,
                currentValue: item.type === 'cardio' ? (item.unit === 'min' ? item.durationMin : item.distanceKm) : item.weightKg,
                goalValue: item.catalogRef?.defaultGoal || (item.unit === 'kg' ? item.weightKg + 15 : 10),
                goalSets: item.setDetails?.length || 3,
                goalReps: item.setDetails?.[0] || 8,
                setDetails: item.setDetails || [8, 8, 8],
                startAssistanceKg: item.assistanceKg || 0,
                currentAssistanceKg: item.assistanceKg || 0,
                goalAssistanceKg: 0,
                history: [newHistoryEntry]
              });
            }
          });

          return {
            ...prev,
            xp: prev.xp + totalXpGain,
            quests: updatedQuests
          };
        });

        playGameSound('boss', gameState.soundEnabled);
        triggerToast(
          `🎤 ${editableItems.length} exercice(s) validé(s) d'un coup !`,
          `+${totalKcalGain} kcal ajoutées au bilan du ${selectedDate}`,
          totalXpGain,
          '🎤'
        );
        setSpokenText('');
        setInterimText('');
        setEditableItems([]);
        setMicStatusMsg('');
        setIsOpen(false);
      };

      return (
        <div className="bg-gradient-to-r from-pink-950/50 via-slate-900 to-indigo-950/50 border border-pink-500/40 rounded-2xl p-4 shadow-lg">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-3">
              <span className="text-2xl">🎤</span>
              <div>
                <h3 className="text-sm font-black text-white">
                  Micro Magique de Rondoudou (Résumé Vocal Multi-Exercices)
                </h3>
                <p className="text-xs text-slate-300">
                  Dictez toute votre séance en une seule phrase, même avec des fautes de retranscription (ex: <em>« tracon »</em>, <em>« ip trust »</em>, <em>« skouat »</em>).
                </p>
              </div>
            </div>
            <button
              type="button"
              onClick={() => {
                setIsOpen(!isOpen);
                setTimeout(() => inputRef.current?.focus(), 100);
              }}
              className="px-4 py-2 rounded-xl text-xs font-black bg-gradient-to-r from-pink-500 to-purple-600 text-white shadow-md hover:opacity-95 transition"
            >
              {isOpen ? 'Fermer la dictée' : '🎤 Dicter toute ma séance'}
            </button>
          </div>

          {isOpen && (
            <div className="mt-4 pt-4 border-t border-pink-500/20 space-y-3">
              <div className="flex flex-col sm:flex-row gap-2">
                <textarea
                  ref={inputRef}
                  rows={2}
                  value={combinedText}
                  onChange={e => {
                    setInterimText('');
                    setSpokenText(e.target.value);
                  }}
                  placeholder="Dictez toute votre séance ici (ex: J'ai fait du développer coucher 50 kg 3x8, des tracons élastique 10 kg 6 6 4, un ip trust 80 kg 4x10 et 4 km de course en 24 min)..."
                  className="flex-1 bg-slate-950 border border-pink-500/50 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-white font-semibold focus:outline-none focus:border-pink-400"
                />
                <div className="flex sm:flex-col gap-2 shrink-0">
                  <button
                    type="button"
                    onClick={toggleBrowserDictation}
                    className={`flex-1 px-4 py-2.5 rounded-xl text-xs font-black text-white transition ${
                      isListening ? 'bg-rose-600 animate-pulse' : 'bg-indigo-600 hover:bg-indigo-500'
                    }`}
                  >
                    {isListening ? '⏹️ Stop Micro' : '🎙️ Micro Direct'}
                  </button>
                  {combinedText && (
                    <button
                      type="button"
                      onClick={() => { setSpokenText(''); setInterimText(''); setEditableItems([]); }}
                      className="px-3 py-2 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300"
                    >
                      Effacer
                    </button>
                  )}
                </div>
              </div>

              {/* Bouton de test avec fautes de frappe volontaires + 4 exercices en une seule phrase */}
              <div className="flex flex-wrap items-center gap-1.5 text-[11px]">
                <span className="text-slate-400 font-bold">Tester une phrase complète avec fautes :</span>
                <button
                  type="button"
                  onClick={() =>
                    setSpokenText(
                      "Aujourd'hui j'ai fait du développer coucher à 50 kilos 3 séries de 8 des tracons avec élastique 10 kilos 6 6 et 4 répétitions un ip trust à 80 kilos 4 fois 10 et 4,5 km de footing en 26 minutes"
                    )
                  }
                  className="px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 border border-pink-500/40 text-pink-300 font-semibold"
                >
                  🪄 Tester : « développer coucher 50kg 3×8 + tracons élastique 10kg 6-6-4 + ip trust 80kg 4×10 + footing 4,5km »
                </button>
              </div>

              {micStatusMsg && (
                <div className="text-xs bg-slate-950/90 border border-amber-500/40 text-amber-200 px-3 py-2 rounded-xl">
                  {micStatusMsg}
                </div>
              )}

              {editableItems.length > 0 && (
                <div className="bg-slate-950/95 border border-emerald-500/40 rounded-xl p-3.5 space-y-3">
                  <p className="text-xs font-black uppercase tracking-wider text-emerald-300">
                    ✨ Synthèse de votre séance ({editableItems.length} exercice(s) détecté(s)) :
                  </p>
                  <div className="space-y-2">
                    {editableItems.map(item => (
                      <div
                        key={item.id}
                        className="flex flex-wrap items-center justify-between gap-2 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs"
                      >
                        <div className="flex items-center gap-2">
                          <span className="text-base">{item.icon}</span>
                          <strong className="text-white">{item.name}</strong>
                          <span className="px-2 py-0.5 rounded bg-slate-800 text-[10px] text-slate-300 font-bold">
                            {item.category}
                          </span>
                          <span className="text-pink-300 font-bold">{item.summary}</span>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="px-2 py-0.5 rounded bg-orange-500/20 text-orange-300 font-bold">
                            🔥 ~{item.calories} kcal
                          </span>
                          <button
                            type="button"
                            onClick={() => handleRemovePreviewItem(item.id)}
                            title="Retirer cet exercice de la liste"
                            className="text-slate-400 hover:text-rose-400 px-1.5 font-bold"
                          >
                            ✕
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                  <button
                    type="button"
                    onClick={handleConfirmAllVoiceSessions}
                    className="w-full py-2.5 rounded-xl text-xs sm:text-sm font-black bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 shadow-lg transition"
                  >
                    ✅ Valider toute la séance en 1 clic ({editableItems.length} exercice(s))
                  </button>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [gameState, setGameState] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && Array.isArray(parsed.quests)) {
              return {
                ...INITIAL_STATE,
                ...parsed,
                weightHistory: Array.isArray(parsed.weightHistory)
                  ? parsed.weightHistory
                  : INITIAL_STATE.weightHistory
              };
            }
          }
        } catch (e) {}
        return INITIAL_STATE;
      });

      const [cloudStatus, setCloudStatus] = useState('loading');
      const isLoaded = useRef(false);

      // 1. Chargement automatique au démarrage depuis Google Sheets (et LocalStorage en secours)
      useEffect(() => {
        setCloudStatus('loading');
        fetch(SCRIPT_URL + "?t=" + Date.now(), { redirect: "follow" })
          .then(r => r.json())
          .then(res => {
            if (res && res.data && Array.isArray(res.data.quests)) {
              const merged = {
                ...INITIAL_STATE,
                ...res.data,
                weightHistory: Array.isArray(res.data.weightHistory)
                  ? res.data.weightHistory
                  : INITIAL_STATE.weightHistory
              };
              setGameState(merged);
              try { localStorage.setItem(STORAGE_KEY, JSON.stringify(merged)); } catch (e) {}
              setCloudStatus('synced');
            } else {
              fetch(SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(gameState),
                redirect: "follow"
              })
                .then(() => setCloudStatus('synced'))
                .catch(() => setCloudStatus('error'));
            }
          })
          .catch(() => {
            setCloudStatus('error');
          })
          .finally(() => {
            isLoaded.current = true;
          });
      }, []);

      // 2. Sauvegarde automatique à chaque modification (LocalStorage + Google Sheets)
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
        } catch (e) {}

        if (!isLoaded.current) return;
        setCloudStatus('saving');
        const timer = setTimeout(() => {
          fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(gameState),
            redirect: "follow"
          })
            .then(() => setCloudStatus('synced'))
            .catch(() => setCloudStatus('error'));
        }, 500);

        return () => clearTimeout(timer);
      }, [gameState]);

      // Navigation et filtres
      const [activeTab, setActiveTab] = useState('quests');
      const [questFilter, setQuestFilter] = useState('all');
      const [selectedDate, setSelectedDate] = useState(getTodayISODate());
      const [selectedJournalDay, setSelectedJournalDay] = useState(getTodayISODate());
      const [selectedChartQuestId, setSelectedChartQuestId] = useState(
        () => gameState.quests[0]?.id || ''
      );

      // Toast RPG Pokémon
      const [toast, setToast] = useState(null);
      const triggerToast = (title, subtitle, xpGain = 0, badge = '🎵') => {
        setToast({ title, subtitle, xpGain, badge, id: Date.now() });
      };
      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 5000);
        return () => clearTimeout(t);
      }, [toast]);

      // Déblocage automatique des trophées + versement du bonus EXP
      const paidAchievementsRef = useRef(null);
      useEffect(() => {
        if (!isLoaded.current) return;
        const unlocked = gameState.unlockedAchievements || [];
        if (paidAchievementsRef.current === null) {
          paidAchievementsRef.current = new Set(unlocked);
        }
        const paid = paidAchievementsRef.current;
        const all = new Set([...unlocked, ...computeDerivedAchievements(gameState)]);
        Array.from(paid).forEach(id => { if (!all.has(id)) paid.delete(id); });

        const fresh = ACHIEVEMENTS_LIST.filter(a => all.has(a.id) && !paid.has(a.id));
        if (fresh.length === 0) return;

        fresh.forEach(a => paid.add(a.id));
        const bonus = fresh.reduce((sum, a) => sum + a.xpBonus, 0);

        setGameState(prev => ({
          ...prev,
          xp: prev.xp + bonus,
          unlockedAchievements: Array.from(
            new Set([...(prev.unlockedAchievements || []), ...fresh.map(a => a.id)])
          )
        }));

        setTimeout(() => {
          playGameSound('boss', gameState.soundEnabled);
          triggerToast(
            fresh.length === 1 ? `🏆 Trophée : ${fresh[0].title}` : `🏆 ${fresh.length} trophées débloqués !`,
            fresh.length === 1 ? fresh[0].desc : fresh.map(a => a.title).join(' • '),
            bonus,
            fresh[0].icon
          );
        }, 3500);
      }, [gameState, cloudStatus]);

      // Modale "Noter Séance"
      const [logModalQuest, setLogModalQuest] = useState(null);
      const [logDate, setLogDate] = useState(getTodayISODate());
      const [logValue, setLogValue] = useState(0);
      const [logUseAssistance, setLogUseAssistance] = useState(false);
      const [logAssistanceKg, setLogAssistanceKg] = useState(0);
      const [logEntryMode, setLogEntryMode] = useState('per_set');
      const [logUniformSets, setLogUniformSets] = useState(3);
      const [logUniformReps, setLogUniformReps] = useState(6);
      const [logSetDetails, setLogSetDetails] = useState([6, 6, 6]);
      const [logDurationMin, setLogDurationMin] = useState(25);
      const [logElevationM, setLogElevationM] = useState(30);
      const [logRpe, setLogRpe] = useState(7);
      const [logNote, setLogNote] = useState('');

      // Modale "Objectif Validé & Passage au Niveau Supérieur"
      const [levelUpModalQuest, setLevelUpModalQuest] = useState(null);
      const [nextGoalMode, setNextGoalMode] = useState('sets_reps');
      const [nextGoalValue, setNextGoalValue] = useState(60);
      const [nextGoalSets, setNextGoalSets] = useState(3);
      const [nextGoalReps, setNextGoalReps] = useState(8);
      const [nextGoalAssistanceKg, setNextGoalAssistanceKg] = useState(0);

      // Modale "Ajouter / Ajuster un Objectif"
      const [questModalOpen, setQuestModalOpen] = useState(false);
      const [editingQuestId, setEditingQuestId] = useState(null);
      const [formCatalogId, setFormCatalogId] = useState('pullups');
      const [formCustomName, setFormCustomName] = useState('');
      const [formCategory, setFormCategory] = useState('Dos');
      const [formType, setFormType] = useState('strength');
      const [formUnit, setFormUnit] = useState('reps');
      const [formGoalMode, setFormGoalMode] = useState('sets_reps');
      const [formCardioMode, setFormCardioMode] = useState('run');
      const [formIcon, setFormIcon] = useState('🦅');
      const [formStartValue, setFormStartValue] = useState(4);
      const [formCurrentValue, setFormCurrentValue] = useState(4);
      const [formGoalValue, setFormGoalValue] = useState(6);
      const [formGoalSets, setFormGoalSets] = useState(3);
      const [formGoalReps, setFormGoalReps] = useState(6);
      const [formStartAssistanceKg, setFormStartAssistanceKg] = useState(15);
      const [formGoalAssistanceKg, setFormGoalAssistanceKg] = useState(0);

      // Modale rapide "+ Course / Marche du jour"
      const [quickCardioModalOpen, setQuickCardioModalOpen] = useState(false);
      const [quickCardioCatalogId, setQuickCardioCatalogId] = useState('running_endurance');
      const [quickCardioDistanceKm, setQuickCardioDistanceKm] = useState(5);
      const [quickCardioDurationMin, setQuickCardioDurationMin] = useState(28);
      const [quickCardioElevationM, setQuickCardioElevationM] = useState(40);
      const [quickCardioRpe, setQuickCardioRpe] = useState(7);
      const [quickCardioDate, setQuickCardioDate] = useState(getTodayISODate());
      const [quickCardioNote, setQuickCardioNote] = useState('');

      // États pour l'onglet "⚖️ Suivi du Poids"
      const [newWeightInput, setNewWeightInput] = useState(() => gameState.userWeightKg || 82);
      const [newWeightDate, setNewWeightDate] = useState(getTodayISODate());
      const [newWeightNote, setNewWeightNote] = useState('');

      // Modale d'avertissement de réinitialisation (Professeur Chen)
      const [confirmResetOpen, setConfirmResetOpen] = useState(false);

      // ==========================================
      // CALCULS DÉRIVÉS
      // ==========================================
      const levelInfo = useMemo(() => {
        const level = Math.floor(gameState.xp / 250) + 1;
        const currentLevelXp = gameState.xp % 250;
        const progressPct = Math.min(100, Math.round((currentLevelXp / 250) * 100));
        const rank = [...RPG_RANKS].reverse().find(r => level >= r.minLevel) || RPG_RANKS[0];
        return { level, currentLevelXp, nextLevelXp: 250, progressPct, rank };
      }, [gameState.xp]);

      const arenaLevels = useMemo(() => {
        return ARENA_GROUPS.map(arena => {
          const matchingQuests = gameState.quests.filter(
            q => normalizeArenaGroup(q.category, q.type) === arena.id
          );
          const levelUpsInGroup = matchingQuests.reduce(
            (sum, q) => sum + Math.max(0, (Number(q.level) || 1) - 1),
            0
          );
          const bossesReady = matchingQuests.filter(q => evaluateQuestProgress(q).isBossDefeated).length;
          const groupLevel = 1 + levelUpsInGroup + bossesReady;
          return {
            ...arena,
            groupLevel,
            questsCount: matchingQuests.length,
            bossesReady
          };
        });
      }, [gameState.quests]);

      const dailySummary = useMemo(() => {
        let strengthKcal = 0;
        let cardioKcal = 0;
        const activities = [];

        gameState.quests.forEach(quest => {
          (quest.history || []).forEach(entry => {
            if (entry.date === selectedDate) {
              const kcal = Number(entry.calories) || 0;
              if (quest.type === 'cardio') {
                cardioKcal += kcal;
              } else {
                strengthKcal += kcal;
              }
              activities.push({
                ...entry,
                questId: quest.id,
                questName: quest.name,
                questIcon: quest.icon,
                questType: quest.type,
                questUnit: quest.unit,
                goalMode: quest.goalMode || 'sets_reps',
                goalSets: quest.goalSets || 3,
                goalReps: quest.goalReps || quest.goalValue || 6
              });
            }
          });
        });

        return {
          strengthKcal,
          cardioKcal,
          totalKcal: strengthKcal + cardioKcal,
          activities
        };
      }, [gameState.quests, selectedDate]);

      const dailyJournalList = useMemo(() => {
        const byDate = {};

        gameState.quests.forEach(quest => {
          const hist = quest.history || [];
          hist.forEach((entry, index) => {
            const dateKey = entry.date || getTodayISODate();
            if (!byDate[dateKey]) {
              byDate[dateKey] = {
                date: dateKey,
                totalKcal: 0,
                totalSets: 0,
                totalReps: 0,
                improvedCount: 0,
                goalsBeatenCount: 0,
                items: []
              };
            }
            const prevEntry = index > 0 ? hist[index - 1] : null;
            const comparison = compareWithPreviousSession(quest, entry, prevEntry);

            const setsArr =
              quest.type === 'strength'
                ? getSetDetailsArray(entry, quest.goalSets || 3, quest.goalReps || 6)
                : [];

            byDate[dateKey].totalKcal += Number(entry.calories) || 0;
            byDate[dateKey].totalSets += setsArr.length;
            byDate[dateKey].totalReps += setsArr.reduce((a, b) => a + b, 0);
            if (comparison.improved) byDate[dateKey].improvedCount += 1;
            if (comparison.goalBeaten) byDate[dateKey].goalsBeatenCount += 1;

            byDate[dateKey].items.push({
              entry,
              quest,
              setsArr,
              comparison
            });
          });
        });

        return Object.values(byDate).sort((a, b) => b.date.localeCompare(a.date));
      }, [gameState.quests]);

      const lifetimeStats = useMemo(() => {
        let totalKcal = 0;
        let totalSessions = 0;
        let bossesDefeated = 0;

        gameState.quests.forEach(q => {
          const ev = evaluateQuestProgress(q);
          if (ev.isBossDefeated) bossesDefeated += 1;
          (q.history || []).forEach(h => {
            totalKcal += Number(h.calories) || 0;
            totalSessions += 1;
          });
        });

        return { totalKcal, totalSessions, bossesDefeated };
      }, [gameState.quests]);

      const liveModalCalories = useMemo(() => {
        if (!logModalQuest) return 0;
        if (logModalQuest.type === 'cardio') {
          const distanceKm =
            logModalQuest.unit === 'km'
              ? Number(logValue) || 0
              : ((Number(logValue) || 20) / 60) * 5.2;
          const durationMin =
            logModalQuest.unit === 'min'
              ? Number(logValue) || 20
              : Number(logDurationMin) || 25;
          return calculateCardioCalories({
            cardioMode: logModalQuest.cardioMode || 'run',
            distanceKm,
            durationMin,
            elevationM: logElevationM,
            rpe: logRpe,
            userWeightKg: gameState.userWeightKg
          });
        } else {
          const activeSets =
            logEntryMode === 'per_set'
              ? logSetDetails
              : Array(Math.max(1, Number(logUniformSets) || 1)).fill(
                  Math.max(0, Number(logUniformReps) || 0)
                );
          return calculateStrengthCalories({
            unit: logModalQuest.unit,
            weightKg: logModalQuest.unit === 'kg' ? logValue : 0,
            assistanceKg:
              logModalQuest.unit === 'reps' && logUseAssistance ? logAssistanceKg : 0,
            setDetails: activeSets,
            rpe: logRpe,
            userWeightKg: gameState.userWeightKg
          });
        }
      }, [
        logModalQuest,
        logValue,
        logUseAssistance,
        logAssistanceKg,
        logEntryMode,
        logUniformSets,
        logUniformReps,
        logSetDetails,
        logDurationMin,
        logElevationM,
        logRpe,
        gameState.userWeightKg
      ]);

      const liveQuickCardioCalories = useMemo(() => {
        const cat =
          EXERCISE_CATALOG.find(c => c.id === quickCardioCatalogId) ||
          EXERCISE_CATALOG.find(c => c.id === 'running_endurance');
        return calculateCardioCalories({
          cardioMode: cat?.cardioMode || 'run',
          distanceKm: quickCardioDistanceKm,
          durationMin: quickCardioDurationMin,
          elevationM: quickCardioElevationM,
          rpe: quickCardioRpe,
          userWeightKg: gameState.userWeightKg
        });
      }, [
        quickCardioCatalogId,
        quickCardioDistanceKm,
        quickCardioDurationMin,
        quickCardioElevationM,
        quickCardioRpe,
        gameState.userWeightKg
      ]);

      // ==========================================
      // ACTIONS
      // ==========================================
      const openLogModal = quest => {
        playGameSound('click', gameState.soundEnabled);
        setLogModalQuest(quest);
        setLogDate(selectedDate || getTodayISODate());
        setLogRpe(7);
        setLogNote('');

        if (quest.type === 'cardio') {
          setLogValue(Number(quest.currentValue) || Number(quest.startValue) || 5);
          setLogDurationMin(Number(quest.durationMin) || 28);
          setLogElevationM(Number(quest.elevationM) || 30);
        } else {
          const targetSets = Math.max(1, Number(quest.goalSets) || 3);
          const targetReps = Math.max(1, Number(quest.goalReps) || Number(quest.goalValue) || 6);
          const existingSets = getSetDetailsArray(quest, targetSets, targetReps);
          const initialSets =
            existingSets.length > 0 ? [...existingSets] : Array(targetSets).fill(targetReps);

          setLogSetDetails(initialSets);
          setLogUniformSets(initialSets.length);
          setLogUniformReps(initialSets[0] || targetReps);
          setLogEntryMode('per_set');

          if (quest.unit === 'kg') {
            setLogValue(Number(quest.currentValue) || Number(quest.startValue) || 40);
            setLogUseAssistance(false);
            setLogAssistanceKg(0);
          } else {
            setLogValue(Math.max(...initialSets, targetReps));
            const currAssist = Number(quest.currentAssistanceKg) || 0;
            setLogUseAssistance(currAssist > 0);
            setLogAssistanceKg(currAssist);
          }
        }
      };

      const openLevelUpModal = quest => {
        playGameSound('boss', gameState.soundEnabled);
        setLevelUpModalQuest(quest);
        const gMode = quest.goalMode || 'sets_reps';
        setNextGoalMode(gMode);

        if (quest.type === 'cardio') {
          setNextGoalValue(Math.round((Number(quest.goalValue) || 5) * 1.25 * 10) / 10);
        } else if (quest.unit === 'kg') {
          setNextGoalValue((Number(quest.goalValue) || Number(quest.currentValue) || 40) + 5);
          setNextGoalSets(Number(quest.goalSets) || 3);
          setNextGoalReps(Number(quest.goalReps) || 8);
          setNextGoalAssistanceKg(0);
        } else {
          const currAssist = Number(quest.currentAssistanceKg) || 0;
          const nextAssist = Math.max(0, currAssist - 5);
          setNextGoalAssistanceKg(nextAssist);
          setNextGoalSets(Number(quest.goalSets) || 3);
          const nextReps = currAssist === 0 ? (Number(quest.goalReps) || 6) + 2 : Number(quest.goalReps) || 6;
          setNextGoalReps(nextReps);
          setNextGoalValue(nextReps);
        }
      };

      const handleConfirmLevelUp = e => {
        e.preventDefault();
        if (!levelUpModalQuest) return;

        const q = levelUpModalQuest;
        const newLevel = (Number(q.level) || 1) + 1;
        const newUnlocked = new Set(gameState.unlockedAchievements);
        newUnlocked.add('level_up_exo');
        newUnlocked.add('boss_slayer');

        setGameState(prev => ({
          ...prev,
          xp: prev.xp + 300,
          unlockedAchievements: Array.from(newUnlocked),
          quests: prev.quests.map(item => {
            if (item.id !== q.id) return item;
            if (item.type === 'cardio') {
              return {
                ...item,
                level: newLevel,
                startValue: item.currentValue,
                goalValue: Math.max(1, Number(nextGoalValue) || item.goalValue + 2)
              };
            }
            const gSets = Math.max(1, Number(nextGoalSets) || 3);
            const gReps = Math.max(1, Number(nextGoalReps) || 6);
            const gVal =
              item.unit === 'reps'
                ? gReps
                : Math.max(1, Number(nextGoalValue) || item.goalValue + 2.5);
            return {
              ...item,
              level: newLevel,
              goalMode: nextGoalMode,
              startValue: item.currentValue,
              goalValue: gVal,
              goalSets: gSets,
              goalReps: gReps,
              startAssistanceKg: item.currentAssistanceKg || 0,
              goalAssistanceKg: item.unit === 'reps' ? Math.max(0, Number(nextGoalAssistanceKg) || 0) : 0
            };
          })
        }));

        setLevelUpModalQuest(null);
        playGameSound('boss', gameState.soundEnabled);
        triggerToast(
          `🎵 Niveau ${newLevel} débloqué sur ${q.name} !`,
          `Nouvel objectif enregistré pour viser le Niveau ${newLevel + 1} !`,
          300,
          '👑'
        );
      };

      const handleUpdateSingleSetRep = (index, deltaOrValue, isAbsolute = false) => {
        setLogSetDetails(prev => {
          const next = [...prev];
          const current = Number(next[index]) || 0;
          next[index] = isAbsolute
            ? Math.max(0, Number(deltaOrValue) || 0)
            : Math.max(0, current + deltaOrValue);
          return next;
        });
      };

      const handleAddSetSlot = () => {
        const defaultRep =
          logSetDetails[logSetDetails.length - 1] ||
          Number(logModalQuest?.goalReps) ||
          6;
        setLogSetDetails(prev => [...prev, defaultRep]);
      };

      const handleRemoveSetSlot = () => {
        if (logSetDetails.length <= 1) return;
        setLogSetDetails(prev => prev.slice(0, -1));
      };

      const handleApplyUniformToSets = (setsCount, repsCount) => {
        const s = Math.max(1, Math.min(12, Number(setsCount) || 1));
        const r = Math.max(0, Number(repsCount) || 0);
        setLogUniformSets(s);
        setLogUniformReps(r);
        setLogSetDetails(Array(s).fill(r));
      };

      const handleSaveSession = e => {
        e.preventDefault();
        if (!logModalQuest) return;

        const quest = logModalQuest;
        const calories = liveModalCalories;
        let xpEarned = 50 + Math.round(calories * 0.15);
        let bannerTitle = 'Séance Validée !';
        let bannerSubtitle = `+${calories} kcal brûlées`;
        let bannerBadge = '🎵';
        let questForAutoLevelUp = null;

        const newUnlocked = new Set(gameState.unlockedAchievements);
        newUnlocked.add('first_blood');

        const updatedQuests = gameState.quests.map(q => {
          if (q.id !== quest.id) return q;

          if (q.type === 'cardio') {
            const val = Math.max(0.1, Number(logValue) || 0);
            const dur = Math.max(1, Number(logDurationMin) || 20);
            const elev = Math.max(0, Number(logElevationM) || 0);
            const isPR = val > (Number(q.currentValue) || 0);
            const isBoss = val >= (Number(q.goalValue) || 10);

            if (isPR) {
              xpEarned += 120;
              bannerTitle = 'Nouveau Record Cardio !';
              bannerBadge = '🏃';
            }
            if (isBoss) {
              xpEarned += 400;
              bannerTitle = 'Objectif Cardio Vaincu !';
              bannerBadge = '👑';
              newUnlocked.add('boss_slayer');
            }

            const newEntry = {
              id: `h_${Date.now()}`,
              date: logDate,
              value: val,
              durationMin: dur,
              elevationM: elev,
              rpe: logRpe,
              calories,
              goalBeaten: isBoss,
              note:
                logNote.trim() ||
                `Sortie ${q.name} : ${val} ${q.unit} en ${dur} min (${calories} kcal)`
            };

            const updatedCardioQuest = {
              ...q,
              currentValue: Math.max(Number(q.currentValue) || 0, val),
              durationMin: dur,
              elevationM: elev,
              history: [...(q.history || []), newEntry]
            };

            if (isBoss) questForAutoLevelUp = updatedCardioQuest;
            return updatedCardioQuest;
          }

          const finalSetDetails =
            logEntryMode === 'per_set'
              ? logSetDetails.map(r => Math.max(0, Number(r) || 0))
              : Array(Math.max(1, Number(logUniformSets) || 1)).fill(
                  Math.max(0, Number(logUniformReps) || 0)
                );

          const goalSets = Math.max(1, Number(q.goalSets) || 3);
          const goalReps = Math.max(1, Number(q.goalReps) || Number(q.goalValue) || 6);
          const validatedSetsNow = countValidatedSets(finalSetDetails, goalReps);
          const allSetsRepsValidated = validatedSetsNow >= goalSets;

          const prevSetDetails = getSetDetailsArray(q, goalSets, goalReps);
          const prevValidatedSets = countValidatedSets(prevSetDetails, goalReps);

          const assistanceUsed =
            q.unit === 'reps' && logUseAssistance
              ? Math.max(0, Number(logAssistanceKg) || 0)
              : 0;

          const bestRepInSession = Math.max(...finalSetDetails, 0);
          const effectiveValue =
            q.unit === 'kg' ? Math.max(0, Number(logValue) || 0) : bestRepInSession;

          const reducedAssistance =
            q.unit === 'reps' &&
            assistanceUsed < (Number(q.currentAssistanceKg) ?? 999);
          const moreSetsValidated = validatedSetsNow > prevValidatedSets;
          const increasedLoad =
            q.unit === 'kg' && effectiveValue > (Number(q.currentValue) || 0);

          if (reducedAssistance) {
            newUnlocked.add('elastic_drop');
            xpEarned += 100;
          }

          if (allSetsRepsValidated) {
            newUnlocked.add('sets_master');
            xpEarned += 150;
            bannerTitle = `Format ${goalSets}×${goalReps} Validé !`;
            bannerSubtitle = `${validatedSetsNow}/${goalSets} séries de ${goalReps}+ reps réussies (${formatSetsBreakdown(finalSetDetails)})`;
            bannerBadge = '🔴';
          } else if (moreSetsValidated || increasedLoad || reducedAssistance) {
            xpEarned += 120;
            bannerTitle = 'Progression sur l’Objectif !';
            bannerSubtitle = `${validatedSetsNow}/${goalSets} séries de ${goalReps} reps validées (${formatSetsBreakdown(finalSetDetails)})`;
            bannerBadge = '🔥';
          }

          const updatedQuestCandidate = {
            ...q,
            currentValue: effectiveValue,
            currentAssistanceKg: q.unit === 'reps' ? assistanceUsed : 0,
            setDetails: finalSetDetails
          };

          const evalAfter = evaluateQuestProgress(updatedQuestCandidate);
          if (evalAfter.isBossDefeated) {
            xpEarned += 500;
            bannerTitle = `🎵 OBJECTIF VAINCU : ${q.name} !`;
            bannerSubtitle = `Passage au Niveau ${(Number(q.level) || 1) + 1} disponible !`;
            bannerBadge = '👑';
            newUnlocked.add('boss_slayer');
          }

          const defaultNote =
            q.unit === 'reps'
              ? `Séries : ${formatSetsBreakdown(finalSetDetails)} reps (${
                  assistanceUsed > 0 ? `Aide ${assistanceUsed} kg` : 'Strict 0 kg'
                }) • ${validatedSetsNow}/${goalSets} séries validées`
              : `${effectiveValue} kg • Séries : ${formatSetsBreakdown(
                  finalSetDetails
                )} reps (${validatedSetsNow}/${goalSets} validées)`;

          const newEntry = {
            id: `h_${Date.now()}`,
            date: logDate,
            value: effectiveValue,
            sets: finalSetDetails.length,
            reps: bestRepInSession,
            setDetails: finalSetDetails,
            validatedSets: validatedSetsNow,
            goalSets,
            goalReps,
            assistanceKg: assistanceUsed,
            rpe: logRpe,
            calories,
            goalBeaten: evalAfter.isBossDefeated,
            note: logNote.trim() || defaultNote
          };

          const finalQuest = {
            ...updatedQuestCandidate,
            history: [...(q.history || []), newEntry]
          };

          if (evalAfter.isBossDefeated) {
            questForAutoLevelUp = finalQuest;
          }

          return finalQuest;
        });

        const hasStrength = updatedQuests.some(
          q => q.type === 'strength' && (q.history || []).length > 0
        );
        const hasCardio = updatedQuests.some(
          q => q.type === 'cardio' && (q.history || []).length > 0
        );
        if (hasStrength && hasCardio) newUnlocked.add('hybrid_athlete');

        const totalCaloriesAfter = updatedQuests.reduce(
          (sum, q) =>
            sum +
            (q.history || []).reduce((s, h) => s + (Number(h.calories) || 0), 0),
          0
        );
        if (totalCaloriesAfter >= 1000) newUnlocked.add('calorie_furnace');

        setGameState(prev => ({
          ...prev,
          xp: prev.xp + xpEarned,
          unlockedAchievements: Array.from(newUnlocked),
          quests: updatedQuests
        }));

        setSelectedDate(logDate);
        setSelectedJournalDay(logDate);
        setLogModalQuest(null);
        playGameSound(
          bannerBadge === '👑' ? 'boss' : 'xp',
          gameState.soundEnabled
        );
        triggerToast(bannerTitle, bannerSubtitle, xpEarned, bannerBadge);

        if (questForAutoLevelUp) {
          openLevelUpModal(questForAutoLevelUp);
        }
      };

      const handleSaveQuickCardio = e => {
        e.preventDefault();
        const cat =
          EXERCISE_CATALOG.find(c => c.id === quickCardioCatalogId) ||
          EXERCISE_CATALOG.find(c => c.id === 'running_endurance');

        const dist = Math.max(0.1, Number(quickCardioDistanceKm) || 5);
        const dur = Math.max(1, Number(quickCardioDurationMin) || 25);
        const elev = Math.max(0, Number(quickCardioElevationM) || 0);
        const calories = liveQuickCardioCalories;
        const primaryValue = cat.unit === 'min' ? dur : dist;
        const xpGain = 85 + Math.round(calories * 0.15);

        const newEntry = {
          id: `h_cardio_${Date.now()}`,
          date: quickCardioDate,
          value: primaryValue,
          distanceKm: dist,
          durationMin: dur,
          elevationM: elev,
          rpe: quickCardioRpe,
          calories,
          goalBeaten: false,
          note:
            quickCardioNote.trim() ||
            `${cat.name} : ${dist} km en ${dur} min (D+ ${elev}m)`
        };

        let questFound = false;
        const updatedQuests = gameState.quests.map(q => {
          if (q.catalogId === cat.id) {
            questFound = true;
            return {
              ...q,
              currentValue: Math.max(Number(q.currentValue) || 0, primaryValue),
              durationMin: dur,
              elevationM: elev,
              history: [...(q.history || []), newEntry]
            };
          }
          return q;
        });

        if (!questFound) {
          updatedQuests.push({
            id: `q_${cat.id}_${Date.now()}`,
            catalogId: cat.id,
            name: cat.name,
            category: 'Course & Cardio',
            type: 'cardio',
            cardioMode: cat.cardioMode || 'run',
            unit: cat.unit,
            level: 1,
            icon: cat.icon,
            startValue: primaryValue,
            currentValue: primaryValue,
            goalValue: Math.max(cat.defaultGoal || 10, Math.round(primaryValue * 1.5)),
            durationMin: dur,
            elevationM: elev,
            history: [newEntry]
          });
        }

        const newUnlocked = new Set(gameState.unlockedAchievements);
        newUnlocked.add('first_blood');
        newUnlocked.add('hybrid_athlete');

        setGameState(prev => ({
          ...prev,
          xp: prev.xp + xpGain,
          unlockedAchievements: Array.from(newUnlocked),
          quests: updatedQuests
        }));

        setSelectedDate(quickCardioDate);
        setSelectedJournalDay(quickCardioDate);
        setQuickCardioModalOpen(false);
        playGameSound('xp', gameState.soundEnabled);
        triggerToast(
          `${cat.name} ajoutée !`,
          `${dist} km en ${dur} min • 🔥 ${calories} kcal brûlées`,
          xpGain,
          cat.icon
        );
      };

      // ==========================================
      // ACTION : SUPPRIMER UNE SÉANCE (BILAN DU JOUR OU JOURNAL)
      // ==========================================
      const handleDeleteSessionEntry = (questId, entryId) => {
        playGameSound('click', gameState.soundEnabled);
        let deletedQuestName = 'Séance';

        setGameState(prev => {
          const updatedQuests = prev.quests.map(q => {
            if (q.id !== questId) return q;
            deletedQuestName = q.name;
            const remainingHistory = (q.history || []).filter(h => h.id !== entryId);

            if (remainingHistory.length === 0) {
              const gSets = Math.max(1, Number(q.goalSets) || 3);
              const gReps = Math.max(1, Number(q.goalReps) || Number(q.goalValue) || 6);
              const resetVal = Number(q.startValue) || 0;
              return {
                ...q,
                currentValue: resetVal,
                currentAssistanceKg: q.unit === 'reps' ? Number(q.startAssistanceKg) || 0 : 0,
                setDetails: q.type === 'strength'
                  ? Array(gSets).fill(q.unit === 'reps' ? resetVal : gReps)
                  : [],
                history: []
              };
            }

            const last = remainingHistory[remainingHistory.length - 1];
            if (q.type === 'cardio') {
              const maxVal = remainingHistory.reduce(
                (max, h) => Math.max(max, Number(h.value) || 0),
                Number(q.startValue) || 0
              );
              return {
                ...q,
                currentValue: maxVal,
                durationMin: last.durationMin || q.durationMin,
                elevationM: last.elevationM !== undefined ? last.elevationM : q.elevationM,
                history: remainingHistory
              };
            }

            const gSets = Math.max(1, Number(q.goalSets) || 3);
            const gReps = Math.max(1, Number(q.goalReps) || Number(q.goalValue) || 6);
            const restoredSets = getSetDetailsArray(last, gSets, gReps);

            return {
              ...q,
              currentValue: Number(last.value) || Number(q.startValue) || 0,
              currentAssistanceKg: q.unit === 'reps' ? Number(last.assistanceKg) || 0 : 0,
              setDetails: restoredSets,
              history: remainingHistory
            };
          });

          return {
            ...prev,
            quests: updatedQuests
          };
        });

        triggerToast(
          'Séance supprimée',
          `${deletedQuestName} a été retirée du bilan et vos statistiques ont été recalculées.`,
          0,
          '🗑️'
        );
      };

      const openCreateQuestModal = () => {
        const def = EXERCISE_CATALOG[0];
        setEditingQuestId(null);
        setFormCatalogId(def.id);
        setFormCustomName(def.name);
        setFormCategory(def.category);
        setFormType(def.type);
        setFormUnit(def.unit);
        setFormGoalMode(def.defaultGoalMode || 'sets_reps');
        setFormCardioMode(def.cardioMode || 'run');
        setFormIcon(def.icon);
        setFormStartValue(def.defaultStart);
        setFormCurrentValue(def.defaultStart);
        setFormGoalValue(def.defaultGoal);
        setFormGoalSets(def.defaultGoalSets || 3);
        setFormGoalReps(def.defaultGoalReps || 6);
        setFormStartAssistanceKg(def.defaultStartAssistance || 0);
        setFormGoalAssistanceKg(def.defaultGoalAssistance || 0);
        setQuestModalOpen(true);
      };

      const openEditQuestModal = quest => {
        setEditingQuestId(quest.id);
        setFormCatalogId(quest.catalogId || 'custom');
        setFormCustomName(quest.name);
        setFormCategory(normalizeArenaGroup(quest.category, quest.type));
        setFormType(quest.type || 'strength');
        setFormUnit(quest.unit || 'reps');
        setFormGoalMode(quest.goalMode || 'sets_reps');
        setFormCardioMode(quest.cardioMode || 'run');
        setFormIcon(quest.icon || '⚔️');
        setFormStartValue(Number(quest.startValue) || 0);
        setFormCurrentValue(Number(quest.currentValue) || 0);
        setFormGoalValue(Number(quest.goalValue) || 6);
        setFormGoalSets(Number(quest.goalSets) || 3);
        setFormGoalReps(Number(quest.goalReps) || Number(quest.goalValue) || 6);
        setFormStartAssistanceKg(Number(quest.startAssistanceKg) || 0);
        setFormGoalAssistanceKg(Number(quest.goalAssistanceKg) || 0);
        setQuestModalOpen(true);
      };

      const handleSelectCatalogExercise = catId => {
        setFormCatalogId(catId);
        if (catId === 'custom_strength') {
          setFormCustomName('');
          setFormCategory('Pectoraux');
          setFormType('strength');
          setFormUnit('kg');
          setFormGoalMode('sets_reps');
          setFormIcon('⚔️');
          setFormStartValue(20);
          setFormCurrentValue(20);
          setFormGoalValue(40);
          setFormGoalSets(3);
          setFormGoalReps(8);
          setFormStartAssistanceKg(0);
          setFormGoalAssistanceKg(0);
          return;
        }
        if (catId === 'custom_bodyweight') {
          setFormCustomName('');
          setFormCategory('Dos');
          setFormType('strength');
          setFormUnit('reps');
          setFormGoalMode('sets_reps');
          setFormIcon('🦅');
          setFormStartValue(4);
          setFormCurrentValue(4);
          setFormGoalValue(8);
          setFormGoalSets(3);
          setFormGoalReps(8);
          setFormStartAssistanceKg(10);
          setFormGoalAssistanceKg(0);
          return;
        }
        const found = EXERCISE_CATALOG.find(item => item.id === catId);
        if (!found) return;
        setFormCustomName(found.name);
        setFormCategory(normalizeArenaGroup(found.category, found.type));
        setFormType(found.type);
        setFormUnit(found.unit);
        setFormGoalMode(found.defaultGoalMode || 'sets_reps');
        setFormCardioMode(found.cardioMode || 'run');
        setFormIcon(found.icon);
        setFormStartValue(found.defaultStart);
        setFormCurrentValue(found.defaultStart);
        setFormGoalValue(found.defaultGoal);
        setFormGoalSets(found.defaultGoalSets || 3);
        setFormGoalReps(found.defaultGoalReps || 6);
        setFormStartAssistanceKg(found.defaultStartAssistance || 0);
        setFormGoalAssistanceKg(found.defaultGoalAssistance || 0);
      };

      const handleSaveQuestForm = e => {
        e.preventDefault();
        const cleanName = formCustomName.trim() || 'Nouvel Exercice';
        const gSets = formGoalMode === 'reps_only' ? 1 : Math.max(1, Number(formGoalSets) || 3);
        const gReps = Math.max(1, Number(formGoalReps) || 6);
        const effectiveUnit =
          formType === 'strength' && formGoalMode === 'weight_only' ? 'kg' : formUnit;
        const finalGoalValue =
          formType === 'strength' && effectiveUnit === 'reps'
            ? gReps
            : Math.max(1, Number(formGoalValue) || gReps);

        if (editingQuestId) {
          setGameState(prev => ({
            ...prev,
            quests: prev.quests.map(q => {
              if (q.id !== editingQuestId) return q;
              return {
                ...q,
                name: cleanName,
                category: formCategory,
                type: formType,
                unit: effectiveUnit,
                goalMode: formGoalMode,
                cardioMode: formCardioMode,
                icon: formIcon,
                startValue: Number(formStartValue) || 0,
                currentValue: Number(formCurrentValue) || 0,
                goalValue: finalGoalValue,
                goalSets: gSets,
                goalReps: gReps,
                startAssistanceKg:
                  effectiveUnit === 'reps' ? Number(formStartAssistanceKg) || 0 : 0,
                goalAssistanceKg:
                  effectiveUnit === 'reps' ? Number(formGoalAssistanceKg) || 0 : 0
              };
            })
          }));
          triggerToast('Objectif ajusté !', `${cleanName} mis à jour.`, 25, '🛠️');
        } else {
          const startRepsOrVal = Number(formStartValue) || 0;
          const initialSetDetails =
            formType === 'strength'
              ? Array(gSets).fill(effectiveUnit === 'reps' ? startRepsOrVal : gReps)
              : [];

          const initialCalories =
            formType === 'cardio'
              ? calculateCardioCalories({
                  cardioMode: formCardioMode,
                  distanceKm: startRepsOrVal,
                  durationMin: 25,
                  elevationM: 20,
                  rpe: 7,
                  userWeightKg: gameState.userWeightKg
                })
              : calculateStrengthCalories({
                  unit: effectiveUnit,
                  weightKg: effectiveUnit === 'kg' ? startRepsOrVal : 0,
                  assistanceKg:
                    effectiveUnit === 'reps' ? Number(formStartAssistanceKg) || 0 : 0,
                  setDetails: initialSetDetails,
                  rpe: 7,
                  userWeightKg: gameState.userWeightKg
                });

          const newQuest = {
            id: `q_${Date.now()}`,
            catalogId: formCatalogId,
            name: cleanName,
            category: formCategory,
            type: formType,
            cardioMode: formCardioMode,
            unit: effectiveUnit,
            goalMode: formGoalMode,
            level: 1,
            icon: formIcon,
            startValue: startRepsOrVal,
            currentValue: Number(formCurrentValue) || startRepsOrVal,
            goalValue: finalGoalValue,
            goalSets: gSets,
            goalReps: gReps,
            setDetails: initialSetDetails,
            startAssistanceKg:
              effectiveUnit === 'reps' ? Number(formStartAssistanceKg) || 0 : 0,
            currentAssistanceKg:
              effectiveUnit === 'reps' ? Number(formStartAssistanceKg) || 0 : 0,
            goalAssistanceKg:
              effectiveUnit === 'reps' ? Number(formGoalAssistanceKg) || 0 : 0,
            history: [
              {
                id: `h_start_${Date.now()}`,
                date: getTodayISODate(),
                value: Number(formCurrentValue) || startRepsOrVal,
                sets: gSets,
                reps: effectiveUnit === 'reps' ? startRepsOrVal : gReps,
                setDetails: initialSetDetails,
                assistanceKg:
                  effectiveUnit === 'reps' ? Number(formStartAssistanceKg) || 0 : 0,
                rpe: 7,
                calories: initialCalories,
                goalBeaten: false,
                note: `Point de départ — Niveau 1 (${cleanName})`
              }
            ]
          };

          setGameState(prev => ({
            ...prev,
            xp: prev.xp + 40,
            quests: [newQuest, ...prev.quests]
          }));
          setSelectedChartQuestId(newQuest.id);
          triggerToast('Nouvelle Quête Créée !', `${cleanName} ajouté au Pokédex.`, 40, formIcon);
        }

        setQuestModalOpen(false);
        playGameSound('xp', gameState.soundEnabled);
      };

      const handleAddWeightEntry = e => {
        e.preventDefault();
        const w = Math.max(30, Math.min(250, Number(newWeightInput) || gameState.userWeightKg));
        const entry = {
          id: `w_${Date.now()}`,
          date: newWeightDate || getTodayISODate(),
          weightKg: w,
          note: newWeightNote.trim() || `Pesée à ${w} kg`
        };

        const newUnlocked = new Set(gameState.unlockedAchievements);
        newUnlocked.add('weight_tracker');

        setGameState(prev => ({
          ...prev,
          userWeightKg: w,
          xp: prev.xp + 25,
          unlockedAchievements: Array.from(newUnlocked),
          weightHistory: [...(prev.weightHistory || []), entry].sort((a, b) =>
            a.date.localeCompare(b.date)
          )
        }));

        setNewWeightNote('');
        playGameSound('xp', gameState.soundEnabled);
        triggerToast('Pesée enregistrée !', `Poids actuel mis à jour : ${w} kg`, 25, '⚖️');
      };

      const handleDeleteWeightEntry = id => {
        setGameState(prev => {
          const filtered = (prev.weightHistory || []).filter(item => item.id !== id);
          const latest = filtered.length > 0 ? filtered[filtered.length - 1].weightKg : prev.userWeightKg;
          return {
            ...prev,
            userWeightKg: latest,
            weightHistory: filtered
          };
        });
      };

      const handleDeleteQuest = questId => {
        setGameState(prev => ({
          ...prev,
          quests: prev.quests.filter(q => q.id !== questId)
        }));
        triggerToast('Quête retirée', 'L’exercice a été retiré du Pokédex.', 0, '🗑️');
      };

      const handleResetAll = (blankMode = false) => {
        const nextState = blankMode
          ? {
              ...INITIAL_STATE,
              xp: 0,
              streak: 1,
              unlockedAchievements: [],
              quests: [],
              weightHistory: [
                {
                  id: `w_init_${Date.now()}`,
                  date: getTodayISODate(),
                  weightKg: gameState.userWeightKg || 82,
                  note: 'Point de départ (Remise à zéro)'
                }
              ]
            }
          : INITIAL_STATE;

        setGameState(nextState);
        setConfirmResetOpen(false);
        triggerToast(
          'Pokédex Réinitialisé',
          blankMode ? 'Page vierge (0 exercice) prête !' : 'Retour au Jour 1 !',
          0,
          '🔄'
        );
      };

      const filteredQuests = useMemo(() => {
        if (questFilter === 'all') return gameState.quests;
        return gameState.quests.filter(
          q => normalizeArenaGroup(q.category, q.type) === questFilter
        );
      }, [gameState.quests, questFilter]);

      const activeChartQuest = useMemo(() => {
        return (
          gameState.quests.find(q => q.id === selectedChartQuestId) ||
          gameState.quests[0] ||
          null
        );
      }, [gameState.quests, selectedChartQuestId]);

      const activeJournalDayObj = useMemo(() => {
        return (
          dailyJournalList.find(d => d.date === selectedJournalDay) ||
          dailyJournalList[0] ||
          null
        );
      }, [dailyJournalList, selectedJournalDay]);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans selection:bg-pink-500 selection:text-white pb-16">
          {/* TOAST NOTIFICATION POKÉMON RONDOUDOU */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 max-w-md bg-slate-900/95 border-2 border-pink-400/80 shadow-2xl shadow-pink-500/20 rounded-2xl p-4 flex items-center gap-3.5 animate-bounce">
              <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-pink-400 to-rose-600 flex items-center justify-center text-2xl shrink-0 shadow-inner">
                {toast.badge}
              </div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2">
                  <p className="font-extrabold text-pink-300 text-sm uppercase tracking-wider truncate">
                    {toast.title}
                  </p>
                  {toast.xpGain > 0 && (
                    <span className="px-2 py-0.5 text-xs font-black rounded-full bg-indigo-500/30 border border-indigo-400 text-indigo-200">
                      +{toast.xpGain} EXP
                    </span>
                  )}
                </div>
                <p className="text-xs text-slate-300 mt-0.5 line-clamp-2">{toast.subtitle}</p>
              </div>
              <button
                onClick={() => setToast(null)}
                className="text-slate-400 hover:text-white p-1"
              >
                <X className="w-4 h-4" />
              </button>
            </div>
          )}

          {/* EN-TÊTE : AVATAR RONDOUDOU NATUREL EN HAUT À GAUCHE */}
          <header className="relative overflow-hidden border-b border-pink-500/20 bg-gradient-to-b from-slate-900 via-slate-900 to-slate-950">
            <div className="max-w-6xl mx-auto px-4 py-5 space-y-5">
              <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-5">
                <div className="flex items-center gap-4">
                  <div
                    onClick={() => setActiveTab('weight')}
                    title="Voir le suivi du poids"
                    className="cursor-pointer relative w-20 h-20 sm:w-24 sm:h-24 rounded-2xl bg-gradient-to-br from-pink-400 via-rose-500 to-indigo-600 p-0.5 shadow-lg shadow-pink-500/20 shrink-0 group transition-transform hover:scale-105"
                  >
                    <div className="w-full h-full bg-slate-950/95 rounded-[14px] flex flex-col items-center justify-center relative overflow-hidden">
                      <JigglypuffAvatar
                        currentWeightKg={gameState.userWeightKg}
                        targetWeightKg={gameState.targetWeightKg}
                        size={72}
                      />
                      <span className="absolute bottom-1 px-2 py-0.2 rounded-full bg-slate-900/90 border border-pink-400/50 text-[9px] font-black uppercase tracking-widest text-pink-300">
                        Niv. {levelInfo.level}
                      </span>
                    </div>
                  </div>

                  <div className="space-y-1.5 flex-1">
                    <div className="flex flex-wrap items-center gap-2">
                      <span className="px-2.5 py-0.5 rounded-full text-xs font-bold uppercase tracking-wider bg-pink-500/20 text-pink-300 border border-pink-500/40">
                        {levelInfo.rank.badge} {levelInfo.rank.title}
                      </span>
                      <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-500/15 text-amber-300 border border-amber-500/30 flex items-center gap-1">
                        <Flame className="w-3.5 h-3.5 text-amber-400" /> Série : {gameState.streak} j
                      </span>
                      <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-500/15 text-rose-300 border border-rose-500/30 flex items-center gap-1">
                        🔥 {lifetimeStats.totalKcal} kcal brûlées
                      </span>
                      <span
                        className={`px-2.5 py-0.5 rounded-full text-[11px] font-bold border ${
                          cloudStatus === 'synced'
                            ? 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30'
                            : cloudStatus === 'saving' || cloudStatus === 'loading'
                            ? 'bg-amber-500/15 text-amber-300 border-amber-500/30 animate-pulse'
                            : 'bg-rose-500/15 text-rose-300 border-rose-500/30'
                        }`}
                      >
                        {cloudStatus === 'synced'
                          ? '☁️ Sauvegardé sur Google Sheets'
                          : cloudStatus === 'saving'
                          ? '⏳ Synchronisation Cloud...'
                          : cloudStatus === 'loading'
                          ? '☁️ Chargement Cloud...'
                          : '⚠️ Sauvegarde Locale Active'}
                      </span>
                    </div>

                    <h1 className="text-xl sm:text-2xl font-black tracking-tight bg-gradient-to-r from-pink-300 via-rose-200 to-amber-200 bg-clip-text text-transparent">

                        <span>Jauge EXP ({gameState.xp} EXP)</span>
                        <span className="text-pink-300">
                          {levelInfo.currentLevelXp} / {levelInfo.nextLevelXp} EXP
                        </span>
                      </div>
                      <div className="w-full h-3 bg-slate-800 rounded-full overflow-hidden p-0.5 border border-slate-700">

                          style={{ width: `${levelInfo.progressPct}%` }}
                        />
                      </div>
                    </div>

                    className="bg-slate-900 hover:bg-slate-800/90 border border-pink-500/30 rounded-xl px-3 py-2 flex items-center gap-2.5 transition text-left"
                  >
                    <Scale className="w-4 h-4 text-pink-400 shrink-0" />
                    <div>
                      <span className="block text-[10px] uppercase tracking-wider text-slate-400 font-semibold">
                        Poids Actuel ➔ Cible
                      </span>
                      <span className="text-xs font-black text-white">
                        {gameState.userWeightKg} kg{' '}
                        <span className="text-pink-300 font-bold">
                          ➔ {gameState.targetWeightKg} kg
                        </span>
                      </span>
                    </div>
                  </button>

                  <button
                    onClick={() => {
                      setQuickCardioDate(selectedDate);
                      setQuickCardioModalOpen(true);
                    }}
                    className="px-3.5 py-2.5 rounded-xl font-bold text-xs sm:text-sm bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white shadow-lg shadow-emerald-600/20 flex items-center gap-2 transition"
                  >
                    <Footprints className="w-4 h-4" />
                    <span>+ Course / Marche</span>

                  <button
