    // ==========================================

    const ARENA_GROUPS = [

{ id: 'Volley-ball', label: 'Volley-ball', icon: '🏐', badgeName: 'Badge Smash', color: 'from-sky-400 to-blue-600' }
    ];

    function normalizeArenaGroup(category = '', type = 'strength') {
if (category.toLowerCase().includes('volley')) return 'Volley-ball';
      if (type === 'cardio' || category.toLowerCase().includes('course') || category.toLowerCase().includes('cardio')) {
        return 'Course & Cardio';
      }
      const c = category.toLowerCase();
      if (c.includes('abdo') || c.includes('gainage')) return 'Abdominaux';
      if (c.includes('dos')) return 'Dos';
      if (c.includes('pec')) return 'Pectoraux';
      if (c.includes('jambe') || c.includes('cuisse') || c.includes('mollet')) return 'Jambes';
      if (c.includes('épaule') || c.includes('epaule') || c.includes('bras') || c.includes('biceps') || c.includes('triceps')) {
        return 'Épaules & Bras';
      }
      return 'Pectoraux';
    }

    // ==========================================
    // AVATAR RONDOUDOU ÉVOLUTIF (10 STADES CACHÉS SELON L'ÉCART DE POIDS)
    // ==========================================
    function computeRondoudouStage(currentWeightKg, targetWeightKg) {
      const curr = Number(currentWeightKg) || 85;
      const targ = Number(targetWeightKg) || 75;
      const diff = Math.max(0, Math.abs(curr - targ));
      if (diff <= 0.4) return 10;
      return Math.max(1, Math.min(9, 11 - Math.min(10, Math.ceil(diff))));
    }

    function JigglypuffAvatar({ currentWeightKg, targetWeightKg, size = 68 }) {
      const stage = computeRondoudouStage(currentWeightKg, targetWeightKg);
      const t = (stage - 1) / 9;
      const bodyRx = Math.round(45 - t * 12);
      const bodyRy = Math.round(42 - t * 10);

      const isVeryChubby = stage <= 3;
      const hasHeadband = stage >= 4;
      const hasMic = stage >= 5;
      const hasDumbbell = stage >= 3;
      const hasTone = stage >= 7;
      const hasSixPack = stage >= 8;
      const isChampion = stage >= 9;

      return (
        <svg viewBox="0 0 120 120" width={size} height={size} className="overflow-visible select-none drop-shadow-md">
          <defs>
            <radialGradient id="jpBodyGrad" cx="38%" cy="32%" r="68%">
              <stop offset="0%" stopColor="#ffd6e8" />
              <stop offset="55%" stopColor="#ff9ebb" />
              <stop offset="100%" stopColor="#e66b96" />
            </radialGradient>
            <radialGradient id="jpEyeGrad" cx="40%" cy="35%" r="65%">
              <stop offset="0%" stopColor="#67e8f9" />
              <stop offset="60%" stopColor="#0d9488" />
              <stop offset="100%" stopColor="#115e59" />
            </radialGradient>
            <radialGradient id="jpAuraGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stopColor="#fbbf24" stopOpacity="0.45" />
              <stop offset="100%" stopColor="#f43f5e" stopOpacity="0" />
            </radialGradient>
          </defs>

          {isChampion && <circle cx="60" cy="62" r="54" fill="url(#jpAuraGrad)" />}

          <ellipse cx="60" cy="108" rx={bodyRx * 0.85} ry="6" fill="rgba(0,0,0,0.35)" />

          <ellipse cx={60 - bodyRx * 0.45} cy="102" rx={isVeryChubby ? 14 : 11} ry="6.5" transform="rotate(-12 42 102)" fill="#e66b96" stroke="#831843" strokeWidth="2" />
          <ellipse cx={60 + bodyRx * 0.45} cy="102" rx={isVeryChubby ? 14 : 11} ry="6.5" transform="rotate(12 78 102)" fill="#e66b96" stroke="#831843" strokeWidth="2" />

          <polygon points={`${60 - bodyRx * 0.75},42 ${60 - bodyRx * 0.92},15 ${60 - bodyRx * 0.32},26`} fill="url(#jpBodyGrad)" stroke="#831843" strokeWidth="2.5" strokeLinejoin="round" />
          <polygon points={`${60 - bodyRx * 0.7},36 ${60 - bodyRx * 0.84},20 ${60 - bodyRx * 0.42},28`} fill="#4c1d95" />

          <polygon points={`${60 + bodyRx * 0.75},42 ${60 + bodyRx * 0.92},15 ${60 + bodyRx * 0.32},26`} fill="url(#jpBodyGrad)" stroke="#831843" strokeWidth="2.5" strokeLinejoin="round" />
          <polygon points={`${60 + bodyRx * 0.7},36 ${60 + bodyRx * 0.84},20 ${60 + bodyRx * 0.42},28`} fill="#4c1d95" />

          <ellipse cx="60" cy="63" rx={bodyRx} ry={bodyRy} fill="url(#jpBodyGrad)" stroke="#831843" strokeWidth="2.6" />

          {stage === 1 && (
            <>
              <path d="M 24 72 Q 16 84 29 90" fill="#ff9ebb" stroke="#9d174d" strokeWidth="2" />
              <path d="M 96 72 Q 104 84 91 90" fill="#ff9ebb" stroke="#9d174d" strokeWidth="2" />
              <path d="M 42 84 Q 60 92 78 84" fill="none" stroke="#be185d" strokeWidth="2" strokeLinecap="round" />
              <path d="M 36 91 Q 60 100 84 91" fill="none" stroke="#be185d" strokeWidth="2" strokeLinecap="round" />
            </>
          )}
          {stage === 2 && (
            <>

              <path d="M 40 91 Q 60 98 80 91" fill="none" stroke="#be185d" strokeWidth="1.6" strokeLinecap="round" />
            </>
          )}
          {(stage === 3 || stage === 4) && (
            <path d="M 46 87 Q 60 93 74 87" fill="none" stroke="#be185d" strokeWidth="1.5" strokeLinecap="round" opacity="0.7" />
          )}

          {hasTone && (
            <g stroke="#be185d" strokeLinecap="round" fill="none" opacity={stage >= 9 ? 0.85 : 0.55}>
              <path d="M 45 71 Q 52 75 59 71" strokeWidth="1.8" />

            <circle cx="75" cy="54" r={isVeryChubby ? 9.5 : 11} fill="#ffffff" stroke="#831843" strokeWidth="2" />

            {stage <= 2 && (

          {stage <= 2 && (
            <path d="M 95 36 C 95 36, 99 43, 95 46 C 91 43, 95 36, 95 36 Z" fill="#38bdf8" stroke="#0284c7" strokeWidth="1.2" />
          )}

          {stage <= 2 ? (
            <ellipse cx="60" cy="66" rx="4.5" ry="3.5" fill="#9d174d" />

            <path d="M 52 63 Q 60 72 68 63 Z" fill="#be185d" stroke="#831843" strokeWidth="1.8" />
          ) : (
            <path d="M 54 64 Q 60 70 66 64" fill="none" stroke="#831843" strokeWidth="2.2" strokeLinecap="round" />
          )}

          {hasTone ? (
            <path d={`M ${60 - bodyRx + 3} 62 Q 12 48 22 36 Q 28 32 31 44`} fill="url(#jpBodyGrad)" stroke="#831843" strokeWidth="2.4" />
          ) : (
            <ellipse cx={60 - bodyRx + 2} cy="67" rx="9" ry="5.5" transform="rotate(20 22 67)" fill="url(#jpBodyGrad)" stroke="#831843" strokeWidth="2" />
          )}

          {hasMic && (
            <g transform={hasTone ? 'translate(12, 24) rotate(-20)' : 'translate(8, 52) rotate(-25)'}>
              <rect x="4" y="8" width="4.5" height="13" rx="2" fill="#334155" stroke="#0f172a" strokeWidth="1.2" />
              <circle cx="6.2" cy="6" r="5.5" fill="#10b981" stroke="#064e3b" strokeWidth="1.5" />
            </g>
          )}

          {hasTone ? (
            <path d={`M ${60 + bodyRx - 3} 62 Q 108 48 98 36 Q 92 32 89 44`} fill="url(#jpBodyGrad)" stroke="#831843" strokeWidth="2.4" />
          ) : (
            <ellipse cx={60 + bodyRx - 2} cy="67" rx="9" ry="5.5" transform="rotate(-20 98 67)" fill="url(#jpBodyGrad)" stroke="#831843" strokeWidth="2" />
          )}

          {hasDumbbell && (
            <g transform={hasTone ? 'translate(88, 22) rotate(18)' : 'translate(88, 56) rotate(15)'}>
              <line x1="0" y1="8" x2="20" y2="8" stroke="#94a3b8" strokeWidth="3" />

    // Trophées calculés automatiquement à partir de l’historique (rétroactifs)
    function computeDerivedAchievements(state) {
      const met = [];
      const quests = state.quests || [];
      const isStart = h => String(h.note || '').startsWith('Point de départ');
      const entries = quests.flatMap(q =>
        (q.history || []).filter(h => !isStart(h)).map(h => ({ ...h, quest: q }))
      );

      if (entries.some(e => /volley/i.test(`${e.quest.category || ''} ${e.quest.catalogId || ''} ${e.quest.name || ''}`))) {
        met.push('volley_rookie');
      }

      const perDay = {};
      entries.forEach(e => {
        if (!e.date) return;
        (perDay[e.date] = perDay[e.date] || new Set()).add(e.quest.id);
      });
      if (Object.values(perDay).some(set => set.size >= 3)) met.push('triple_combo');

      const days = Object.keys(perDay).sort();
      let run = 0, best = 0, prev = null;
      days.forEach(d => {
        const t = Date.parse(d + 'T00:00:00Z');
        run = prev !== null && Math.round((t - prev) / 86400000) === 1 ? run + 1 : 1;
        prev = t;
        if (run > best) best = run;
      });
      if (best >= 3) met.push('streak_3');

      const arenas = new Set(
        quests
          .filter(q => (q.history || []).some(h => !isStart(h)))
          .map(q => normalizeArenaGroup(q.category || '', q.type))
      );
      if (arenas.size >= 4) met.push('polyvalent');

      if (entries.length >= 20) met.push('veteran_20');

      const kcal = entries.reduce((sum, e) => sum + (Number(e.calories) || 0), 0);
      if (kcal >= 5000) met.push('calorie_inferno');

      const lost = (Number(state.startWeightKg) || 0) - (Number(state.userWeightKg) || 0);
      if (lost >= 5) met.push('weight_loss_5');

      return met;
    }

    const getTodayISODate = () => new Date().toISOString().split('T')[0];

    function getYesterdayISODate() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return d.toISOString().split('T')[0];
    }

    function getSetDetailsArray(item, fallbackSets = 3, fallbackReps = 6) {
      if (Array.isArray(item?.setDetails) && item.setDetails.length > 0) {
        return item.setDetails.map(r => Math.max(0, Number(r) || 0));
      }
      const count = Math.max(1, Number(item?.sets || item?.currentSets || fallbackSets) || 3);
      const reps = Math.max(0, Number(item?.reps ?? item?.value ?? item?.currentValue ?? fallbackReps) || 0);
      return Array(count).fill(reps);
    }

    function formatSetsBreakdown(setDetails) {
      if (!Array.isArray(setDetails) || setDetails.length === 0) return '';
      return setDetails.join(' - ');
    }

    function countValidatedSets(setDetails, goalReps) {
      const target = Math.max(1, Number(goalReps) || 1);
      return (setDetails || []).filter(r => Number(r) >= target).length;
    }

    function calculateStrengthCalories({ unit, weightKg = 0, assistanceKg = 0, setDetails = [6, 6, 6], rpe = 7, userWeightKg = 82 }) {
      const numSets = Math.max(1, setDetails.length);
      const totalReps = setDetails.reduce((acc, r) => acc + (Number(r) || 0), 0);
      const durationHours = (numSets * 2.2 + totalReps * 0.05) / 60;
      const effectiveLoad = unit === 'reps'
        ? Math.max(15, userWeightKg * 0.78 - (Number(assistanceKg) || 0))
        : Math.max(5, Number(weightKg) || 0);
      const loadRatio = effectiveLoad / Math.max(45, userWeightKg);
      const met = 3.8 + (rpe - 5) * 0.55 + Math.min(2.8, loadRatio * 1.45);
      const metabolicKcal = met * userWeightKg * durationHours;
      const mechanicalBonus = totalReps * effectiveLoad * 0.014;
      return Math.max(12, Math.round(metabolicKcal + mechanicalBonus));
    }

    function calculateCardioCalories({ cardioMode = 'run', distanceKm = 5, durationMin = 30, elevationM = 0, rpe = 7, userWeightKg = 82 }) {
      const durMin = Math.max(1, Number(durationMin) || 20);
      const distKm = Math.max(0.1, Number(distanceKm) || 0);
      const elevM = Math.max(0, Number(elevationM) || 0);
      const speedKmh = distKm / (durMin / 60);

      let kcal = 0;
      if (cardioMode === 'run' || cardioMode === 'interval') {
        const intensityFactor = cardioMode === 'interval' ? 1.14 : 1.02 + (rpe - 6) * 0.03;
        const distanceCost = userWeightKg * distKm * 1.03 * intensityFactor;
        const elevationCost = userWeightKg * elevM * 0.019;
        kcal = distanceCost + elevationCost;
} else if (cardioMode === 'volleyball') {
        // RPE 4-5 (Entraînement modéré) = ~4.0 à 4.5 METs
        // RPE 8 (Match compétitif) = ~6.0 METs
        const baseMet = 2.0 + (rpe * 0.5);
        kcal = baseMet * userWeightKg * (durMin / 60);
      } else if (cardioMode === 'walk' || cardioMode === 'incline_walk') {
        const baseMet = cardioMode === 'incline_walk' ? 6.2 : speedKmh > 5.5 ? 4.8 : 3.8;
        const met = baseMet + (rpe - 6) * 0.35;
        const elevationCost = userWeightKg * elevM * 0.022;
        kcal = met * userWeightKg * (durMin / 60) + elevationCost;
      } else {
        const met = 6.8 + (rpe - 6) * 0.5;
        const elevationCost = userWeightKg * elevM * 0.015;
        kcal = met * userWeightKg * (durMin / 60) + elevationCost;
      }
      return Math.max(20, Math.round(kcal));
    }

    function formatPaceAndSpeed(distanceKm, durationMin) {
      const dist = Number(distanceKm) || 0;
      const dur = Number(durationMin) || 0;
      if (dist <= 0 || dur <= 0) return { pace: '--:-- /km', speed: '0.0 km/h' };
      const paceDecimal = dur / dist;
      const paceMin = Math.floor(paceDecimal);
      const paceSec = Math.round((paceDecimal - paceMin) * 60);
      const normalizedMin = paceSec === 60 ? paceMin + 1 : paceMin;
      const normalizedSec = paceSec === 60 ? 0 : paceSec;
      const speed = (dist / (dur / 60)).toFixed(1);
      return {
        pace: `${normalizedMin}'${String(normalizedSec).padStart(2, '0')}" /km`,
        speed: `${speed} km/h`
      };
    }

    function evaluateQuestProgress(quest) {
      if (quest.type === 'cardio') {
if (quest.goalMode === 'free_mode') return { percent: 100, isBossDefeated: false, validatedSets: 1, goalSets: 1, goalReps: 1, setDetails: [] };
        const start = Number(quest.startValue) || 0;
        const current = Number(quest.currentValue) || 0;
        const goal = Number(quest.goalValue) || 1;
        if (current >= goal) return { percent: 100, isBossDefeated: true, validatedSets: 1, goalSets: 1 };
        if (goal <= start) return { percent: 100, isBossDefeated: true, validatedSets: 1, goalSets: 1 };
        const pct = Math.round(((current - start) / (goal - start)) * 100);
        return { percent: Math.max(5, Math.min(99, pct)), isBossDefeated: false, validatedSets: 0, goalSets: 1 };
      }

      const goalMode = quest.goalMode || 'sets_reps';
if (goalMode === 'free_mode') return { percent: 100, isBossDefeated: false, validatedSets: 1, goalSets: 1, goalReps: 1, setDetails: [] };
      const goalSets = Math.max(1, Number(quest.goalSets) || 3);
      const goalReps = Math.max(1, Number(quest.goalReps) || Number(quest.goalValue) || 6);
      const setDetails = getSetDetailsArray(quest, goalSets, goalReps);
      const validatedSets = countValidatedSets(setDetails, goalReps);
      const bestReps = Math.max(...setDetails, Number(quest.currentValue) || 0);

      if (goalMode === 'weight_only') {
        const startKg = Number(quest.startValue) || 0;
        const currKg = Number(quest.currentValue) || 0;
        const goalKg = Number(quest.goalValue) || 1;
        if (currKg >= goalKg) {
          return { percent: 100, isBossDefeated: true, validatedSets, goalSets, goalReps, setDetails };
        }
        const ratio = goalKg > startKg ? (currKg - startKg) / (goalKg - startKg) : 0.5;
        return { percent: Math.max(5, Math.min(99, Math.round(ratio * 100))), isBossDefeated: false, validatedSets, goalSets, goalReps, setDetails };
      }

      const startAssist = Number(quest.startAssistanceKg) || 0;
      const currAssist = Number(quest.currentAssistanceKg) || 0;
      const goalAssist = Number(quest.goalAssistanceKg) || 0;
      const assistGoalMet = quest.unit !== 'reps' || currAssist <= goalAssist;

      let assistRatio = 1;
      if (quest.unit === 'reps') {
        if (startAssist > goalAssist) {
          assistRatio = Math.max(0, Math.min(1, (startAssist - currAssist) / (startAssist - goalAssist)));
        } else if (currAssist > goalAssist) {
          assistRatio = Math.max(0, 1 - (currAssist - goalAssist) / 25);
        }
      }

      if (goalMode === 'reps_only') {
        const startR = Number(quest.startValue) || 0;
        const targetR = goalReps;
        const repsMet = bestReps >= targetR;
        const loadMet = quest.unit !== 'kg' || (Number(quest.currentValue) || 0) >= (Number(quest.goalValue) || 0);

        if (repsMet && assistGoalMet && loadMet) {
          return { percent: 100, isBossDefeated: true, validatedSets, goalSets: 1, goalReps: targetR, setDetails };
        }
        const repRatio = targetR > startR ? Math.max(0, Math.min(1, (bestReps - startR) / (targetR - startR))) : Math.min(1, bestReps / Math.max(1, targetR));
        const combined = quest.unit === 'reps' && (startAssist > goalAssist || currAssist > goalAssist)
          ? repRatio * 0.65 + assistRatio * 0.35
          : repRatio;
        return { percent: Math.max(5, Math.min(99, Math.round(combined * 100))), isBossDefeated: false, validatedSets, goalSets: 1, goalReps: targetR, setDetails };
      }

      let achievedTargetRepsSum = 0;
      for (let i = 0; i < goalSets; i++) {
        const r = Number(setDetails[i]) || 0;
        achievedTargetRepsSum += Math.min(r, goalReps);
      }
      const setsRepsRatio = achievedTargetRepsSum / (goalSets * goalReps);
      const allSetsValidated = validatedSets >= goalSets;

      if (quest.unit === 'reps') {
        if (allSetsValidated && assistGoalMet) {
          return { percent: 100, isBossDefeated: true, validatedSets, goalSets, goalReps, setDetails };
        }
        const combined = startAssist > goalAssist || currAssist > goalAssist
          ? setsRepsRatio * 0.65 + assistRatio * 0.35
          : setsRepsRatio;
        return { percent: Math.max(5, Math.min(99, Math.round(combined * 100))), isBossDefeated: false, validatedSets, goalSets, goalReps, setDetails };
      } else {
        const startKg = Number(quest.startValue) || 0;
        const currKg = Number(quest.currentValue) || 0;
        const goalKg = Number(quest.goalValue) || 1;
        const loadGoalMet = currKg >= goalKg;
        let loadRatio = 1;
        if (goalKg > startKg) {
          loadRatio = Math.max(0, Math.min(1, (currKg - startKg) / (goalKg - startKg)));
        }
        if (loadGoalMet && allSetsValidated) {
          return { percent: 100, isBossDefeated: true, validatedSets, goalSets, goalReps, setDetails };
        }
        const combined = loadRatio * 0.55 + setsRepsRatio * 0.45;
        return { percent: Math.max(5, Math.min(99, Math.round(combined * 100))), isBossDefeated: false, validatedSets, goalSets, goalReps, setDetails };
      }
    }

    function compareWithPreviousSession(quest, currentEntry, prevEntry) {
      if (!prevEntry) {
        return {
          isFirst: true,
          improved: false,
          goalBeaten: Boolean(currentEntry.goalBeaten),
          badges: ['🌟 Première séance sur cet exercice'],
          prevSummary: null,
          currSummary: null
        };
      }

      const badges = [];
      let improved = false;

      if (quest.type === 'cardio') {
        const currVal = Number(currentEntry.value) || 0;
        const prevVal = Number(prevEntry.value) || 0;
        const diffVal = +(currVal - prevVal).toFixed(2);
        if (diffVal > 0) {
          improved = true;
          badges.push(`🏃 +${diffVal} ${quest.unit} parcourus`);
        }
        const currDur = Number(currentEntry.durationMin) || 0;
        const prevDur = Number(prevEntry.durationMin) || 0;
        if (currVal >= prevVal && currDur > 0 && prevDur > 0 && currDur < prevDur) {
          improved = true;
          badges.push(`⚡ -${prevDur - currDur} min (plus rapide)`);
        }
        return {
          isFirst: false,
          improved,
          goalBeaten: Boolean(currentEntry.goalBeaten || currVal >= (Number(quest.goalValue) || 999)),
          badges,
          prevSummary: `${prevVal} ${quest.unit} (${prevDur || 25} min)`,
          currSummary: `${currVal} ${quest.unit} (${currDur || 25} min)`
        };
      }

      const goalReps = Number(currentEntry.goalReps || quest.goalReps || quest.goalValue || 6);
      const goalSets = Number(currentEntry.goalSets || quest.goalSets || 3);
      const currSetsArr = getSetDetailsArray(currentEntry, goalSets, goalReps);
      const prevSetsArr = getSetDetailsArray(prevEntry, goalSets, goalReps);

      const currValidSets = countValidatedSets(currSetsArr, goalReps);
      const prevValidSets = countValidatedSets(prevSetsArr, goalReps);

      const currTotalReps = currSetsArr.reduce((a, b) => a + b, 0);
      const prevTotalReps = prevSetsArr.reduce((a, b) => a + b, 0);

      if (quest.unit === 'kg') {
        const currKg = Number(currentEntry.value) || 0;
        const prevKg = Number(prevEntry.value) || 0;
        const diffKg = +(currKg - prevKg).toFixed(1);
        if (diffKg > 0) {
          improved = true;
          badges.push(`🏋️ +${diffKg} kg sur la barre`);
        }
      } else if (quest.unit === 'reps') {
        const currAssist = Number(currentEntry.assistanceKg) || 0;
        const prevAssist = Number(prevEntry.assistanceKg) || 0;
        if (currAssist < prevAssist) {
          improved = true;
          badges.push(`🪢 -${+(prevAssist - currAssist).toFixed(1)} kg d'aide élastique`);
        }
      }

      if (currValidSets > prevValidSets) {
        improved = true;
        badges.push(`🔴 +${currValidSets - prevValidSets} série(s) cible(s) validée(s)`);
      }

      if (currTotalReps > prevTotalReps) {
        improved = true;
        badges.push(`🔁 +${currTotalReps - prevTotalReps} reps au volume total`);
      }

      const prevSummary = quest.unit === 'kg'
        ? `${prevEntry.value} kg • [${formatSetsBreakdown(prevSetsArr)}]`
        : `[${formatSetsBreakdown(prevSetsArr)}] (${Number(prevEntry.assistanceKg) > 0 ? `Aide ${prevEntry.assistanceKg}kg` : 'Strict 0kg'})`;

      const currSummary = quest.unit === 'kg'
        ? `${currentEntry.value} kg • [${formatSetsBreakdown(currSetsArr)}]`
        : `[${formatSetsBreakdown(currSetsArr)}] (${Number(currentEntry.assistanceKg) > 0 ? `Aide ${currentEntry.assistanceKg}kg` : 'Strict 0kg'})`;

      return {
        isFirst: false,
        improved,
        goalBeaten: Boolean(currentEntry.goalBeaten),
        badges,
        prevSummary,
        currSummary
      };
    }

    // ==========================================
    // EFFETS SONORES : BERCEUSE DE RONDOUDOU
    // ==========================================
    function playGameSound(type, enabled = true) {
      if (!enabled || typeof window === 'undefined') return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        const makeTone = (freq, start, duration, wave = 'sine', gainVal = 0.12) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = wave;
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(gainVal, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + duration);
        };

        if (type === 'xp') {
          makeTone(523.25, now, 0.12, 'sine', 0.12);
          makeTone(659.25, now + 0.1, 0.15, 'sine', 0.13);
          makeTone(783.99, now + 0.2, 0.24, 'triangle', 0.14);
        } else if (type === 'boss') {
          makeTone(659.25, now, 0.22, 'sine', 0.15);
          makeTone(783.99, now + 0.24, 0.22, 'sine', 0.15);
          makeTone(739.99, now + 0.48, 0.22, 'sine', 0.15);
          makeTone(783.99, now + 0.72, 0.22, 'sine', 0.15);
          makeTone(880.0, now + 0.96, 0.45, 'triangle', 0.18);
        } else if (type === 'click') {
          makeTone(680, now, 0.05, 'sine', 0.07);
        }
      } catch (e) {}
    }
